 memori jangka panjang baru), dan HIPOTALAMUS (lapar, haus, suhu tubuh, dorongan seksual, serta pengendali kelenjar pituitari).","KORTEKS SEREBRAL adalah lapisan terluar otak dan pusat fungsi mental tingkat tinggi, terbagi menjadi empat lobus.","LOBUS FRONTAL: perencanaan, pengambilan keputusan, pengendalian impuls, kepribadian, serta area Broca untuk produksi bicara.","LOBUS PARIETAL: sensasi tubuh (sentuhan, suhu, nyeri) dan orientasi ruang; berisi korteks somatosensorik.","LOBUS TEMPORAL: pendengaran, pemahaman bahasa melalui area Wernicke, dan pengenalan wajah.","LOBUS OKSIPITAL: pemrosesan informasi visual.","LATERALISASI: hemisfer kiri umumnya lebih dominan untuk bahasa dan analisis logis, hemisfer kanan untuk kemampuan spasial dan pengenalan pola. Namun keduanya terus bekerja sama melalui KORPUS KALOSUM, sehingga anggapan 'orang otak kiri' versus 'orang otak kanan' adalah penyederhanaan yang keliru.","NEUROPLASTISITAS adalah kemampuan otak mengubah struktur dan koneksinya sebagai respons terhadap pengalaman, pembelajaran, atau cedera. Paling besar pada masa anak-anak, tetapi berlanjut sepanjang hidup."]},{"judul":"Sistem Endokrin dan Teknik Pencitraan Otak","poin":["Sistem endokrin melepaskan HORMON ke aliran darah. Dibandingkan sinyal saraf, kerjanya lebih LAMBAT tetapi efeknya bertahan LEBIH LAMA.","Hipotalamus mengendalikan KELENJAR PITUITARI yang dijuluki 'kelenjar induk' karena mengatur kelenjar endokrin lainnya.","KELENJAR ADRENAL melepaskan adrenalin (epinefrin) dan kortisol saat stres, menyiapkan tubuh untuk bereaksi cepat.","KELENJAR TIROID mengatur laju metabolisme, sedangkan PANKREAS mengatur kadar gula darah melalui insulin.","EEG merekam aktivitas listrik otak dengan resolusi waktu yang sangat baik dan banyak dipakai dalam penelitian tidur.","fMRI menunjukkan area otak yang aktif berdasarkan aliran darah dengan resolusi spasial yang baik; CT dan MRI menampilkan struktur otak; PET scan memetakan aktivitas metabolik.","Studi lesi, yaitu mempelajari orang dengan kerusakan otak tertentu, secara historis menjadi sumber utama pengetahuan tentang fungsi area otak - contohnya kasus Phineas Gage."]}],"ringkasan":["Neuron: dendrit menerima, akson mengirim; sinyal menyeberangi sinaps lewat neurotransmiter.","Potensial aksi bersifat ALL-OR-NONE; intensitas stimulus dikodekan lewat frekuensi, bukan kekuatan.","Ingat pasangan kunci: dopamin-reward, serotonin-suasana hati, GABA-inhibitorik, glutamat-eksitatorik.","Empat lobus: frontal (perencanaan), parietal (sensasi tubuh), temporal (pendengaran/bahasa), oksipital (penglihatan).","Neuroplastisitas membuat otak terus berubah sepanjang hidup; anggapan 'otak kiri vs otak kanan' adalah penyederhanaan keliru."],"tokoh":[{"nama":"Phineas Gage","kontribusi":"Kasus klasik cedera lobus frontal yang mengubah kepribadian - bukti awal peran lobus frontal."},{"nama":"Paul Broca","kontribusi":"Menemukan area otak (area Broca) yang berperan dalam produksi bicara."},{"nama":"Carl Wernicke","kontribusi":"Menemukan area otak yang berperan dalam pemahaman bahasa."},{"nama":"Sperry & Gazzaniga","kontribusi":"Penelitian split-brain yang mengungkap lateralisasi fungsi hemisfer otak."},{"nama":"Santiago Ramon y Cajal","kontribusi":"Menetapkan bahwa sistem saraf tersusun dari sel-sel terpisah (neuron), bukan jaringan menyatu."}],"istilah":[{"term":"Neuron","definisi":"Sel saraf yang menjadi unit dasar sistem saraf."},{"term":"Sinaps","definisi":"Celah antar-neuron tempat neurotransmiter dilepaskan."},{"term":"Neurotransmiter","definisi":"Zat kimia pembawa sinyal antar-neuron."},{"term":"Potensial aksi","definisi":"Impuls listrik yang menjalar sepanjang akson dengan prinsip all-or-none."},{"term":"Selubung mielin","definisi":"Lapisan lemak pembungkus akson yang mempercepat penghantaran impuls."},{"term":"Amigdala","definisi":"Struktur limbik yang berperan penting dalam pemrosesan emosi, terutama rasa takut."},{"term":"Hipokampus","definisi":"Struktur limbik yang penting untuk pembentukan memori jangka panjang baru."},{"term":"Talamus","definisi":"Stasiun relai yang meneruskan informasi indrawi ke area otak yang tepat."},{"term":"Lobus frontal","definisi":"Bagian korteks yang mengatur perencanaan, pengambilan keputusan, dan pengendalian diri."},{"term":"Sistem saraf simpatis","definisi":"Cabang otonom yang menyiapkan tubuh menghadapi ancaman (fight or flight)."},{"term":"Neuroplastisitas","definisi":"Kemampuan otak mengubah struktur dan koneksinya berdasarkan pengalaman."},{"term":"Epigenetika","definisi":"Kajian tentang bagaimana lingkungan memengaruhi ekspresi gen tanpa mengubah urutan DNA."}],"quiz":[{"soal":"Bagian neuron yang berfungsi menerima sinyal dari neuron lain adalah...","pilihan":["Akson","Dendrit","Badan sel","Selubung mielin"],"jawaban":2,"penjelasan":"Dendrit adalah cabang bercabang yang menerima sinyal masuk dari neuron-neuron lain."},{"soal":"Prinsip all-or-none pada potensial aksi berarti...","pilihan":["Neuron menembak dengan kekuatan bervariasi sesuai stimulus","Neuron menembak penuh atau tidak sama sekali","Neuron hanya menembak saat tidur","Neuron selalu menembak bersamaan"],"jawaban":2,"penjelasan":"Neuron menembak dengan kekuatan penuh atau tidak sama sekali; intensitas stimulus dikodekan lewat frekuensi penembakan."},{"soal":"Neurotransmiter inhibitorik utama di otak yang berperan menenangkan aktivitas saraf adalah...","pilihan":["Glutamat","Dopamin","GABA","Asetilkolin"],"jawaban":3,"penjelasan":"GABA adalah neurotransmiter inhibitorik utama; banyak obat anti-cemas bekerja dengan meningkatkan efeknya."},{"soal":"Struktur otak yang paling berperan dalam pembentukan memori jangka panjang baru adalah...","pilihan":["Amigdala","Hipokampus","Lobus oksipital","Serebelum"],"jawaban":2,"penjelasan":"Kerusakan hipokampus menyebabkan ketidakmampuan membentuk memori baru, yang dikenal sebagai amnesia anterograde."},{"soal":"Cabang sistem saraf otonom yang menyiapkan tubuh menghadapi ancaman adalah...","pilihan":["Parasimpatis","Simpatis","Somatik","Pusat"],"jawaban":2,"penjelasan":"Sistem simpatis memicu respons fight or flight, sedangkan parasimpatis yang menenangkan tubuh kembali."},{"soal":"Lobus yang bertanggung jawab memproses informasi visual adalah...","pilihan":["Frontal","Parietal","Temporal","Oksipital"],"jawaban":4,"penjelasan":"Lobus oksipital di bagian belakang otak mengolah informasi penglihatan."},{"soal":"Kemampuan otak mengubah struktur dan koneksinya sebagai respons terhadap pengalaman disebut...","pilihan":["Neuroplastisitas","Lateralisasi","Reuptake","Transduksi"],"jawaban":1,"penjelasan":"Neuroplastisitas memungkinkan otak beradaptasi terhadap pembelajaran dan pemulihan dari cedera."},{"soal":"Selubung mielin pada akson berfungsi untuk...","pilihan":["Menerima sinyal dari neuron lain","Mempercepat penghantaran impuls saraf","Menghasilkan neurotransmiter","Menyimpan memori"],"jawaban":2,"penjelasan":"Selubung mielin adalah lapisan lemak yang membungkus akson dan mempercepat penjalaran impuls. Kerusakannya terjadi pada multiple sclerosis."},{"soal":"Menarik tangan dari benda panas sebelum otak sempat memproses rasa sakit dimungkinkan oleh...","pilihan":["Refleks yang diproses di sumsum tulang belakang","Kerja lambat sistem endokrin","Neuroplastisitas","Lateralisasi otak"],"jawaban":1,"penjelasan":"Refleks diproses di sumsum tulang belakang tanpa menunggu perintah otak, sehingga responsnya jauh lebih cepat."},{"soal":"Dibandingkan sinyal saraf, cara kerja hormon dalam sistem endokrin bersifat...","pilihan":["Lebih cepat dengan efek singkat","Lebih lambat tetapi efeknya bertahan lebih lama","Sama persis kecepatannya","Tidak memengaruhi perilaku"],"jawaban":2,"penjelasan":"Hormon dilepas ke aliran darah sehingga bekerja lebih lambat daripada impuls saraf, tetapi efeknya bertahan jauh lebih lama."}],"kasus":{"skenario":"Setelah kecelakaan kerja yang merusak bagian depan otaknya, seorang pria yang dulu dikenal santun dan terencana kini menjadi impulsif, sulit menahan emosi, dan tidak mampu menyusun rencana sederhana. Namun kemampuan berbicara, mengingat masa lalu, dan penglihatannya tetap normal.","pertanyaan":"Bagian otak manakah yang paling mungkin mengalami kerusakan?","pilihan":["Lobus oksipital","Lobus frontal","Lobus temporal","Serebelum"],"jawaban":2,"penjelasan":"Lobus frontal mengatur perencanaan, pengendalian impuls, dan kepribadian. Pola gejala ini sangat mirip dengan kasus klasik Phineas Gage."},"isian":[{"kalimat":"Zat kimia yang menyeberangi sinaps untuk membawa sinyal ke neuron berikutnya disebut ___.","jawaban":["neurotransmiter"]},{"kalimat":"Struktur limbik yang berperan penting memproses rasa takut adalah ___.","jawaban":["amigdala"]},{"kalimat":"Hormon yang dilepaskan kelenjar adrenal saat stres dan dikenal sebagai hormon stres adalah ___.","jawaban":["kortisol"]},{"kalimat":"Kemampuan otak mengubah struktur dan koneksinya berdasarkan pengalaman disebut ___.","jawaban":["neuroplastisitas","plastisitas"]}]},{"nomor":4,"id":"ch04","judul":"Kesadaran","ikon":"moon","pendahuluan":"Kesadaran adalah kesadaran akan diri dan lingkungan, dan ia bergerak dalam sebuah rentang: dari terjaga penuh, mengantuk, tidur, bermimpi, hingga keadaan yang diubah oleh zat tertentu. Bab ini membahas ritme sirkadian, tahapan tidur, teori mimpi, gangguan tidur, dan zat psikoaktif.","materi":[{"judul":"Ritme Sirkadian dan Pengaturan Tidur","poin":["RITME SIRKADIAN adalah siklus biologis internal berdurasi kira-kira 24 jam yang mengatur pola tidur-bangun, suhu tubuh, dan sekresi hormon.","Pusat pengendalinya adalah SUPRACHIASMATIC NUCLEUS (SCN) di hipotalamus, yang menerima informasi cahaya langsung dari mata.","Saat gelap, SCN memicu kelenjar pineal melepaskan MELATONIN yang menimbulkan rasa kantuk. Cahaya, termasuk cahaya biru dari layar gawai, menekan produksi melatonin dan menunda kantuk.","JET LAG dan kerja shift terjadi karena ketidakselarasan antara ritme sirkadian internal dengan jadwal eksternal.","UTANG TIDUR (sleep debt) menumpuk saat kita kurang tidur berulang kali dan tidak sepenuhnya terbayar hanya dengan tidur panjang di akhir pekan.","Remaja mengalami pergeseran ritme sirkadian alami menjadi lebih malam. Inilah salah satu alasan mengapa jam sekolah yang terlalu pagi kerap bermasalah bagi mereka."]},{"judul":"Tahapan Tidur","poin":["Tidur terdiri atas tidur NREM (tahap 1 sampai 3) dan tidur REM, yang berulang dalam siklus sekitar 90 menit sepanjang malam.","NREM 1: tahap transisi ringan menuju tidur; dapat muncul sensasi seperti terjatuh (hypnic jerk). Sangat mudah terbangun.","NREM 2: tidur yang lebih mantap, ditandai gelombang khas sleep spindle dan K-complex. Inilah tahap dengan porsi waktu terbesar sepanjang malam.","NREM 3: tidur gelombang lambat (delta) atau tidur terdalam. Paling penting untuk pemulihan fisik, pertumbuhan, dan penguatan sistem imun; paling sulit dibangunkan pada tahap ini.","REM (Rapid Eye Movement): mata bergerak cepat, aktivitas otak menyerupai keadaan terjaga, dan mimpi paling jelas terjadi di sini. Otot rangka mengalami kelumpuhan sementara (ATONIA) yang mencegah kita memerankan mimpi.","Porsi REM bertambah panjang menjelang pagi, sedangkan NREM 3 lebih dominan pada paruh pertama malam.","REM berperan penting dalam konsolidasi memori dan pengolahan emosi. Bila kurang tidur REM, tubuh cenderung mengalami REM rebound pada kesempatan tidur berikutnya."]},{"judul":"Fungsi Tidur dan Dampak Kurang Tidur","poin":["Teori RESTORATIF: tidur memulihkan sumber daya tubuh, memperbaiki jaringan, dan membersihkan produk sisa metabolik dari otak.","Teori KONSOLIDASI MEMORI: tidur memperkuat dan menata ulang memori yang terbentuk sepanjang hari. Belajar lalu tidur cukup jauh lebih efektif daripada begadang.","Teori EVOLUSIONER atau adaptif: tidur menghemat energi dan menjaga organisme tetap aman pada waktu yang berbahaya untuk beraktivitas.","Dampak kurang tidur: penurunan konsentrasi dan waktu reaksi, suasana hati memburuk, kualitas pengambilan keputusan menurun, sistem imun melemah, serta meningkatnya risiko kecelakaan.","Kurang tidur kronis juga dikaitkan dengan peningkatan risiko masalah metabolik dan kardiovaskular.","Higiene tidur yang baik: jadwal tidur konsisten, kamar gelap dan sejuk, hindari kafein pada sore hari, serta kurangi paparan layar menjelang tidur."]},{"judul":"Mimpi dan Teorinya","poin":["Teori PSIKOANALISIS (Freud): mimpi adalah 'jalan raya menuju alam bawah sadar'. Freud membedakan isi manifes (jalan cerita yang diingat) dan isi laten (makna simbolis tersembunyi). Pandangan ini kini banyak dikritik karena sulit diuji secara ilmiah.","Teori AKTIVASI-SINTESIS (Hobson & McCarley): selama REM, batang otak mengirim sinyal saraf yang relatif acak, lalu korteks berusaha menyusun cerita yang masuk akal dari sinyal tersebut.","Teori KONSOLIDASI MEMORI dan pemrosesan emosi: mimpi membantu menata informasi dan meredakan muatan emosional pengalaman harian.","MIMPI LUCID adalah keadaan ketika seseorang menyadari bahwa dirinya sedang bermimpi, dan kadang dapat mengendalikan jalan cerita mimpinya."]},{"judul":"Gangguan Tidur","poin":["INSOMNIA: kesulitan memulai atau mempertahankan tidur yang berlangsung menetap dan mengganggu fungsi sehari-hari.","SLEEP APNEA: napas berhenti berulang kali saat tidur sehingga penderita terbangun singkat berkali-kali tanpa menyadarinya, menyebabkan kantuk berat di siang hari.","NARKOLEPSI: serangan kantuk yang tidak tertahankan di siang hari, kadang disertai katapleksi berupa kehilangan tonus otot secara mendadak.","PARASOMNIA: perilaku tidak biasa saat tidur, seperti somnambulisme (berjalan sambil tidur) dan night terror, yang umumnya terjadi pada tidur NREM dalam.","REM sleep behavior disorder: atonia REM tidak berfungsi sehingga penderita benar-benar memerankan isi mimpinya."]},{"judul":"Zat Psikoaktif dan Kesadaran","poin":["DEPRESAN (alkohol, benzodiazepin, barbiturat) memperlambat aktivitas sistem saraf pusat, menurunkan hambatan diri, serta mengganggu koordinasi dan penilaian.","STIMULAN (kafein, nikotin, amfetamin, kokain) meningkatkan aktivitas saraf, kewaspadaan, dan energi; banyak di antaranya bekerja melalui sistem dopamin.","OPIOID (morfin, heroin) meredakan nyeri dan menimbulkan euforia dengan meniru endorfin alami tubuh; berisiko tinggi menimbulkan ketergantungan.","HALUSINOGEN (LSD, psilocybin) secara drastis mengubah persepsi, pikiran, dan pengalaman terhadap waktu.","TOLERANSI berarti dibutuhkan dosis makin besar untuk memperoleh efek yang sama, sedangkan WITHDRAWAL adalah gejala tidak menyenangkan saat penggunaan dihentikan.","Ketergantungan FISIK ditandai gejala withdrawal pada tubuh, sedangkan ketergantungan PSIKOLOGIS ditandai dorongan kuat menggunakan zat untuk mengatasi perasaan tertentu.","Sebagian besar zat adiktif memengaruhi jalur reward dopaminergik di otak, yang menjelaskan mengapa dorongan menggunakannya terasa begitu kuat."]}],"ringkasan":["Ritme sirkadian (kira-kira 24 jam) dikendalikan SCN di hipotalamus dan dipengaruhi cahaya lewat melatonin.","Siklus tidur kira-kira 90 menit: NREM 1-3 lalu REM. NREM 3 memulihkan fisik, REM untuk mimpi dan konsolidasi memori.","Atonia REM mencegah kita memerankan isi mimpi.","Teori mimpi: psikoanalisis (Freud), aktivasi-sintesis (Hobson & McCarley), dan konsolidasi memori.","Zat psikoaktif: depresan memperlambat, stimulan mempercepat, halusinogen mengubah persepsi. Toleransi dan withdrawal menandai ketergantungan."],"tokoh":[{"nama":"Kleitman & Aserinsky","kontribusi":"Menemukan tidur REM dan kaitannya dengan mimpi."},{"nama":"Sigmund Freud","kontribusi":"Teori mimpi sebagai pemenuhan keinginan bawah sadar (isi manifes dan isi laten)."},{"nama":"Hobson & McCarley","kontribusi":"Teori aktivasi-sintesis: mimpi sebagai upaya otak memaknai sinyal saraf acak."},{"nama":"William Dement","kontribusi":"Pelopor riset gangguan tidur modern dan kajian dampak kurang tidur."}],"istilah":[{"term":"Ritme sirkadian","definisi":"Siklus biologis internal kira-kira 24 jam yang mengatur pola tidur-bangun."},{"term":"Suprachiasmatic nucleus","definisi":"Area hipotalamus yang menjadi jam biologis utama tubuh."},{"term":"Melatonin","definisi":"Hormon dari kelenjar pineal yang membantu menimbulkan rasa kantuk."},{"term":"Tidur REM","definisi":"Tahap tidur dengan gerakan mata cepat, aktivitas otak tinggi, dan mimpi paling jelas."},{"term":"Atonia REM","definisi":"Kelumpuhan otot sementara saat REM yang mencegah kita memerankan mimpi."},{"term":"Tidur gelombang lambat","definisi":"Tidur NREM tahap 3 yang paling dalam dan paling memulihkan fisik."},{"term":"Insomnia","definisi":"Gangguan sulit memulai atau mempertahankan tidur secara menetap."},{"term":"Sleep apnea","definisi":"Gangguan tidur berupa berhentinya napas berulang kali saat tidur."},{"term":"Narkolepsi","definisi":"Gangguan berupa serangan kantuk yang tidak tertahankan di siang hari."},{"term":"Zat psikoaktif","definisi":"Zat yang mengubah fungsi otak sehingga mengubah persepsi, suasana hati, atau kesadaran."},{"term":"Toleransi","definisi":"Kondisi ketika dibutuhkan dosis zat lebih besar untuk mencapai efek yang sama."},{"term":"Withdrawal","definisi":"Gejala tidak menyenangkan yang muncul saat penggunaan zat dihentikan."}],"quiz":[{"soal":"Mimpi paling jelas dan intens biasanya terjadi pada tahap...","pilihan":["NREM 1","NREM 3","REM","Saat baru tertidur"],"jawaban":3,"penjelasan":"Tidur REM ditandai aktivitas otak yang tinggi menyerupai keadaan terjaga, dan di sinilah mimpi paling jelas muncul."},{"soal":"Struktur otak yang berfungsi sebagai jam biologis utama pengatur ritme sirkadian adalah...","pilihan":["Amigdala","Suprachiasmatic nucleus","Serebelum","Korpus kalosum"],"jawaban":2,"penjelasan":"SCN di hipotalamus menerima informasi cahaya dari mata dan mengatur siklus tidur-bangun."},{"soal":"Tahap tidur yang paling penting untuk pemulihan fisik dan paling sulit dibangunkan adalah...","pilihan":["NREM 1","NREM 2","NREM 3","REM"],"jawaban":3,"penjelasan":"NREM 3 atau tidur gelombang lambat adalah tahap terdalam yang paling berperan dalam pemulihan fisik."},{"soal":"Kelumpuhan otot sementara saat tidur REM berfungsi untuk...","pilihan":["Menghemat energi tubuh","Mencegah kita memerankan isi mimpi","Mempercepat pernapasan","Menurunkan suhu tubuh"],"jawaban":2,"penjelasan":"Atonia REM mencegah tubuh bergerak sesuai isi mimpi. Bila mekanisme ini gagal, muncul REM sleep behavior disorder."},{"soal":"Zat yang memperlambat aktivitas sistem saraf pusat, seperti alkohol, disebut...","pilihan":["Stimulan","Depresan","Halusinogen","Opioid"],"jawaban":2,"penjelasan":"Depresan menekan aktivitas sistem saraf pusat sehingga memperlambat respons dan menurunkan hambatan diri."},{"soal":"Menurut teori aktivasi-sintesis, mimpi terjadi karena...","pilihan":["Ekspresi keinginan bawah sadar yang tersamar","Otak berusaha memaknai sinyal saraf yang relatif acak saat REM","Proses pencernaan makanan saat tidur","Sinyal suara dari lingkungan sekitar"],"jawaban":2,"penjelasan":"Hobson dan McCarley berpendapat batang otak mengirim sinyal acak saat REM, lalu korteks menyusunnya menjadi sebuah cerita."},{"soal":"Kebutuhan akan dosis kafein yang makin besar untuk merasa segar seperti sebelumnya adalah contoh dari...","pilihan":["Toleransi","Withdrawal","Insomnia","Narkolepsi"],"jawaban":1,"penjelasan":"Toleransi terjadi ketika tubuh menyesuaikan diri sehingga dibutuhkan dosis lebih besar untuk efek yang sama."},{"soal":"Cahaya biru dari layar gawai sebelum tidur dapat mengganggu tidur karena...","pilihan":["Meningkatkan produksi melatonin","Menekan produksi melatonin sehingga menunda kantuk","Mempercepat tidur REM","Menyebabkan sleep apnea"],"jawaban":2,"penjelasan":"Cahaya, termasuk cahaya biru layar, menekan pelepasan melatonin oleh kelenjar pineal sehingga rasa kantuk tertunda."},{"soal":"Tahap tidur dengan porsi waktu TERBESAR sepanjang malam adalah...","pilihan":["NREM 1","NREM 2","NREM 3","REM"],"jawaban":2,"penjelasan":"NREM 2, yang ditandai sleep spindle dan K-complex, menempati porsi waktu terbesar sepanjang malam."},{"soal":"Menurut teori konsolidasi memori, mengapa begadang untuk belajar justru merugikan?","pilihan":["Karena tidur membuat kita lupa","Karena konsolidasi memori terjadi selama tidur","Karena belajar malam selalu tidak efektif","Karena kafein menghambat encoding"],"jawaban":2,"penjelasan":"Tidur memperkuat dan menata ulang memori yang terbentuk sepanjang hari, sehingga mengorbankan tidur justru merusak proses penyimpanan."}],"kasus":{"skenario":"Seorang perawat yang bekerja shift malam selama enam bulan mengeluh sulit tidur di siang hari meski merasa sangat lelah, mengantuk berat saat jam kerja, mudah lupa, dan suasana hatinya memburuk. Pola makannya juga menjadi tidak teratur.","pertanyaan":"Penjelasan psikologis yang paling tepat untuk kondisi perawat ini adalah...","pilihan":["Ia mengalami ketergantungan zat psikoaktif","Ritme sirkadiannya tidak selaras dengan jadwal kerja dan tidurnya, disertai penumpukan utang tidur","Ia mengalami narkolepsi","Ia kekurangan neurotransmiter dopamin"],"jawaban":2,"penjelasan":"Bekerja malam bertentangan dengan ritme sirkadian alami yang diatur siklus terang-gelap. Ketidakselarasan ini ditambah utang tidur menjelaskan keluhan kantuk, gangguan memori, dan perubahan suasana hatinya."},"isian":[{"kalimat":"Tahap tidur dengan gerakan mata cepat dan mimpi paling intens disebut tidur ___.","jawaban":["rem"]},{"kalimat":"Hormon dari kelenjar pineal yang membantu menimbulkan rasa kantuk adalah ___.","jawaban":["melatonin"]},{"kalimat":"Gangguan tidur berupa berhentinya napas berulang kali saat tidur disebut sleep ___.","jawaban":["apnea","apnoe"]},{"kalimat":"Kondisi ketika dibutuhkan dosis lebih besar untuk mendapat efek yang sama disebut ___.","jawaban":["toleransi"]}]},{"nomor":5,"id":"ch05","judul":"Sensasi dan Persepsi","ikon":"eye","pendahuluan":"Sensasi adalah proses indra menangkap energi dari lingkungan, sedangkan persepsi adalah proses otak menafsirkannya menjadi pengalaman yang bermakna. Bab ini membahas ambang penginderaan, cara kerja tiap indra, prinsip organisasi persepsi, dan bagaimana harapan membentuk apa yang kita lihat.","materi":[{"judul":"Dari Sensasi Menjadi Persepsi","poin":["SENSASI adalah proses reseptor indra menerima energi fisik (cahaya, gelombang suara, molekul kimia) dan mengubahnya menjadi sinyal saraf.","PERSEPSI adalah proses otak mengorganisasi dan menafsirkan sinyal tersebut menjadi objek dan peristiwa yang bermakna.","TRANSDUKSI adalah langkah kunci yang menjembatani keduanya: pengubahan energi fisik menjadi impuls saraf yang dapat dibaca otak.","PEMROSESAN BOTTOM-UP dimulai dari data indrawi mentah lalu dibangun menjadi persepsi utuh. PEMROSESAN TOP-DOWN bergerak sebaliknya: pengetahuan, harapan, dan konteks membentuk cara kita menafsirkan data indrawi.","Kedua arah pemrosesan itu bekerja bersamaan. Itulah sebabnya tulisan tangan yang buruk tetap bisa dibaca bila kalimatnya sudah bisa ditebak."]},{"judul":"Ambang dan Adaptasi","poin":["AMBANG ABSOLUT adalah intensitas stimulus terkecil yang dapat dideteksi pada 50 persen kesempatan.","AMBANG BEDA atau just noticeable difference (JND) adalah perbedaan terkecil antara dua stimulus yang masih dapat dibedakan.","HUKUM WEBER menyatakan bahwa ambang beda bersifat PROPORSIONAL, bukan absolut. Menambah 1 kg pada beban 5 kg terasa jelas, tetapi menambah 1 kg pada beban 50 kg hampir tidak terasa.","ADAPTASI SENSORIK adalah penurunan kepekaan terhadap stimulus yang konstan. Karena itu kita berhenti menyadari bau parfum sendiri atau suara kipas angin setelah beberapa menit.","Adaptasi bermanfaat secara evolusioner karena mengarahkan perhatian pada PERUBAHAN di lingkungan, yang biasanya lebih penting daripada kondisi yang menetap.","PERSEPSI SUBLIMINAL adalah stimulus di bawah ambang sadar. Riset menunjukkan pengaruhnya sangat lemah dan berumur pendek, jauh dari klaim populer tentang 'iklan subliminal yang mengendalikan pikiran'.","TEORI DETEKSI SINYAL menjelaskan bahwa deteksi stimulus lemah bergantung tidak hanya pada intensitasnya, tetapi juga pada harapan, motivasi, dan tingkat kewaspadaan pengamat."]},{"judul":"Penglihatan","poin":["Cahaya masuk melalui kornea dan pupil, difokuskan oleh lensa, lalu jatuh ke RETINA di bagian belakang bola mata.","Retina memiliki dua jenis fotoreseptor: SEL BATANG (rod) yang sangat peka pada cahaya redup namun tidak mendeteksi warna, dan SEL KERUCUT (cone) yang berfungsi optimal pada cahaya terang serta memungkinkan penglihatan warna dan detail halus.","Sel kerucut terpusat di FOVEA, titik penglihatan paling tajam. Itulah sebabnya kita menggerakkan mata agar objek jatuh tepat di fovea.","BINTIK BUTA adalah titik tempat saraf optik meninggalkan retina sehingga tidak ada fotoreseptor di sana. Otak mengisi celah ini secara otomatis sehingga kita tidak menyadarinya.","TEORI TRIKROMATIK (Young-Helmholtz): terdapat tiga jenis sel kerucut yang peka pada panjang gelombang merah, hijau, dan biru; kombinasi ketiganya menghasilkan seluruh spektrum warna.","TEORI PROSES-LAWAN (opponent-process): sel saraf bekerja dalam pasangan berlawanan (merah-hijau, biru-kuning, hitam-putih). Teori ini menjelaskan fenomena AFTERIMAGE, yaitu bayangan warna komplementer setelah menatap warna tertentu terlalu lama.","Kedua teori itu tidak saling meniadakan: trikromatik menjelaskan proses di tingkat retina, proses-lawan menjelaskan proses setelahnya di jalur saraf dan otak."]},{"judul":"Pendengaran dan Indra Lain","poin":["Gelombang suara memiliki AMPLITUDO yang dipersepsi sebagai kenyaringan, dan FREKUENSI yang dipersepsi sebagai tinggi-rendah nada (pitch).","Gelombang suara menggetarkan gendang telinga, diperkuat oleh tiga tulang pendengaran di telinga tengah, lalu diteruskan ke KOKLEA berisi cairan di telinga dalam tempat terjadinya transduksi oleh sel rambut.","Kerusakan sel rambut akibat paparan suara keras bersifat PERMANEN karena sel rambut manusia tidak beregenerasi.","PENCIUMAN (olfaktori) adalah satu-satunya indra yang sinyalnya tidak melewati talamus lebih dulu, melainkan langsung menuju sistem limbik. Inilah sebabnya bau sangat kuat memicu emosi dan kenangan.","PENGECAP mengenali lima rasa dasar: manis, asin, asam, pahit, dan umami. Sebagian besar 'rasa' makanan sebenarnya berasal dari penciuman, itulah sebabnya makanan terasa hambar saat flu.","INDRA KULIT mencakup sentuhan, tekanan, suhu, dan nyeri. TEORI GERBANG NYERI (gate-control theory) menjelaskan bahwa sinyal nyeri dapat 'ditutup' oleh stimulasi saraf lain, sehingga mengusap area yang terbentur terasa meringankan.","KINESTESIA memberi informasi posisi bagian tubuh, sedangkan SISTEM VESTIBULAR di telinga dalam mengatur keseimbangan dan orientasi tubuh."]},{"judul":"Prinsip Organisasi Persepsi (Gestalt)","poin":["Prinsip dasar Gestalt: keseluruhan lebih dari sekadar jumlah bagian-bagiannya. Otak secara otomatis mengorganisasi stimulus menjadi pola bermakna.","FIGURE-GROUND: kita otomatis memisahkan objek utama (figure) dari latar belakangnya (ground). Gambar ambigu seperti vas Rubin bermain dengan prinsip ini.","KEDEKATAN (proximity): elemen yang berdekatan cenderung dipersepsi sebagai satu kelompok.","KEMIRIPAN (similarity): elemen yang mirip bentuk atau warnanya dikelompokkan bersama.","PENUTUPAN (closure): otak melengkapi bagian yang hilang agar bentuk terlihat utuh.","KONTINUITAS (continuity): kita cenderung mempersepsi garis sebagai alur yang mulus dan berkesinambungan."]},{"judul":"Persepsi Kedalaman dan Konstansi","poin":["PETUNJUK BINOKULAR memerlukan kedua mata: DISPARITAS RETINA (perbedaan kecil bayangan di kedua mata) dan KONVERGENSI (derajat kedua mata memutar ke dalam saat melihat objek dekat).","PETUNJUK MONOKULAR cukup dengan satu mata: ukuran relatif, tumpang tindih (interposisi), perspektif linear, gradien tekstur, dan bayangan. Inilah yang dipakai pelukis untuk menciptakan kesan kedalaman pada kanvas datar.","KONSTANSI PERSEPSI membuat kita mempersepsi objek sebagai stabil meski bayangan retinanya berubah. Pintu tetap dipersepsi persegi panjang meski saat terbuka bayangannya berbentuk trapesium.","ILUSI OPTIK terjadi ketika mekanisme persepsi yang biasanya membantu justru menghasilkan penafsiran keliru, misalnya ilusi Muller-Lyer dan ilusi Ponzo.","PERCEPTUAL SET adalah kesiapan mental untuk mempersepsi sesuatu dengan cara tertentu berdasarkan pengalaman, budaya, dan harapan. Pengalaman budaya bahkan memengaruhi seberapa kuat seseorang tertipu ilusi tertentu."]}],"ringkasan":["Sensasi menangkap, persepsi menafsirkan; transduksi adalah jembatan keduanya.","Bottom-up berangkat dari data indrawi, top-down dari pengetahuan dan harapan. Keduanya bekerja bersamaan.","Hukum Weber: ambang beda bersifat PROPORSIONAL, bukan jumlah absolut.","Teori trikromatik menjelaskan proses di retina; teori proses-lawan menjelaskan afterimage.","Prinsip Gestalt (figure-ground, proximity, similarity, closure) menunjukkan otak mengorganisasi stimulus jadi pola bermakna."],"tokoh":[{"nama":"Gustav Fechner & Ernst Weber","kontribusi":"Pendiri psikofisika; merumuskan hubungan antara intensitas stimulus dan pengalaman sensorik."},{"nama":"Young & Helmholtz","kontribusi":"Teori trikromatik penglihatan warna dengan tiga jenis sel kerucut."},{"nama":"Ewald Hering","kontribusi":"Teori proses-lawan yang menjelaskan fenomena afterimage."},{"nama":"Max Wertheimer","kontribusi":"Pendiri psikologi Gestalt dan perumus prinsip-prinsip organisasi persepsi."},{"nama":"Melzack & Wall","kontribusi":"Teori gerbang nyeri (gate-control theory) tentang modulasi sinyal nyeri."}],"istilah":[{"term":"Sensasi","definisi":"Proses reseptor indra menerima dan mengubah energi fisik menjadi sinyal saraf."},{"term":"Persepsi","definisi":"Proses otak mengorganisasi dan menafsirkan sensasi menjadi pengalaman bermakna."},{"term":"Transduksi","definisi":"Pengubahan energi fisik menjadi impuls saraf yang dapat diproses otak."},{"term":"Ambang absolut","definisi":"Intensitas stimulus terkecil yang dapat dideteksi pada 50 persen kesempatan."},{"term":"Hukum Weber","definisi":"Prinsip bahwa ambang beda bersifat proporsional terhadap intensitas stimulus awal."},{"term":"Adaptasi sensorik","definisi":"Penurunan kepekaan terhadap stimulus yang terus-menerus dan konstan."},{"term":"Sel batang dan sel kerucut","definisi":"Fotoreseptor retina; batang untuk cahaya redup, kerucut untuk warna dan detail."},{"term":"Teori trikromatik","definisi":"Teori bahwa penglihatan warna berasal dari tiga jenis sel kerucut."},{"term":"Teori proses-lawan","definisi":"Teori bahwa sel saraf warna bekerja dalam pasangan berlawanan; menjelaskan afterimage."},{"term":"Prinsip Gestalt","definisi":"Prinsip bahwa otak mengorganisasi stimulus menjadi keseluruhan yang bermakna."},{"term":"Disparitas retina","definisi":"Petunjuk kedalaman binokular berupa perbedaan bayangan pada kedua mata."},{"term":"Perceptual set","definisi":"Kesiapan mental mempersepsi sesuatu dengan cara tertentu berdasarkan harapan dan pengalaman."}],"quiz":[{"soal":"Proses mengubah gelombang cahaya menjadi sinyal saraf yang dapat diproses otak disebut...","pilihan":["Persepsi","Transduksi","Adaptasi","Akomodasi"],"jawaban":2,"penjelasan":"Transduksi adalah pengubahan energi fisik seperti cahaya menjadi impuls saraf."},{"soal":"Mengapa kita berhenti menyadari bau parfum sendiri setelah beberapa menit memakainya?","pilihan":["Ambang absolut meningkat permanen","Adaptasi sensorik","Ilusi optik","Prinsip closure"],"jawaban":2,"penjelasan":"Adaptasi sensorik menurunkan kepekaan terhadap stimulus konstan, sehingga perhatian dapat difokuskan pada perubahan lingkungan."},{"soal":"Menurut Hukum Weber, ambang beda bersifat...","pilihan":["Selalu tetap berapa pun intensitas awalnya","Proporsional terhadap intensitas stimulus awal","Tidak dapat diukur","Sama untuk semua indra"],"jawaban":2,"penjelasan":"Hukum Weber menyatakan perbedaan yang dapat dideteksi merupakan proporsi tetap dari stimulus awal, bukan jumlah absolut."},{"soal":"Sel retina yang berperan penting dalam penglihatan warna dan detail halus adalah...","pilihan":["Sel batang (rod)","Sel kerucut (cone)","Koklea","Sel rambut"],"jawaban":2,"penjelasan":"Sel kerucut berfungsi optimal pada cahaya terang dan memungkinkan persepsi warna serta detail."},{"soal":"Fenomena afterimage (melihat warna komplementer setelah menatap warna tertentu) paling baik dijelaskan oleh...","pilihan":["Teori trikromatik","Teori proses-lawan","Hukum Weber","Prinsip proximity"],"jawaban":2,"penjelasan":"Teori proses-lawan menjelaskan bahwa sel bekerja berpasangan berlawanan, sehingga kelelahan pada satu sisi memunculkan warna lawannya."},{"soal":"Kemampuan otak melengkapi bagian gambar yang hilang agar terlihat utuh adalah prinsip Gestalt yang disebut...","pilihan":["Proximity","Similarity","Closure","Figure-ground"],"jawaban":3,"penjelasan":"Closure atau penutupan adalah kecenderungan otak mengisi celah agar suatu pola terlihat lengkap."},{"soal":"Perbedaan kecil antara bayangan yang diterima mata kiri dan mata kanan disebut...","pilihan":["Konvergensi","Disparitas retina","Gradien tekstur","Interposisi"],"jawaban":2,"penjelasan":"Disparitas retina adalah petunjuk kedalaman binokular yang memungkinkan persepsi tiga dimensi."},{"soal":"Indra yang sinyalnya langsung menuju sistem limbik tanpa melewati talamus terlebih dahulu adalah...","pilihan":["Penglihatan","Pendengaran","Penciuman","Pengecap"],"jawaban":3,"penjelasan":"Jalur penciuman langsung ke sistem limbik menjelaskan mengapa bau begitu kuat memicu emosi dan kenangan."},{"soal":"Titik pada retina tempat saraf optik keluar sehingga tidak ada fotoreseptor disebut...","pilihan":["Fovea","Bintik buta","Koklea","Pupil"],"jawaban":2,"penjelasan":"Bintik buta tidak kita sadari karena otak secara otomatis mengisi celah informasi tersebut."},{"soal":"Ilusi Muller-Lyer dan ilusi Ponzo terjadi karena...","pilihan":["Mata mengalami kerusakan","Mekanisme persepsi yang biasanya membantu justru menghasilkan penafsiran keliru","Tidak ada transduksi","Adaptasi sensorik berlebihan"],"jawaban":2,"penjelasan":"Ilusi optik memperlihatkan bahwa aturan persepsi yang umumnya akurat bisa keliru pada situasi tertentu."}],"kasus":{"skenario":"Setelah menonton film horor di ruangan gelap, seorang penonton melihat tirai yang bergoyang tertiup angin dan seketika yakin melihat sosok hantu. Ia sampai berteriak. Ketika lampu dinyalakan, ternyata memang hanya tirai biasa.","pertanyaan":"Fenomena ini paling tepat dijelaskan oleh...","pilihan":["Adaptasi sensorik terhadap kegelapan","Perceptual set dan pemrosesan top-down: harapan serta konteks membentuk penafsiran atas stimulus ambigu","Ambang absolut penglihatan yang terlalu rendah","Hukum Weber"],"jawaban":2,"penjelasan":"Suasana menegangkan menciptakan perceptual set, yaitu kesiapan mental untuk melihat sesuatu yang menyeramkan. Pemrosesan top-down inilah yang membuat stimulus ambigu (tirai bergoyang) ditafsirkan sebagai hantu."},"isian":[{"kalimat":"Proses otak mengorganisasi dan memaknai sensasi disebut ___.","jawaban":["persepsi"]},{"kalimat":"Penurunan kepekaan terhadap stimulus yang konstan disebut ___ sensorik.","jawaban":["adaptasi"]},{"kalimat":"Prinsip yang menyatakan otak memisahkan objek utama dari latar belakangnya disebut prinsip ___.","jawaban":["figure-ground","figure ground"]},{"kalimat":"Petunjuk kedalaman berupa perbedaan bayangan pada kedua mata disebut ___ retina.","jawaban":["disparitas"]}]},{"nomor":6,"id":"ch06","judul":"Belajar","ikon":"gears","pendahuluan":"Belajar adalah perubahan perilaku atau pengetahuan yang relatif menetap sebagai hasil pengalaman. Bab ini membahas tiga bentuk utama belajar: pengkondisian klasik, pengkondisian operan, dan belajar observasional, beserta penerapannya dalam kehidupan sehari-hari.","materi":[{"judul":"Pengkondisian Klasik: Belajar lewat Asosiasi","poin":["Ivan Pavlov menemukan pengkondisian klasik secara tidak sengaja saat meneliti pencernaan anjing: anjing mulai mengeluarkan air liur bahkan sebelum makanan diberikan.","STIMULUS TAK TERKONDISI (US) memicu respons secara alami tanpa perlu belajar - contohnya makanan.","RESPONS TAK TERKONDISI (UR) adalah reaksi alami terhadap US - contohnya air liur saat melihat makanan.","STIMULUS TERKONDISI (CS) awalnya netral, tetapi setelah berulang kali dipasangkan dengan US menjadi mampu memicu respons - contohnya bunyi bel.","RESPONS TERKONDISI (CR) adalah respons hasil belajar terhadap CS - contohnya air liur saat mendengar bel saja.","AKUISISI adalah fase pembentukan asosiasi. Pengkondisian paling efektif bila CS muncul SEDIKIT SEBELUM US dengan jeda pendek.","GENERALISASI STIMULUS: respons juga muncul pada stimulus yang mirip CS. DISKRIMINASI: individu belajar merespons hanya pada CS spesifik.","EXTINCTION: CR melemah bila CS berulang kali muncul tanpa diikuti US. SPONTANEOUS RECOVERY: CR dapat muncul kembali secara tiba-tiba setelah jeda waktu, menunjukkan asosiasi tidak benar-benar terhapus."]},{"judul":"Penerapan Pengkondisian Klasik","poin":["Eksperimen 'Little Albert' oleh John Watson dan Rosalie Rayner menunjukkan rasa takut dapat dikondisikan pada manusia. Eksperimen ini kini dianggap sangat tidak etis menurut standar modern.","Banyak FOBIA terbentuk lewat pengkondisian klasik, misalnya takut naik mobil setelah mengalami kecelakaan.","TASTE AVERSION (keengganan rasa) dapat terbentuk hanya dengan satu kali pasangan dan meski jeda waktunya berjam-jam. Ini menunjukkan organisme memiliki KESIAPAN BIOLOGIS untuk mempelajari asosiasi yang relevan bagi kelangsungan hidup (temuan John Garcia).","Terapi eksposur memanfaatkan prinsip extinction: klien dihadapkan pada CS (objek fobia) tanpa konsekuensi buruk, sehingga respons takut perlahan melemah.","Iklan memanfaatkan pengkondisian klasik dengan memasangkan produk (stimulus netral) dengan musik, selebritas, atau suasana menyenangkan."]},{"judul":"Pengkondisian Operan: Belajar lewat Konsekuensi","poin":["HUKUM EFEK dari Edward Thorndike: perilaku yang diikuti hasil memuaskan cenderung diulang, sedangkan yang diikuti hasil tidak menyenangkan cenderung ditinggalkan.","B.F. Skinner mengembangkan gagasan ini secara sistematis menggunakan Skinner box, sebuah ruang eksperimen terkontrol.","Perbedaan mendasar: pengkondisian klasik melibatkan perilaku INVOLUNTER sebagai respons terhadap stimulus yang mendahului, sedangkan pengkondisian operan melibatkan perilaku VOLUNTER yang dibentuk oleh konsekuensi yang mengikutinya.","PENGUATAN (reinforcement) selalu MENINGKATKAN perilaku; HUKUMAN (punishment) selalu MENURUNKAN perilaku.","Kata POSITIF berarti MENAMBAHKAN sesuatu, sedangkan NEGATIF berarti MENGHILANGKAN sesuatu. Keduanya bukan berarti 'baik' atau 'buruk'.","PENGUATAN POSITIF: menambahkan stimulus menyenangkan untuk meningkatkan perilaku (memberi pujian atas kerja bagus).","PENGUATAN NEGATIF: menghilangkan stimulus tidak menyenangkan untuk meningkatkan perilaku (memakai sabuk pengaman agar bunyi alarm berhenti).","HUKUMAN POSITIF: menambahkan stimulus tidak menyenangkan untuk menurunkan perilaku (memberi tugas tambahan karena terlambat).","HUKUMAN NEGATIF: menghilangkan stimulus menyenangkan untuk menurunkan perilaku (menyita gawai karena melanggar aturan).","SHAPING adalah teknik membentuk perilaku kompleks dengan memberi penguatan pada aproksimasi yang makin mendekati perilaku target."]},{"judul":"Jadwal Penguatan","poin":["PENGUATAN KONTINU (setiap perilaku diberi penguatan) menghasilkan belajar paling CEPAT, tetapi juga paling cepat mengalami extinction.","PENGUATAN PARSIAL atau intermiten menghasilkan belajar lebih lambat, tetapi perilakunya jauh lebih TAHAN terhadap extinction.","RASIO TETAP (fixed ratio): penguatan setelah sejumlah tetap respons, misalnya bonus tiap 10 produk terjual. Menghasilkan laju respons tinggi dengan jeda singkat setelah penguatan.","RASIO VARIABEL (variable ratio): penguatan setelah jumlah respons yang tidak menentu, misalnya mesin judi atau menarik-turun layar media sosial. Menghasilkan laju respons PALING TINGGI dan paling tahan extinction - inilah jadwal yang membuat perjudian sangat adiktif.","INTERVAL TETAP (fixed interval): penguatan setelah rentang waktu tetap, misalnya gaji bulanan. Respons meningkat menjelang waktu penguatan.","INTERVAL VARIABEL (variable interval): penguatan setelah rentang waktu tidak menentu, misalnya mengecek ponsel menunggu balasan pesan. Menghasilkan respons yang stabil dan mantap."]},{"judul":"Efektivitas dan Keterbatasan Hukuman","poin":["Hukuman efektif bila diberikan SEGERA, KONSISTEN, dan dengan intensitas yang wajar serta disertai penjelasan.","Kelemahan hukuman: hanya memberi tahu apa yang TIDAK boleh dilakukan, tanpa mengajarkan perilaku alternatif yang benar.","Hukuman fisik dikaitkan dengan peningkatan agresi, rasa takut terhadap pemberi hukuman, dan pembelajaran bahwa kekerasan adalah cara menyelesaikan masalah.","Perilaku yang dihukum sering tidak hilang, melainkan hanya ditekan atau dipindahkan ke situasi ketika pemberi hukuman tidak hadir.","Sebagian besar ahli menyarankan mengutamakan penguatan positif terhadap perilaku yang diinginkan daripada menghukum perilaku yang tidak diinginkan."]},{"judul":"Belajar Observasional dan Kognitif","poin":["Albert Bandura menunjukkan bahwa belajar dapat terjadi hanya dengan MENGAMATI orang lain (model), tanpa perlu mengalami konsekuensinya sendiri.","Eksperimen BOBO DOLL: anak-anak yang menyaksikan orang dewasa memukuli boneka kemudian meniru perilaku agresif tersebut, bahkan menambahkan bentuk agresi baru.","Empat proses belajar observasional: PERHATIAN (memperhatikan model), RETENSI (mengingat apa yang diamati), REPRODUKSI (mampu meniru secara fisik), dan MOTIVASI (adanya alasan untuk melakukannya).","PENGUATAN VIKARIUS: kita lebih mungkin meniru model yang terlihat mendapat imbalan, dan menghindari perilaku model yang terlihat dihukum.","Model yang paling berpengaruh biasanya adalah orang yang hangat, berstatus tinggi, mirip dengan kita, atau yang kita kagumi.","BELAJAR LATEN (Edward Tolman): belajar dapat terjadi tanpa penguatan langsung dan baru terlihat ketika ada insentif. Tikus yang menjelajahi labirin tanpa hadiah ternyata sudah membentuk PETA KOGNITIF.","MOTIVASI INTRINSIK dapat menurun bila perilaku yang tadinya disukai justru diberi imbalan eksternal berlebihan - fenomena ini disebut efek overjustification."]}],"ringkasan":["Pengkondisian klasik = belajar ASOSIASI antar-stimulus (Pavlov: US, UR, CS, CR).","Pengkondisian operan = belajar dari KONSEKUENSI (Skinner).","Kunci: penguatan MENAIKKAN perilaku, hukuman MENURUNKAN. Positif = menambah, negatif = menghilangkan.","Rasio variabel menghasilkan respons paling tinggi dan paling tahan extinction - inilah yang membuat judi adiktif.","Bandura: belajar bisa terjadi hanya dengan mengamati model (perhatian, retensi, reproduksi, motivasi)."],"tokoh":[{"nama":"Ivan Pavlov","kontribusi":"Menemukan pengkondisian klasik melalui eksperimen air liur anjing."},{"nama":"John B. Watson","kontribusi":"Eksperimen Little Albert; membuktikan rasa takut dapat dikondisikan pada manusia."},{"nama":"Edward Thorndike","kontribusi":"Merumuskan hukum efek, dasar bagi pengkondisian operan."},{"nama":"B.F. Skinner","kontribusi":"Mengembangkan pengkondisian operan, konsep penguatan, hukuman, dan jadwal penguatan."},{"nama":"Albert Bandura","kontribusi":"Teori belajar sosial dan eksperimen Bobo doll tentang belajar observasional."},{"nama":"Edward Tolman","kontribusi":"Konsep belajar laten dan peta kognitif."},{"nama":"John Garcia","kontribusi":"Menemukan taste aversion dan konsep kesiapan biologis dalam belajar."}],"istilah":[{"term":"Pengkondisian klasik","definisi":"Belajar melalui asosiasi antara dua stimulus."},{"term":"Stimulus terkondisi","definisi":"Stimulus awalnya netral yang setelah dipasangkan dengan US mampu memicu respons."},{"term":"Pengkondisian operan","definisi":"Belajar melalui konsekuensi berupa penguatan atau hukuman atas suatu perilaku."},{"term":"Penguatan positif","definisi":"Menambahkan stimulus menyenangkan untuk meningkatkan frekuensi perilaku."},{"term":"Penguatan negatif","definisi":"Menghilangkan stimulus tidak menyenangkan untuk meningkatkan frekuensi perilaku."},{"term":"Hukuman","definisi":"Konsekuensi yang menurunkan frekuensi suatu perilaku."},{"term":"Extinction","definisi":"Melemahnya respons karena stimulus terkondisi tidak lagi diikuti stimulus asli atau konsekuensi."},{"term":"Shaping","definisi":"Membentuk perilaku kompleks dengan memberi penguatan pada aproksimasi bertahap."},{"term":"Rasio variabel","definisi":"Jadwal penguatan setelah jumlah respons yang tidak menentu; paling tahan extinction."},{"term":"Belajar observasional","definisi":"Belajar melalui pengamatan dan peniruan perilaku model."},{"term":"Penguatan vikarius","definisi":"Kecenderungan meniru model yang terlihat memperoleh imbalan."},{"term":"Belajar laten","definisi":"Belajar yang terjadi tanpa penguatan langsung dan baru tampak saat ada insentif."}],"quiz":[{"soal":"Dalam eksperimen Pavlov, bel yang awalnya netral namun akhirnya memicu air liur disebut...","pilihan":["Stimulus tak terkondisi","Respons tak terkondisi","Stimulus terkondisi","Hukuman"],"jawaban":3,"penjelasan":"Setelah berulang kali dipasangkan dengan makanan, bel menjadi stimulus terkondisi (CS) yang memicu respons terkondisi."},{"soal":"Memakai sabuk pengaman agar bunyi alarm mobil yang mengganggu berhenti adalah contoh...","pilihan":["Hukuman negatif","Penguatan negatif","Penguatan positif","Generalisasi stimulus"],"jawaban":2,"penjelasan":"Menghilangkan stimulus tidak menyenangkan (bunyi alarm) yang membuat perilaku meningkat adalah penguatan negatif."},{"soal":"Menyita gawai anak karena melanggar aturan, sehingga pelanggaran berkurang, adalah contoh...","pilihan":["Hukuman positif","Hukuman negatif","Penguatan negatif","Shaping"],"jawaban":2,"penjelasan":"Menghilangkan sesuatu yang menyenangkan (gawai) untuk MENURUNKAN perilaku adalah hukuman negatif."},{"soal":"Jadwal penguatan yang menghasilkan laju respons paling tinggi dan paling tahan terhadap extinction adalah...","pilihan":["Interval tetap","Rasio tetap","Rasio variabel","Penguatan kontinu"],"jawaban":3,"penjelasan":"Rasio variabel memberi penguatan setelah jumlah respons yang tak menentu. Inilah alasan mesin judi sangat adiktif."},{"soal":"Eksperimen Bobo doll oleh Albert Bandura membuktikan pentingnya...","pilihan":["Pengkondisian klasik","Pengkondisian operan","Belajar observasional","Adaptasi sensorik"],"jawaban":3,"penjelasan":"Anak-anak meniru perilaku agresif model dewasa hanya dengan mengamati, tanpa pernah diberi penguatan langsung."},{"soal":"Teknik membentuk perilaku kompleks dengan memberi penguatan pada langkah-langkah yang makin mendekati target disebut...","pilihan":["Shaping","Extinction","Generalisasi","Diskriminasi"],"jawaban":1,"penjelasan":"Shaping memberi penguatan pada aproksimasi bertahap hingga tercapai perilaku akhir yang diinginkan."},{"soal":"Munculnya kembali respons terkondisi secara tiba-tiba setelah periode extinction dan jeda waktu disebut...","pilihan":["Generalisasi","Diskriminasi","Spontaneous recovery","Shaping"],"jawaban":3,"penjelasan":"Spontaneous recovery menunjukkan bahwa extinction tidak benar-benar menghapus asosiasi yang telah terbentuk."},{"soal":"Tikus yang menjelajahi labirin tanpa hadiah ternyata sudah membentuk peta kognitif. Fenomena ini disebut...","pilihan":["Belajar laten","Penguatan vikarius","Taste aversion","Hukum efek"],"jawaban":1,"penjelasan":"Belajar laten (Tolman) menunjukkan belajar dapat terjadi tanpa penguatan dan baru tampak ketika ada insentif."},{"soal":"Taste aversion dapat terbentuk hanya dengan satu kali pasangan dan meski jedanya berjam-jam. Ini menunjukkan adanya...","pilihan":["Kesiapan biologis untuk mempelajari asosiasi yang relevan bagi kelangsungan hidup","Kegagalan pengkondisian klasik","Penguatan vikarius","Efek overjustification"],"jawaban":1,"penjelasan":"Temuan John Garcia menunjukkan organisme secara biologis lebih siap mempelajari asosiasi tertentu yang penting bagi kelangsungan hidup."},{"soal":"Terapi eksposur untuk fobia memanfaatkan prinsip belajar yang disebut...","pilihan":["Extinction","Shaping","Generalisasi","Penguatan positif"],"jawaban":1,"penjelasan":"Klien dihadapkan pada stimulus terkondisi tanpa konsekuensi buruk, sehingga respons takut perlahan mengalami extinction."}],"kasus":{"skenario":"Seorang manajer ingin karyawannya lebih rajin datang tepat waktu. Ia mencoba dua pendekatan: memotong tunjangan bagi yang terlambat, atau memberi pujian dan bonus kecil bagi yang tepat waktu. Setelah dievaluasi, pendekatan kedua terbukti jauh lebih efektif dan tidak menimbulkan ketegangan di tim.","pertanyaan":"Pendekatan kedua yang terbukti lebih efektif tersebut menerapkan prinsip...","pilihan":["Hukuman negatif","Penguatan positif","Extinction","Generalisasi stimulus"],"jawaban":2,"penjelasan":"Menambahkan konsekuensi menyenangkan (pujian dan bonus) untuk MENINGKATKAN perilaku datang tepat waktu adalah penguatan positif. Ini sejalan dengan temuan bahwa penguatan perilaku yang diinginkan umumnya lebih efektif daripada menghukum perilaku yang tidak diinginkan."},"isian":[{"kalimat":"Tokoh yang mengembangkan teori pengkondisian klasik melalui eksperimen anjing dan bel adalah ___.","jawaban":["pavlov","ivan pavlov"]},{"kalimat":"Belajar melalui pengamatan dan peniruan model disebut belajar ___.","jawaban":["observasional"]},{"kalimat":"Konsekuensi yang menambahkan stimulus tak menyenangkan untuk menurunkan perilaku disebut ___ positif.","jawaban":["hukuman"]},{"kalimat":"Jadwal penguatan yang paling tahan terhadap extinction adalah jadwal rasio ___.","jawaban":["variabel","variable"]}]},{"nomor":7,"id":"ch07","judul":"Berpikir dan Kecerdasan","ikon":"lightbulb","pendahuluan":"Bab ini membahas bagaimana manusia mengorganisasi pengetahuan, memecahkan masalah, mengambil keputusan, menggunakan bahasa, serta bagaimana kecerdasan didefinisikan, diukur, dan diperdebatkan.","materi":[{"judul":"Konsep dan Struktur Pengetahuan","poin":["KONSEP adalah kategori mental yang mengelompokkan objek, peristiwa, atau ide yang memiliki ciri serupa. Konsep membuat berpikir menjadi efisien karena kita tidak perlu memperlakukan setiap objek sebagai hal yang benar-benar baru.","PROTOTIPE adalah contoh paling khas atau representatif dari sebuah kategori. Bagi kebanyakan orang, 'burung gereja' lebih prototipikal daripada 'penguin'.","Semakin mirip suatu objek dengan prototipe, semakin cepat kita mengenalinya sebagai anggota kategori tersebut.","SKEMA adalah kerangka mental yang lebih luas berisi pengetahuan tentang suatu topik atau situasi, misalnya skema 'kuliah' atau skema 'restoran'.","Konsep alami terbentuk dari pengalaman sehari-hari, sedangkan konsep artifisial didefinisikan lewat aturan yang tegas seperti definisi segitiga dalam matematika."]},{"judul":"Pemecahan Masalah","poin":["ALGORITMA adalah prosedur langkah demi langkah yang MENJAMIN solusi bila diikuti dengan benar, tetapi bisa lambat dan melelahkan.","HEURISTIK adalah jalan pintas mental yang jauh lebih cepat, tetapi tidak menjamin ketepatan.","Strategi umum: memecah masalah menjadi sub-tujuan, bekerja mundur dari tujuan akhir, atau mencari analogi dengan masalah yang pernah diselesaikan.","INSIGHT adalah pemahaman mendadak atas solusi ('aha moment') tanpa melalui langkah-langkah sadar yang bertahap.","FUNCTIONAL FIXEDNESS adalah hambatan berupa kecenderungan hanya melihat fungsi umum suatu objek, sehingga solusi kreatif terlewat. Contoh klasiknya adalah kesulitan memakai kotak paku sebagai penyangga lilin.","MENTAL SET adalah kecenderungan bertahan pada strategi yang dulu berhasil, meskipun strategi itu tidak lagi cocok untuk masalah yang sedang dihadapi."]},{"judul":"Bias Kognitif dalam Pengambilan Keputusan","poin":["HEURISTIK KETERSEDIAAN (availability): menilai peluang suatu kejadian berdasarkan seberapa mudah contohnya terlintas di pikiran. Karena kecelakaan pesawat sangat diberitakan, orang cenderung melebih-lebihkan risikonya dibanding kecelakaan mobil.","HEURISTIK REPRESENTATIVENESS: menilai sesuatu berdasarkan seberapa mirip dengan prototipe, sambil mengabaikan informasi dasar tentang frekuensi sebenarnya (base rate).","CONFIRMATION BIAS: kecenderungan mencari dan lebih memercayai informasi yang mendukung keyakinan yang sudah dimiliki, sekaligus mengabaikan bukti yang bertentangan.","ANCHORING: keputusan terlalu dipengaruhi informasi pertama yang diterima, misalnya harga awal dalam tawar-menawar.","EFEK FRAMING: cara informasi disajikan mengubah keputusan meski isinya identik. 'Tingkat keberhasilan 90 persen' terdengar jauh lebih meyakinkan daripada 'tingkat kegagalan 10 persen'.","OVERCONFIDENCE: kecenderungan menilai ketepatan penilaian diri sendiri lebih tinggi daripada kenyataannya.","BELIEF PERSEVERANCE: bertahan pada keyakinan awal meski bukti yang mendasarinya sudah terbantahkan."]},{"judul":"Bahasa","poin":["Bahasa tersusun berjenjang: FONEM (satuan bunyi terkecil), MORFEM (satuan bermakna terkecil), SINTAKSIS (aturan penyusunan kalimat), dan SEMANTIK (makna).","Tahapan perkembangan bahasa relatif universal: menangis dan mendekut, MENGOCEH (babbling) sekitar usia 4-6 bulan, tahap satu kata sekitar 1 tahun, tahap dua kata (telegrafis) sekitar 18-24 bulan, lalu kalimat lengkap.","Noam Chomsky berpendapat manusia memiliki kesiapan bawaan untuk memperoleh bahasa, ditunjukkan oleh kecepatan anak menguasai tata bahasa yang rumit tanpa pengajaran formal.","B.F. Skinner sebaliknya menekankan peran penguatan dan peniruan dari lingkungan. Pandangan modern memadukan keduanya: ada kesiapan biologis, tetapi masukan lingkungan tetap sangat menentukan.","HIPOTESIS RELATIVITAS LINGUISTIK (Sapir-Whorf) menyatakan bahasa memengaruhi cara berpikir. Versi kuatnya (bahasa menentukan pikiran) kini ditolak, tetapi versi lemahnya (bahasa memengaruhi kecenderungan berpikir) didukung sebagian bukti."]},{"judul":"Teori-Teori Kecerdasan","poin":["Charles Spearman mengajukan FAKTOR G (general intelligence), yaitu kemampuan umum yang mendasari performa di berbagai bidang, berdasarkan temuan bahwa skor pada berbagai tes cenderung berkorelasi.","Raymond Cattell membedakan KECERDASAN CAIR (fluid intelligence), yaitu kemampuan menalar dan memecahkan masalah baru yang cenderung menurun seiring usia, dan KECERDASAN KRISTAL (crystallized intelligence), yaitu akumulasi pengetahuan dan keterampilan yang cenderung bertahan atau meningkat.","TEORI TRIARKIS Robert Sternberg membagi kecerdasan menjadi ANALITIS (memecahkan masalah akademis), KREATIF (menghadapi situasi baru), dan PRAKTIS (kecerdasan sehari-hari untuk beradaptasi).","KECERDASAN MAJEMUK Howard Gardner mengusulkan kecerdasan yang relatif terpisah: linguistik, logis-matematis, spasial, musikal, kinestetik-jasmani, interpersonal, intrapersonal, dan naturalis. Teori ini populer di dunia pendidikan meski dikritik karena dukungan empirisnya terbatas.","KECERDASAN EMOSIONAL (Salovey, Mayer, dipopulerkan Goleman) mencakup kemampuan mengenali, memahami, mengelola, dan menggunakan emosi diri sendiri maupun orang lain.","Perlu dibedakan antara teori yang populer dan teori yang paling didukung bukti. Gagasan 'gaya belajar' (visual, auditori, kinestetik) misalnya, sangat populer namun tidak didukung bukti eksperimental yang kuat."]},{"judul":"Pengukuran Kecerdasan dan Isu Kritisnya","poin":["Alfred Binet mengembangkan tes kecerdasan pertama untuk mengidentifikasi anak yang membutuhkan bantuan belajar tambahan, bukan untuk melabeli kemampuan bawaan.","Lewis Terman mengadaptasinya menjadi Stanford-Binet. Rumus IQ awal adalah usia mental dibagi usia kronologis dikali 100.","Skala Wechsler (WAIS untuk dewasa, WISC untuk anak) kini paling banyak digunakan dan memberi skor terpisah untuk beberapa domain kemampuan.","Skor IQ modern distandarisasi dengan rata-rata 100 dan standar deviasi 15, mengikuti distribusi normal (kurva lonceng).","Tes yang baik harus RELIABEL (hasilnya konsisten bila diulang), VALID (benar-benar mengukur apa yang dimaksud), dan TERSTANDARISASI (memiliki norma pembanding yang jelas).","EFEK FLYNN adalah temuan bahwa skor IQ rata-rata populasi meningkat dari generasi ke generasi, yang menunjukkan besarnya peran faktor lingkungan seperti gizi dan pendidikan.","Isu bias budaya: tes yang dirancang dalam konteks budaya tertentu dapat merugikan kelompok dengan latar belakang berbeda. STEREOTYPE THREAT, yaitu kecemasan akibat kesadaran akan stereotip negatif tentang kelompoknya, terbukti dapat menurunkan performa tes seseorang.","Kecerdasan dipengaruhi faktor genetik maupun lingkungan, dan skor IQ bukan ukuran tunggal atas nilai atau potensi seseorang."]}],"ringkasan":["Algoritma menjamin solusi tapi lambat; heuristik cepat tapi rentan bias.","Bias yang sering muncul: ketersediaan, representativeness, confirmation bias, anchoring, framing, dan overconfidence.","Hambatan pemecahan masalah: functional fixedness dan mental set.","Teori kecerdasan: faktor g (Spearman), cair vs kristal (Cattell), triarkis (Sternberg), majemuk (Gardner).","Skor IQ dipengaruhi lingkungan (efek Flynn) dan konteks psikologis (stereotype threat); IQ bukan ukuran nilai seseorang."],"tokoh":[{"nama":"Charles Spearman","kontribusi":"Mengajukan konsep faktor g atau kecerdasan umum."},{"nama":"Alfred Binet","kontribusi":"Mengembangkan tes kecerdasan pertama untuk membantu anak yang kesulitan belajar."},{"nama":"Raymond Cattell","kontribusi":"Membedakan kecerdasan cair (fluid) dan kecerdasan kristal (crystallized)."},{"nama":"Robert Sternberg","kontribusi":"Teori triarkis: kecerdasan analitis, kreatif, dan praktis."},{"nama":"Howard Gardner","kontribusi":"Teori kecerdasan majemuk (multiple intelligences)."},{"nama":"Kahneman & Tversky","kontribusi":"Riset heuristik dan bias kognitif dalam pengambilan keputusan."},{"nama":"Noam Chomsky","kontribusi":"Berpendapat manusia memiliki kesiapan bawaan untuk memperoleh bahasa."},{"nama":"Claude Steele","kontribusi":"Riset stereotype threat dan dampaknya terhadap performa tes."}],"istilah":[{"term":"Konsep","definisi":"Kategori mental yang mengelompokkan objek atau ide dengan ciri serupa."},{"term":"Prototipe","definisi":"Contoh paling khas atau representatif dari sebuah kategori."},{"term":"Algoritma","definisi":"Prosedur langkah demi langkah yang menjamin solusi bila diikuti dengan benar."},{"term":"Heuristik","definisi":"Jalan pintas mental untuk mengambil keputusan cepat, tidak selalu akurat."},{"term":"Functional fixedness","definisi":"Kecenderungan melihat objek hanya sesuai fungsi umumnya sehingga menghambat kreativitas."},{"term":"Confirmation bias","definisi":"Kecenderungan mencari informasi yang mendukung keyakinan yang sudah dimiliki."},{"term":"Efek framing","definisi":"Pengaruh cara penyajian informasi terhadap keputusan yang diambil."},{"term":"Faktor g","definisi":"Kemampuan kecerdasan umum yang mendasari performa di berbagai bidang."},{"term":"Kecerdasan cair","definisi":"Kemampuan menalar dan memecahkan masalah baru, cenderung menurun seiring usia."},{"term":"Kecerdasan kristal","definisi":"Akumulasi pengetahuan dan keterampilan yang cenderung bertahan seiring usia."},{"term":"Efek Flynn","definisi":"Kenaikan skor IQ rata-rata populasi dari generasi ke generasi."},{"term":"Stereotype threat","definisi":"Penurunan performa akibat kecemasan terhadap stereotip negatif tentang kelompoknya."}],"quiz":[{"soal":"Menggunakan pintasan mental yang cepat namun berisiko tidak akurat dalam mengambil keputusan disebut...","pilihan":["Algoritma","Heuristik","Prototipe","Sintaksis"],"jawaban":2,"penjelasan":"Heuristik adalah jalan pintas kognitif yang cepat namun rentan menghasilkan bias."},{"soal":"Menilai peluang kecelakaan pesawat sebagai sangat tinggi karena baru saja melihat beritanya adalah contoh...","pilihan":["Heuristik ketersediaan","Functional fixedness","Algoritma","Efek Flynn"],"jawaban":1,"penjelasan":"Heuristik ketersediaan membuat kita menilai probabilitas berdasarkan seberapa mudah contohnya terlintas di pikiran."},{"soal":"Kecenderungan hanya mencari informasi yang mendukung keyakinan yang sudah dimiliki disebut...","pilihan":["Anchoring","Confirmation bias","Overconfidence","Mental set"],"jawaban":2,"penjelasan":"Confirmation bias membuat seseorang menyaring informasi sehingga hanya yang mendukung keyakinannya yang diterima."},{"soal":"Kemampuan menalar dan memecahkan masalah baru yang cenderung menurun seiring bertambahnya usia disebut kecerdasan...","pilihan":["Kristal","Cair","Praktis","Emosional"],"jawaban":2,"penjelasan":"Kecerdasan cair (fluid) menurun seiring usia, sedangkan kecerdasan kristal cenderung bertahan atau meningkat."},{"soal":"Teori yang membagi kecerdasan menjadi analitis, kreatif, dan praktis dikemukakan oleh...","pilihan":["Gardner","Sternberg","Spearman","Binet"],"jawaban":2,"penjelasan":"Teori triarkis Robert Sternberg membagi kecerdasan menjadi tiga jenis tersebut."},{"soal":"Kesulitan menggunakan buku tebal sebagai pengganjal pintu karena terbiasa melihatnya sebagai bacaan adalah contoh...","pilihan":["Functional fixedness","Efek framing","Anchoring","Belief perseverance"],"jawaban":1,"penjelasan":"Functional fixedness menghambat kita melihat fungsi alternatif dari suatu objek."},{"soal":"Iklan yang menyebut 'produk ini 90 persen bebas lemak' terdengar lebih menarik daripada '10 persen mengandung lemak'. Ini contoh...","pilihan":["Efek framing","Functional fixedness","Algoritma","Prototipe"],"jawaban":1,"penjelasan":"Efek framing menunjukkan bahwa cara penyajian informasi memengaruhi persepsi meski isinya identik."},{"soal":"Temuan bahwa skor IQ rata-rata populasi meningkat dari generasi ke generasi disebut...","pilihan":["Efek Flynn","Stereotype threat","Faktor g","Efek framing"],"jawaban":1,"penjelasan":"Efek Flynn menunjukkan besarnya peran faktor lingkungan seperti gizi dan akses pendidikan terhadap skor IQ."},{"soal":"Keputusan yang terlalu dipengaruhi oleh informasi pertama yang diterima, misalnya harga awal saat tawar-menawar, disebut...","pilihan":["Anchoring","Availability","Framing","Insight"],"jawaban":1,"penjelasan":"Anchoring membuat penilaian kita 'tertambat' pada informasi awal meski informasi itu belum tentu relevan."},{"soal":"Pemahaman mendadak atas solusi sebuah masalah tanpa melalui langkah sadar bertahap disebut...","pilihan":["Algoritma","Insight","Mental set","Prototipe"],"jawaban":2,"penjelasan":"Insight atau 'aha moment' adalah pemahaman mendadak, berbeda dari pemecahan masalah yang bertahap dan disadari."}],"kasus":{"skenario":"Seorang mahasiswa berulang kali gagal menyelesaikan soal statistik dengan rumus baku yang diajarkan dosen. Ia terus mengulang cara yang sama karena dulu selalu berhasil. Setelah beristirahat dan mencoba menggambar ulang masalahnya dalam bentuk diagram, ia tiba-tiba menemukan solusinya.","pertanyaan":"Hambatan yang berhasil diatasi mahasiswa tersebut paling tepat disebut...","pilihan":["Heuristik ketersediaan","Mental set","Efek framing","Stereotype threat"],"jawaban":2,"penjelasan":"Mental set adalah kecenderungan bertahan pada strategi yang dulu berhasil meski tidak lagi cocok. Dengan mengubah cara merepresentasikan masalah, ia keluar dari mental set tersebut dan memperoleh insight."},"isian":[{"kalimat":"Prosedur langkah-demi-langkah yang selalu menghasilkan solusi jika diikuti dengan benar disebut ___.","jawaban":["algoritma"]},{"kalimat":"Contoh paling khas atau representatif dari sebuah kategori disebut ___.","jawaban":["prototipe","prototype"]},{"kalimat":"Kemampuan mengenali dan mengelola emosi diri sendiri dan orang lain disebut kecerdasan ___.","jawaban":["emosional"]},{"kalimat":"Penurunan performa akibat kecemasan terhadap stereotip negatif tentang kelompoknya disebut stereotype ___.","jawaban":["threat","ancaman"]}]},{"nomor":8,"id":"ch08","judul":"Memori","ikon":"database","pendahuluan":"Memori adalah sistem yang memungkinkan kita menyandikan, menyimpan, dan memanggil kembali informasi. Bab ini membahas tahapan pemrosesan memori, model penyimpanan, jenis memori jangka panjang, penyebab lupa, distorsi memori, dan strategi belajar yang terbukti efektif.","materi":[{"judul":"Tiga Tahap Pemrosesan Memori","poin":["ENCODING (penyandian) adalah proses mengubah informasi menjadi bentuk yang dapat disimpan otak.","STORAGE (penyimpanan) adalah mempertahankan informasi tersebut dari waktu ke waktu.","RETRIEVAL (pemanggilan) adalah mengakses kembali informasi yang telah tersimpan.","Kegagalan memori dapat terjadi pada salah satu dari ketiga tahap ini, dan penanganannya berbeda-beda. Lupa nama seseorang bisa berarti kita tidak pernah benar-benar menyandikannya, bukan berarti kita 'kehilangan' ingatannya.","Encoding dapat bersifat OTOMATIS (waktu, ruang, frekuensi) atau membutuhkan USAHA sadar (menghafal istilah kuliah)."]},{"judul":"Model Tiga Tahap Penyimpanan","poin":["MEMORI SENSORIK menyimpan salinan informasi indrawi dalam waktu sangat singkat. Memori ikonik (visual) bertahan sekitar 0,5 detik, sedangkan memori ekoik (auditori) sekitar 3-4 detik.","George Sperling membuktikan keberadaan memori ikonik lewat eksperimen laporan sebagian (partial report), yang menunjukkan kita sesaat 'melihat' jauh lebih banyak daripada yang sempat kita laporkan.","MEMORI JANGKA PENDEK menyimpan informasi sekitar 20-30 detik dengan kapasitas terbatas. George Miller menyebut angka ajaib 7 plus minus 2 item, meski riset yang lebih baru memperkirakan sekitar 4 chunk.","MEMORI KERJA (working memory, Baddeley & Hitch) adalah konsep yang lebih modern: bukan sekadar wadah penyimpanan pasif, melainkan sistem aktif yang memanipulasi informasi, terdiri dari komponen visual, verbal, dan pusat eksekutif.","MEMORI JANGKA PANJANG memiliki kapasitas yang secara praktis tak terbatas dan dapat bertahan seumur hidup.","REHEARSAL PEMELIHARAAN (mengulang-ulang secara mekanis) hanya mempertahankan informasi sementara. REHEARSAL ELABORATIF (mengaitkan informasi baru dengan makna dan pengetahuan yang sudah ada) jauh lebih efektif memindahkannya ke memori jangka panjang."]},{"judul":"Jenis Memori Jangka Panjang","poin":["MEMORI EKSPLISIT atau deklaratif adalah memori yang dapat diungkapkan secara sadar. Terbagi menjadi dua jenis.","Memori EPISODIK menyimpan peristiwa dan pengalaman personal beserta konteks waktu dan tempatnya, misalnya kenangan hari kelulusan.","Memori SEMANTIK menyimpan pengetahuan dan fakta umum tanpa terikat konteks personal, misalnya mengetahui bahwa Jakarta adalah ibu kota Indonesia.","MEMORI IMPLISIT atau non-deklaratif tidak memerlukan kesadaran. Bentuk utamanya adalah memori PROSEDURAL, yaitu keterampilan motorik dan kebiasaan seperti mengendarai sepeda atau mengetik.","Hipokampus sangat penting untuk pembentukan memori EKSPLISIT baru, sedangkan serebelum dan ganglia basal berperan pada memori IMPLISIT.","Kasus pasien H.M., yang hipokampusnya diangkat, menunjukkan pemisahan ini secara dramatis: ia tidak dapat membentuk memori eksplisit baru, tetapi masih mampu mempelajari keterampilan motorik baru tanpa menyadari bahwa ia pernah berlatih.","FLASHBULB MEMORY adalah ingatan yang terasa sangat jelas dan detail tentang peristiwa emosional yang mengejutkan. Terasa sangat akurat, padahal riset menunjukkan ingatan ini juga mengalami distorsi seperti memori biasa."]},{"judul":"Pemanggilan Kembali dan Konteks","poin":["RECALL menuntut kita memproduksi informasi tanpa petunjuk (soal esai), sedangkan RECOGNITION hanya menuntut mengenali jawaban yang benar (soal pilihan ganda). Recognition umumnya jauh lebih mudah.","PETUNJUK PEMANGGILAN (retrieval cue) adalah rangsangan yang membantu membuka akses ke informasi tersimpan. Semakin banyak dan bermakna petunjuk yang terbentuk saat encoding, semakin mudah informasi dipanggil kembali.","MEMORI BERGANTUNG KONTEKS: kita lebih mudah mengingat sesuatu di tempat yang sama dengan tempat kita mempelajarinya.","MEMORI BERGANTUNG SUASANA HATI: kita cenderung lebih mudah mengingat informasi yang selaras dengan suasana hati saat ini, yang antara lain menjelaskan mengapa suasana hati buruk cenderung memunculkan kenangan buruk.","EFEK POSISI SERIAL: pada sebuah daftar, item di AWAL lebih diingat (efek primacy, karena sempat masuk memori jangka panjang) dan item di AKHIR juga lebih diingat (efek recency, karena masih ada di memori jangka pendek). Item di tengah paling mudah terlupakan."]},{"judul":"Mengapa Kita Lupa","poin":["KEGAGALAN ENCODING: informasi tidak pernah benar-benar masuk ke memori karena kurangnya perhatian. Inilah penyebab paling umum 'lupa' dalam kehidupan sehari-hari.","PELURUHAN (decay): jejak memori memudar seiring waktu bila tidak pernah diakses. Hermann Ebbinghaus menggambarkan hal ini lewat KURVA LUPA, yang menunjukkan kehilangan paling tajam terjadi segera setelah belajar lalu melambat.","INTERFERENSI PROAKTIF: informasi LAMA mengganggu ingatan informasi BARU, misalnya kesulitan mengingat PIN baru karena terus teringat PIN lama.","INTERFERENSI RETROAKTIF: informasi BARU mengganggu ingatan informasi LAMA, misalnya kesulitan mengingat materi minggu lalu setelah mempelajari materi baru.","KEGAGALAN RETRIEVAL: informasi tersimpan tetapi tidak dapat diakses saat dibutuhkan. Fenomena 'di ujung lidah' adalah contohnya.","AMNESIA ANTEROGRADE adalah ketidakmampuan membentuk memori BARU setelah cedera, sedangkan AMNESIA RETROGRADE adalah kehilangan memori SEBELUM cedera terjadi."]},{"judul":"Distorsi dan Rekonstruksi Memori","poin":["Memori bukan rekaman video yang diputar ulang, melainkan REKONSTRUKSI yang dibangun ulang setiap kali dipanggil, dan karenanya rentan berubah.","Elizabeth Loftus menunjukkan EFEK MISINFORMASI: informasi keliru yang diberikan setelah suatu peristiwa dapat menyusup dan mengubah ingatan seseorang tentang peristiwa itu.","Dalam eksperimen klasiknya, mengganti kata 'menabrak' dengan 'menghantam' dalam pertanyaan membuat saksi memperkirakan kecepatan lebih tinggi dan bahkan 'mengingat' pecahan kaca yang sebenarnya tidak ada.","Temuan ini memiliki implikasi serius bagi keandalan KESAKSIAN SAKSI MATA di pengadilan, yang ternyata jauh lebih rapuh daripada anggapan umum.","Memori juga dapat mengalami misattribution, yaitu mengingat informasinya dengan benar namun keliru mengenai sumbernya."]},{"judul":"Strategi Meningkatkan Memori","poin":["SPACED PRACTICE (belajar terdistribusi): membagi belajar ke beberapa sesi berjarak jauh lebih efektif daripada satu sesi panjang. Ini salah satu temuan paling kokoh dalam psikologi pendidikan.","RETRIEVAL PRACTICE (menguji diri sendiri): mencoba mengingat kembali materi tanpa melihat catatan jauh lebih efektif daripada membaca ulang berkali-kali, meski terasa lebih sulit dan kurang 'lancar'.","ELABORASI: mengaitkan materi baru dengan pengetahuan yang sudah dimiliki dan menjelaskannya dengan kalimat sendiri.","CHUNKING: mengelompokkan informasi menjadi unit bermakna yang lebih besar, misalnya mengingat nomor 08123456789 sebagai beberapa kelompok angka.","MNEMONIK: alat bantu ingat seperti akronim, jembatan keledai, atau metode loci (mengaitkan informasi dengan lokasi dalam ruang yang dibayangkan).","TIDUR YANG CUKUP sangat penting karena konsolidasi memori terjadi selama tidur. Begadang untuk belajar justru merugikan proses ini.","Hati-hati dengan ILUSI KEFASIHAN: membaca ulang membuat materi terasa familiar dan 'sudah dikuasai', padahal rasa familiar bukan bukti kemampuan mengingat kembali."]}],"ringkasan":["Tiga tahap: encoding, storage, retrieval. Kegagalan bisa terjadi di tahap mana pun.","Memori jangka pendek terbatas (7 plus minus 2, riset baru sekitar 4 chunk); memori kerja bersifat aktif, bukan wadah pasif.","Eksplisit (episodik dan semantik) vs implisit (prosedural) bergantung pada sistem otak yang berbeda - lihat kasus H.M.","Penyebab lupa: kegagalan encoding, peluruhan, interferensi proaktif/retroaktif, dan kegagalan retrieval.","Strategi terbaik: retrieval practice + spaced practice + tidur cukup. Waspadai ilusi kefasihan saat membaca ulang."],"tokoh":[{"nama":"Hermann Ebbinghaus","kontribusi":"Peneliti memori pertama secara eksperimental; merumuskan kurva lupa dan efek spacing."},{"nama":"George Miller","kontribusi":"Merumuskan kapasitas memori jangka pendek sekitar 7 plus minus 2 item."},{"nama":"Baddeley & Hitch","kontribusi":"Mengembangkan model memori kerja (working memory) sebagai sistem aktif."},{"nama":"Pasien H.M. (Henry Molaison)","kontribusi":"Kasus yang mengungkap peran hipokampus dan pemisahan memori eksplisit-implisit."},{"nama":"Elizabeth Loftus","kontribusi":"Riset efek misinformasi dan kerapuhan kesaksian saksi mata."},{"nama":"George Sperling","kontribusi":"Membuktikan keberadaan memori sensorik ikonik lewat eksperimen laporan sebagian."}],"istilah":[{"term":"Encoding","definisi":"Proses mengubah informasi menjadi bentuk yang dapat disimpan dalam memori."},{"term":"Retrieval","definisi":"Proses mengakses kembali informasi yang tersimpan dalam memori."},{"term":"Memori kerja","definisi":"Sistem aktif yang menyimpan sekaligus memanipulasi informasi dalam jangka pendek."},{"term":"Memori episodik","definisi":"Memori tentang peristiwa dan pengalaman personal beserta konteksnya."},{"term":"Memori semantik","definisi":"Memori tentang fakta dan pengetahuan umum tanpa konteks personal."},{"term":"Memori prosedural","definisi":"Memori implisit berupa keterampilan dan kebiasaan yang dilakukan otomatis."},{"term":"Rehearsal elaboratif","definisi":"Mengaitkan informasi baru dengan makna dan pengetahuan yang sudah ada."},{"term":"Interferensi proaktif","definisi":"Informasi lama mengganggu kemampuan mengingat informasi baru."},{"term":"Interferensi retroaktif","definisi":"Informasi baru mengganggu kemampuan mengingat informasi lama."},{"term":"Kurva lupa","definisi":"Pola Ebbinghaus yang menunjukkan kehilangan memori paling tajam terjadi segera setelah belajar."},{"term":"Efek misinformasi","definisi":"Masuknya informasi keliru pasca-peristiwa yang mengubah ingatan seseorang."},{"term":"Spaced practice","definisi":"Strategi belajar terdistribusi dalam beberapa sesi berjarak, lebih efektif daripada sekaligus."},{"term":"Retrieval practice","definisi":"Menguji diri sendiri untuk mengingat kembali materi; strategi belajar yang sangat efektif."},{"term":"Chunking","definisi":"Mengelompokkan informasi menjadi unit bermakna yang lebih besar agar mudah diingat."}],"quiz":[{"soal":"Kapasitas memori jangka pendek menurut penelitian klasik George Miller adalah sekitar...","pilihan":["2 plus minus 1 item","7 plus minus 2 item","20 plus minus 5 item","100 item"],"jawaban":2,"penjelasan":"Miller menyebutnya 'angka ajaib' 7 plus minus 2, meski riset yang lebih baru memperkirakan sekitar 4 chunk."},{"soal":"Mengingat momen kelulusan SMA beserta suasana dan tempatnya termasuk jenis memori...","pilihan":["Prosedural","Episodik","Semantik","Sensorik"],"jawaban":2,"penjelasan":"Memori episodik menyimpan peristiwa personal lengkap dengan konteks waktu dan tempatnya."},{"soal":"Kemampuan mengendarai sepeda tanpa perlu berpikir sadar adalah contoh memori...","pilihan":["Episodik","Semantik","Implisit atau prosedural","Sensorik"],"jawaban":3,"penjelasan":"Memori prosedural adalah memori implisit berupa keterampilan yang dijalankan secara otomatis."},{"soal":"Kesulitan mengingat PIN baru karena terus teringat PIN lama adalah contoh interferensi...","pilihan":["Proaktif","Retroaktif","Primacy","Recency"],"jawaban":1,"penjelasan":"Interferensi proaktif terjadi ketika informasi LAMA mengganggu ingatan informasi BARU."},{"soal":"Riset Elizabeth Loftus tentang efek misinformasi menunjukkan bahwa...","pilihan":["Memori adalah rekaman akurat yang tidak berubah","Informasi keliru setelah peristiwa dapat mengubah ingatan seseorang","Kesaksian saksi mata selalu dapat dipercaya","Memori jangka panjang berkapasitas terbatas"],"jawaban":2,"penjelasan":"Memori bersifat rekonstruktif sehingga informasi yang diterima setelah peristiwa dapat menyusup dan mengubah ingatan."},{"soal":"Pada sebuah daftar, item yang berada di posisi TENGAH paling mudah terlupakan. Fenomena ini dijelaskan oleh...","pilihan":["Efek posisi serial","Chunking","Efek misinformasi","Kurva Flynn"],"jawaban":1,"penjelasan":"Efek posisi serial menggabungkan efek primacy (item awal) dan recency (item akhir), sehingga bagian tengah paling lemah."},{"soal":"Strategi belajar yang terbukti PALING efektif untuk retensi jangka panjang adalah...","pilihan":["Membaca ulang catatan berkali-kali","Menguji diri sendiri secara berkala dengan jeda waktu","Menyalin ulang seluruh catatan","Menyorot teks dengan stabilo"],"jawaban":2,"penjelasan":"Kombinasi retrieval practice dan spaced practice adalah dua strategi dengan dukungan bukti terkuat, meski terasa lebih sulit saat dilakukan."},{"soal":"Pasien H.M. yang tidak dapat membentuk memori baru namun masih bisa mempelajari keterampilan motorik menunjukkan...","pilihan":["Memori implisit dan eksplisit bergantung pada sistem otak yang berbeda","Semua memori disimpan di hipokampus","Memori prosedural tidak nyata","Amnesia selalu bersifat total"],"jawaban":1,"penjelasan":"Kasus H.M. membuktikan pemisahan sistem: hipokampus penting untuk memori eksplisit, sementara memori implisit bergantung pada struktur lain."},{"soal":"Fenomena 'di ujung lidah', yaitu tahu informasinya tersimpan tetapi tidak bisa diakses, adalah contoh...","pilihan":["Kegagalan encoding","Kegagalan retrieval","Interferensi proaktif","Peluruhan total"],"jawaban":2,"penjelasan":"Pada kegagalan retrieval, informasi sebenarnya masih tersimpan namun akses ke sana sedang tidak berhasil."},{"soal":"Flashbulb memory adalah ingatan yang terasa sangat jelas tentang peristiwa emosional. Temuan riset menunjukkan bahwa ingatan ini...","pilihan":["Selalu akurat sempurna","Terasa sangat akurat padahal juga mengalami distorsi seperti memori biasa","Tidak pernah terbentuk pada manusia","Hanya terjadi pada anak-anak"],"jawaban":2,"penjelasan":"Meski terasa sangat meyakinkan, flashbulb memory tetap mengalami distorsi seiring waktu sebagaimana memori pada umumnya."}],"kasus":{"skenario":"Seorang mahasiswa belajar mati-matian semalam suntuk sebelum ujian dengan membaca ulang catatannya berkali-kali sampai terasa sangat familiar. Ia lulus dengan nilai pas-pasan, tetapi seminggu kemudian hampir tidak dapat mengingat apa pun dari materi tersebut saat ditanya dosen.","pertanyaan":"Penjelasan psikologis paling tepat untuk pengalaman mahasiswa ini adalah...","pilihan":["Ia mengalami amnesia retrograde","Membaca ulang menimbulkan ilusi kefasihan; tanpa spaced practice dan retrieval practice, materi tidak terkonsolidasi ke memori jangka panjang","Ia mengalami interferensi proaktif","Kapasitas memori jangka panjangnya sudah penuh"],"jawaban":2,"penjelasan":"Membaca ulang menciptakan rasa familiar yang keliru dianggap sebagai penguasaan (ilusi kefasihan). Tanpa pengujian diri dan pengulangan berjarak, ditambah kurang tidur yang menghambat konsolidasi, materi cepat hilang."},"isian":[{"kalimat":"Proses mengakses kembali informasi yang tersimpan dalam memori disebut ___.","jawaban":["retrieval","pemanggilan"]},{"kalimat":"Memori tentang fakta umum seperti 'Jakarta adalah ibu kota Indonesia' termasuk memori ___.","jawaban":["semantik"]},{"kalimat":"Strategi mengelompokkan informasi menjadi unit yang lebih besar agar mudah diingat disebut ___.","jawaban":["chunking"]},{"kalimat":"Strategi belajar dengan membagi sesi belajar ke beberapa waktu berjarak disebut ___ practice.","jawaban":["spaced","distributed"]}]},{"nomor":9,"id":"ch09","judul":"Perkembangan Sepanjang Hayat","ikon":"child","pendahuluan":"Psikologi perkembangan mengkaji perubahan fisik, kognitif, dan sosial-emosional manusia dari masa prenatal hingga lanjut usia. Bab ini membahas isu-isu besar perkembangan, teori Piaget, Erikson, Kohlberg, kelekatan, gaya pengasuhan, serta perkembangan pada masa remaja hingga lansia.","materi":[{"judul":"Isu-Isu Besar dalam Perkembangan","poin":["NATURE vs NURTURE: sejauh mana perkembangan ditentukan faktor bawaan versus pengalaman. Konsensus modern menekankan interaksi keduanya, bukan pilih

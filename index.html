    const b = babAktif(), s = kuisS(b), list = s.latihan || s.order;
    const kosong = list.filter(qi => s.jawab[qi] == null);
    if (kosong.length) {
      toast(`Masih ada ${kosong.length} soal yang belum dijawab.`, 'warn');
      $$('.soal.perlu').forEach(x => x.classList.remove('perlu'));
      kosong.forEach(qi => { const el = $('#soal-' + qi); if (el) el.classList.add('perlu'); });
      const pertama = $('#soal-' + kosong[0]); if (pertama) pertama.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    selesaikanKuis(b);
  },
  'kuis-ulang': () => { kuisS(babAktif(), true); segarkanPanel(); window.scrollTo({ top: Math.max(0, ($('#panel').getBoundingClientRect().top + window.scrollY) - 140) }); },
  'kuis-latih': () => {
    const b = babAktif(), s = kuisS(b), salah = s.hasil ? s.hasil.salah : [];
    if (!salah.length) return;
    s.latihan = acak(salah); s.jawab = {}; s.kunci = {}; s.hasil = null;
    segarkanPanel(); window.scrollTo({ top: Math.max(0, ($('#panel').getBoundingClientRect().top + window.scrollY) - 140) });
  },
  'ck-term': el => { const b = babAktif(), s = ckS(b), t = Number(el.dataset.t); if (s.cek) return;
    if (s.pairs[t] != null && s.selT !== t && s.selD == null) { delete s.pairs[t]; s.selT = null; }
    else { s.selT = s.selT === t ? null : t; ckPasang(b, s); }
    segarkanPanel(); const f = $(`[data-act="ck-term"][data-t="${t}"]`); if (f) f.focus(); },
  'ck-def': el => { const b = babAktif(), s = ckS(b), d = Number(el.dataset.d); if (s.cek) return;
    const pemilik = Object.keys(s.pairs).find(t => s.pairs[t] === d);
    if (pemilik != null && s.selT == null && s.selD !== d) { delete s.pairs[pemilik]; s.selD = null; }
    else { s.selD = s.selD === d ? null : d; ckPasang(b, s); }
    segarkanPanel(); const f = $(`[data-act="ck-def"][data-d="${d}"]`); if (f) f.focus(); },
  'ck-periksa': () => {
    const b = babAktif(), s = ckS(b);
    if (Object.keys(s.pairs).length < s.terms.length) { toast('Lengkapi semua pasangan terlebih dahulu.', 'warn'); return; }
    s.cek = true; s.nb = s.terms.filter(t => s.pairs[t] === t).length;
    const skor = Math.round(s.nb / s.terms.length * 100);
    P.cocok_done[b.id] = true; P.cocok_skor[b.id] = Math.max(Number(P.cocok_skor[b.id]) || 0, skor); simpan();
    segarkanPanel();
  },
  'ck-baru': () => { ckS(babAktif(), true); segarkanPanel(); },
  'isian-petunjuk': el => { const s = isS(babAktif()); s.petunjuk[el.dataset.i] = true; segarkanPanel(); const inp = $(`#isian-${rute.bab}-${el.dataset.i}`); if (inp) inp.focus(); },
  'isian-periksa': () => {
    const b = babAktif(), s = isS(b);
    $$('.isian-input').forEach(inp => { s.nilai[inp.dataset.isian] = inp.value; });
    s.hasil = b.isian.map((f, i) => nilaiIsian(s.nilai[i] || '', f.jawaban));
    s.cek = true; s.nb = s.hasil.filter(h => h.status === 'benar' || h.status === 'hampir').length;
    const skor = Math.round(s.nb / b.isian.length * 100);
    P.isian_done[b.id] = true; P.isian_skor[b.id] = Math.max(Number(P.isian_skor[b.id]) || 0, skor); simpan();
    segarkanPanel();
  },
  'isian-ulang': () => { const b = babAktif(); isState[b.id] = { nilai: {}, cek: false, hasil: [], petunjuk: {} }; segarkanPanel(); const f = $('.isian-input'); if (f) f.focus(); },
  'kasus-kirim': el => {
    const b = babAktif(), s = ksS(b), ki = Number(el.dataset.k);
    if (s.jawab[ki] == null) { toast('Pilih salah satu jawaban terlebih dahulu.', 'warn'); return; }
    s.cek[ki] = true;
    const k = b.kasus[ki];
    if (s.jawab[ki] === Math.min(Math.max(k.jawaban - 1, 0), k.pilihan.length - 1)) P.kasus_benar[b.id] = true;
    P.kasus_done[b.id] = true; simpan(); segarkanPanel();
  },
  'kasus-ulang': el => { const s = ksS(babAktif()), ki = Number(el.dataset.k); delete s.cek[ki]; delete s.jawab[ki]; segarkanPanel(); },
  'ke-kartu': el => keKartu(BAB_ID[el.dataset.bab], Number(el.dataset.i)),
  'cari-ke': el => { const x = hasilCari[Number(el.dataset.i)]; if (x) bukaHasil(x); },
  'uj-pilih': el => { uj.pilih = el.dataset.v === 'semua' ? new Set(BAB.map(b => b.id)) : new Set(); renderUlang(); },
  'uj-jumlah': el => { uj.jumlah = el.dataset.v === 'semua' ? 'semua' : Number(el.dataset.v); renderUlang(); },
  'uj-waktu': el => { uj.waktu = el.dataset.v; renderUlang(); },
  'uj-mulai': () => ujMulai(),
  'uj-atur': () => { uj.fase = 'atur'; uj.hasil = null; render(); },
  'uj-geser': el => { uj.pos = Math.max(0, Math.min(uj.soal.length - 1, uj.pos + Number(el.dataset.d))); renderUlang(); },
  'uj-ke': el => { uj.pos = Number(el.dataset.k); renderUlang(); },
  'uj-selesai': () => {
    const kosong = uj.soal.length - Object.keys(uj.jawab).length;
    if (kosong > 0 && !uj.konfirmasi) { uj.konfirmasi = true; toast(`${kosong} soal belum dijawab. Tekan Selesai sekali lagi untuk tetap memeriksa.`, 'warn', 6000); setTimeout(() => { uj.konfirmasi = false; }, 6000); return; }
    uj.konfirmasi = false; ujSelesai();
  },
  'salin': el => salinTeks(el.dataset.target),
  'pulihkan': () => {
    const kode = ($('#kode-pulih') || {}).value || '';
    const p = dariKode(kode);
    if (!p) { modalPesan = { ok: false, teks: 'Kode tidak dikenali. Pastikan kode disalin utuh dan diawali “PSI”.' }; isiModal(); return; }
    if (kunciAktif) p.nama = P.nama;
    else if (p.nama) { const namaKode = p.nama; pakaiProfil(namaKode); p.nama = P.nama; }
    P = p; resetStateSesi(); simpan(false);
    modalPesan = null; tutupModal(); render();
    toast(`Progres untuk “${P.nama || 'tamu'}” berhasil dipulihkan.`, 'ok', 6000);
  },
  'reset-tanya': () => { modalKonfirmasi = 'reset'; isiModal(); },
  'hapus-tanya': () => { modalKonfirmasi = 'hapus'; isiModal(); },
  'konfirmasi-batal': () => { modalKonfirmasi = null; isiModal(); },
  'reset-ya': () => {
    const nama = P.nama; P = progresKosong(kunciAktif ? nama : null); resetStateSesi(); simpan(false);
    modalKonfirmasi = null; tutupModal(); render(); toast('Progres sudah direset. Selamat memulai dari awal!', 'warn');
  },
  'hapus-ya': () => {
    const nama = P.nama;
    sDel('p:' + kunciAktif); daftarProfil = daftarProfil.filter(x => x.kunci !== kunciAktif); simpanDaftar(); sDel('aktif');
    kunciAktif = null; P = muatProgres('_tamu'); resetStateSesi(); simpan(false);
    modalKonfirmasi = null; tutupModal(); render(); toast(`Profil ${nama} sudah dihapus dari browser ini.`, 'warn');
  }
};

const UBAH = {
  'kuis-jawab': el => {
    const b = babAktif(), s = kuisS(b), qi = Number(el.dataset.q);
    if (s.hasil || (pref.modeKuis === 'langsung' && s.kunci[qi])) return;
    s.jawab[qi] = Number(el.value);
    const li = $('#soal-' + qi); if (li) li.classList.remove('perlu');
    if (pref.modeKuis === 'langsung') {
      s.kunci[qi] = true;
      const list = s.latihan || s.order;
      if (li) { const tmp = document.createElement('ol'); tmp.innerHTML = soalHtml(b, s, qi, list.indexOf(qi)); li.replaceWith(tmp.firstElementChild); }
      perbaruiHitungKuis(b);
      if (list.every(x => s.kunci[x])) setTimeout(() => selesaikanKuis(b), 500);
    } else perbaruiHitungKuis(b);
  },
  'acak-kuis': el => { pref.acakKuis = el.checked; simpanPref(); kuisS(babAktif(), true); segarkanPanel(); toast(el.checked ? 'Soal dan pilihan jawaban kini diacak.' : 'Urutan soal kembali seperti semula.'); },
  'fc-def': el => { pref.fcDefDulu = el.checked; simpanPref(); fcS(babAktif()).flip = false; segarkanPanel(); },
  'kasus-jawab': el => { ksS(babAktif()).jawab[Number(el.dataset.k)] = Number(el.value); },
  'glos-bab': el => { glos.bab = el.value; $('#glos-list').innerHTML = glosListHtml(); },
  'uj-bab': el => { if (el.checked) uj.pilih.add(el.value); else uj.pilih.delete(el.value); renderUlang(); },
  'uj-jawab': el => {
    uj.jawab[uj.pos] = Number(el.value);
    const tombol = $(`.palet [data-k="${uj.pos}"]`); if (tombol) tombol.classList.add('terjawab');
  },
  'uj-salah': el => { uj.hanyaSalah = el.checked; renderUlang(); }
};

const FORM = {
  'nama': f => {
    const nama = f.elements.nama.value;
    if (!str(nama).trim()) { toast('Mohon isi nama terlebih dahulu.', 'warn'); return; }
    const pindah = adaProgres(P);
    pakaiProfil(nama); render();
    toast(`Halo, ${P.nama}! ${pindah ? 'Progresmu sebagai tamu ikut tersimpan.' : 'Selamat belajar.'}`, 'ok', 5000);
  },
  'nama-modal': f => {
    const nama = str(f.elements.nama.value).trim();
    if (!nama) { toast('Mohon isi nama terlebih dahulu.', 'warn'); return; }
    if (daftarProfil.some(x => x.kunci === slugNama(nama) && x.kunci === kunciAktif)) { toast('Itu profil yang sedang aktif.'); return; }
    const ada = daftarProfil.some(x => x.kunci === slugNama(nama));
    pakaiProfil(nama); tutupModal(); render();
    toast(ada ? `Halo lagi, ${P.nama}! Progresmu sudah dimuat.` : `Profil ${P.nama} dibuat. Selamat belajar!`, 'ok');
  }
};

/* =========================================================
   PEMASANGAN EVENT
   ========================================================= */
let cariTunda = null;
function pasangEvent() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && !el.closest('[disabled]') && el.getAttribute('aria-disabled') !== 'true') {
      const fn = AKSI[el.dataset.act];
      if (fn) { e.preventDefault(); fn(el, e); return; }
    }
    if (el && el.getAttribute('aria-disabled') === 'true' && el.dataset.act === 'ck-periksa') { toast('Lengkapi semua pasangan terlebih dahulu.', 'warn'); return; }
    if (!e.target.closest('.cari')) tutupCari();
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-ubah]');
    if (el && UBAH[el.dataset.ubah]) UBAH[el.dataset.ubah](el, e);
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-form]');
    if (f) { e.preventDefault(); if (FORM[f.dataset.form]) FORM[f.dataset.form](f); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'cari-input') { clearTimeout(cariTunda); cariTunda = setTimeout(renderCari, 110); }
    else if (el.dataset && el.dataset.input === 'glos-q') { glos.q = el.value; $('#glos-list').innerHTML = glosListHtml(); }
    else if (el.dataset && el.dataset.isian != null && rute.view === 'bab') { isS(babAktif()).nilai[el.dataset.isian] = el.value; }
  });
  $('#cari-input').addEventListener('focus', () => { if (normTeks($('#cari-input').value)) renderCari(); });
  $('#cari-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); if (hasilCari[0] && !$('#cari-panel').hidden) bukaHasil(hasilCari[0]); }
    else if (e.key === 'ArrowDown') { const f = $('#cari-panel .cari-item'); if (f) { e.preventDefault(); f.focus(); } }
    else if (e.key === 'Escape') { tutupCari(); e.target.blur(); }
  });
  $('#cari-panel').addEventListener('keydown', e => {
    const items = $$('#cari-panel .cari-item'), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (i > 0) items[i - 1].focus(); else $('#cari-input').focus(); }
    else if (e.key === 'Escape') { tutupCari(); $('#cari-input').focus(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (modalAktif) { tutupModal(); return; }
      if (document.body.classList.contains('menu-terbuka')) { document.body.classList.remove('menu-terbuka'); return; }
    }
    if (modalAktif && e.key === 'Tab') {
      const fokus = $$('#modal button, #modal input, #modal textarea, #modal a[href]').filter(x => !x.disabled);
      if (!fokus.length) return;
      const a = fokus[0], z = fokus[fokus.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
      return;
    }
    const tag = (e.target.tagName || '').toLowerCase();
    const mengetik = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if (e.target.classList && e.target.classList.contains('isian-input') && e.key === 'Enter') {
      e.preventDefault();
      const semua = $$('.isian-input'), i = semua.indexOf(e.target);
      if (i < semua.length - 1) semua[i + 1].focus(); else AKSI['isian-periksa']();
      return;
    }
    if (e.key === '/' && !mengetik && !modalAktif) { e.preventDefault(); $('#cari-input').focus(); return; }
    if (mengetik && !(tag === 'input' && e.target.type === 'radio')) return;
    if (modalAktif || e.ctrlKey || e.metaKey || e.altKey) return;
    const diTombol = tag === 'button' || tag === 'a';
    if (rute.view === 'bab' && rute.tab === 'flashcard') {
      if ((e.key === ' ' || e.key === 'Enter') && !diTombol) { e.preventDefault(); fcFlip(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); fcGeser(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); fcGeser(-1); }
      else if (e.key === '1') fcNilai(false);
      else if (e.key === '2') fcNilai(true);
    } else if (rute.view === 'ujian' && uj.fase === 'jalan') {
      const s = uj.soal[uj.pos];
      const kunci = e.key.toLowerCase();
      let j = -1;
      if (/^[1-9]$/.test(kunci)) j = Number(kunci) - 1;
      else if (/^[a-i]$/.test(kunci)) j = kunci.charCodeAt(0) - 97;
      if (j >= 0 && j < s.opt.length) { uj.jawab[uj.pos] = s.opt[j]; renderUlang(); }
      else if (e.key === 'ArrowRight' && tag !== 'input') { e.preventDefault(); if (uj.pos < uj.soal.length - 1) { uj.pos++; renderUlang(); } }
      else if (e.key === 'ArrowLeft' && tag !== 'input') { e.preventDefault(); if (uj.pos > 0) { uj.pos--; renderUlang(); } }
    }
  });
  window.addEventListener('hashchange', () => render());
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', terapkanTema); } catch (e) { } }
  new MutationObserver(() => { const btn = $('#tombol-tema'); if (btn && btn.dataset.tema !== temaAktif()) { btn.dataset.tema = temaAktif(); terapkanTema(); } })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

/* =========================================================
   MULAI
   ========================================================= */
function mulai() {
  terapkanTema(); terapkanTeks();
  const aktif = sGet('aktif');
  let sambutan = null;
  if (aktif && daftarProfil.some(x => x.kunci === aktif)) {
    kunciAktif = aktif; P = muatProgres(aktif);
    P.nama = daftarProfil.find(x => x.kunci === aktif).nama;
    P.total_sesi = (P.total_sesi || 0) + 1;
    const lanjut = BAB_ID[P.bab_terakhir];
    sambutan = lanjut && hitungBab('quiz_done') > 0
      ? `Selamat datang kembali, ${P.nama}! Terakhir kamu belajar Bab ${lanjut.nomor}.`
      : `Halo, ${P.nama}! Selamat belajar.`;
  } else {
    kunciAktif = null; P = muatProgres('_tamu');
  }
  cekLencana(false);
  simpan(false);
  pasangEvent();
  if (!N) {
    $('#view').innerHTML = `<div class="card kosong">${ic('alert')}<h2>Konten bab tidak ditemukan.</h2><p class="muted">Data materi belum dimasukkan ke halaman ini.</p></div>`;
    return;
  }
  render();
  if (sambutan) setTimeout(() => toast(sambutan, 'ok', 6000), 400);
}
mulai();
})();

</script>

berkelanjutan daripada mengejar pencapaian materi."]}],"ringkasan":["Stres bergantung pada PENILAIAN KOGNITIF, bukan semata pada peristiwanya (Lazarus).","GAS Selye: alarm, resistensi, kelelahan. Jalur cepat lewat adrenalin, jalur lambat lewat kortisol (sumbu HPA).","Stres kronis menekan imun dan merusak lewat jalur perilaku (kurang tidur, pola makan buruk).","Problem-focused coping untuk situasi yang BISA diubah; emotion-focused untuk yang TIDAK bisa diubah.","Dukungan sosial, rasa kendali, olahraga, tidur, dan mindfulness adalah faktor pelindung utama."],"tokoh":[{"nama":"Hans Selye","kontribusi":"Merumuskan General Adaptation Syndrome: alarm, resistensi, kelelahan."},{"nama":"Richard Lazarus","kontribusi":"Model penilaian kognitif (appraisal) dan pembedaan strategi coping."},{"nama":"Holmes & Rahe","kontribusi":"Menyusun skala peristiwa hidup untuk mengukur beban perubahan hidup."},{"nama":"Friedman & Rosenman","kontribusi":"Mengidentifikasi pola kepribadian Tipe A dan kaitannya dengan penyakit jantung."},{"nama":"Shelley Taylor","kontribusi":"Mengajukan pola respons stres tend-and-befriend."},{"nama":"Martin Seligman","kontribusi":"Pendiri psikologi positif; riset optimisme dan learned helplessness."}],"istilah":[{"term":"Stressor","definisi":"Sumber atau pemicu yang menimbulkan respons stres."},{"term":"Penilaian kognitif","definisi":"Proses menilai apakah situasi mengancam dan apakah kita mampu mengatasinya."},{"term":"Eustress","definisi":"Stres yang bersifat memotivasi dan menyegarkan."},{"term":"General Adaptation Syndrome","definisi":"Tiga tahap respons tubuh terhadap stres: alarm, resistensi, dan kelelahan."},{"term":"Sumbu HPA","definisi":"Jalur hipotalamus-pituitari-adrenal yang melepaskan kortisol saat stres."},{"term":"Psikoneuroimunologi","definisi":"Kajian kaitan antara faktor psikologis, sistem saraf, dan sistem imun."},{"term":"Problem-focused coping","definisi":"Strategi mengatasi stres dengan menangani langsung sumber masalahnya."},{"term":"Emotion-focused coping","definisi":"Strategi mengatasi stres dengan mengelola respons emosional."},{"term":"Kepribadian Tipe A","definisi":"Pola kompetitif dan mudah tersinggung; komponen permusuhannya berisiko bagi jantung."},{"term":"Dukungan sosial","definisi":"Bantuan emosional, informasional, dan nyata dari orang lain; prediktor kuat kesehatan."},{"term":"Resiliensi","definisi":"Kemampuan bangkit dan beradaptasi setelah menghadapi kesulitan."},{"term":"Adaptasi hedonis","definisi":"Kecenderungan kembali ke tingkat kebahagiaan dasar setelah peristiwa baik atau buruk."}],"quiz":[{"soal":"Tahap General Adaptation Syndrome ketika sumber daya tubuh habis akibat stres berkepanjangan disebut tahap...","pilihan":["Alarm","Resistensi","Kelelahan (exhaustion)","Adaptasi"],"jawaban":3,"penjelasan":"Pada tahap kelelahan, daya tahan menurun dan kerentanan terhadap penyakit meningkat."},{"soal":"Dua orang menghadapi kemacetan yang sama; satu merasa santai, satu lagi sangat tertekan. Perbedaan ini menunjukkan pentingnya...","pilihan":["Penilaian kognitif (appraisal)","General Adaptation Syndrome","Sumbu HPA","Adaptasi hedonis"],"jawaban":1,"penjelasan":"Menurut Lazarus, penilaian kognitif atas situasi menentukan apakah sesuatu dialami sebagai ancaman atau tantangan."},{"soal":"Hormon utama yang dilepaskan melalui sumbu HPA saat stres berkepanjangan adalah...","pilihan":["Melatonin","Kortisol","Dopamin","Insulin"],"jawaban":2,"penjelasan":"Sumbu hipotalamus-pituitari-adrenal melepaskan kortisol untuk menyediakan energi menghadapi stres jangka panjang."},{"soal":"Komponen kepribadian Tipe A yang paling kuat dikaitkan dengan risiko penyakit jantung adalah...","pilihan":["Ambisi dan kesibukan","Permusuhan (hostility) dan kemarahan","Kecepatan bicara","Keinginan berprestasi"],"jawaban":2,"penjelasan":"Riset lanjutan menunjukkan permusuhan dan kemarahan, bukan sekadar ambisi atau kesibukan, yang paling berisiko."},{"soal":"Menyusun jadwal dan mencicil pekerjaan untuk mengatasi tumpukan tugas adalah contoh strategi...","pilihan":["Emotion-focused coping","Problem-focused coping","Penghindaran","Rumination"],"jawaban":2,"penjelasan":"Problem-focused coping menangani langsung sumber masalah, tepat digunakan ketika situasi masih dapat diubah."},{"soal":"Ketika menghadapi situasi yang TIDAK dapat diubah seperti berduka karena kehilangan, strategi yang umumnya lebih tepat adalah...","pilihan":["Problem-focused coping","Emotion-focused coping","Penyangkalan total","Menekan semua perasaan"],"jawaban":2,"penjelasan":"Ketika situasi tidak dapat diubah, mengelola respons emosional lewat dukungan sosial dan penerimaan lebih adaptif."},{"soal":"Gagasan bahwa dukungan sosial melindungi kesehatan terutama saat seseorang menghadapi stres tinggi disebut...","pilihan":["Hipotesis penyangga (buffering)","Adaptasi hedonis","Tend-and-befriend","Eustress"],"jawaban":1,"penjelasan":"Buffering hypothesis menyatakan dukungan sosial berfungsi sebagai penyangga dampak negatif stres tinggi."},{"soal":"Kecenderungan kembali ke tingkat kebahagiaan dasar setelah peristiwa baik maupun buruk disebut...","pilihan":["Adaptasi hedonis","Resiliensi","Eustress","Penilaian sekunder"],"jawaban":1,"penjelasan":"Adaptasi hedonis menjelaskan mengapa mengejar pencapaian materi jarang memberi kebahagiaan yang bertahan lama."},{"soal":"Menurut Lazarus, penilaian SEKUNDER dalam menghadapi stres adalah menilai...","pilihan":["Apakah situasi mengancam atau tidak","Apakah kita punya sumber daya untuk mengatasinya","Seberapa besar gaji yang diterima","Berapa lama stres berlangsung"],"jawaban":2,"penjelasan":"Penilaian primer menilai ancaman situasinya, sedangkan penilaian sekunder menilai kemampuan dan sumber daya kita untuk menghadapinya."},{"soal":"Stres kronis juga merusak kesehatan secara TIDAK LANGSUNG, yaitu melalui...","pilihan":["Perubahan warna kulit","Perilaku seperti kurang tidur, makan tidak sehat, dan jarang berolahraga","Peningkatan kecerdasan","Penurunan suhu tubuh"],"jawaban":2,"penjelasan":"Selain jalur fisiologis, stres mengubah perilaku sehari-hari yang pada gilirannya memperburuk kesehatan."}],"kasus":{"skenario":"Menjelang deadline skripsi, seorang mahasiswa awalnya hanya menghindar, menunda, dan berulang kali memikirkan betapa buruk keadaannya tanpa berbuat apa-apa. Setelah berbicara dengan dosen pembimbing, ia mulai menyusun jadwal harian realistis, mencicil bab demi bab, dan rutin berolahraga ringan serta menjaga jam tidurnya.","pertanyaan":"Perubahan strategi yang dilakukan mahasiswa ini paling tepat digambarkan sebagai...","pilihan":["Beralih dari problem-focused ke emotion-focused coping","Beralih dari coping maladaptif (penghindaran dan rumination) ke problem-focused coping yang disertai perawatan diri","Menerapkan penyangkalan","Mengalami adaptasi hedonis"],"jawaban":2,"penjelasan":"Awalnya ia menggunakan strategi maladaptif berupa penghindaran dan rumination. Ia kemudian beralih ke problem-focused coping - menyusun rencana dan mencicil pekerjaan - yang tepat karena situasinya memang dapat diubah, sekaligus menjaga tidur dan olahraga sebagai faktor pelindung."},"isian":[{"kalimat":"Sumber atau pemicu yang menimbulkan respons stres disebut ___.","jawaban":["stressor","stresor"]},{"kalimat":"Tiga tahap respons tubuh terhadap stres menurut Selye disebut ___.","jawaban":["general adaptation syndrome","gas","sindrom adaptasi umum"]},{"kalimat":"Strategi mengatasi stres dengan mengelola perasaan, misalnya lewat dukungan sosial, disebut ___ coping.","jawaban":["emotion-focused","emotion focused"]},{"kalimat":"Kemampuan bangkit dan beradaptasi setelah menghadapi kesulitan disebut ___.","jawaban":["resiliensi","resilience"]}]},{"nomor":15,"id":"ch15","judul":"Gangguan Psikologis","ikon":"triangle-exclamation","pendahuluan":"Bab ini membahas bagaimana gangguan psikologis didefinisikan, diklasifikasikan, dan dijelaskan, serta mengenal kategori-kategori utama gangguan. Perlu diingat sejak awal: memahami gejala tidak sama dengan mendiagnosis, dan diagnosis hanya boleh dilakukan profesional terlatih.","materi":[{"judul":"Mendefinisikan Gangguan Psikologis","poin":["Tidak ada satu kriteria tunggal. Yang umum dipakai adalah kombinasi: DEVIANSI (menyimpang dari norma budaya), DISTRES (penderitaan yang signifikan), DISFUNGSI (mengganggu kemampuan menjalani kehidupan sehari-hari), dan BAHAYA bagi diri sendiri atau orang lain.","Kriteria DISFUNGSI dan DISTRES umumnya dianggap paling penting. Sekadar 'berbeda' dari kebanyakan orang jelas tidak cukup untuk disebut gangguan.","Norma budaya sangat memengaruhi apa yang dianggap normal. Perilaku yang wajar di satu budaya bisa dianggap menyimpang di budaya lain, sehingga penilaian harus peka konteks.","Sejarah menunjukkan bahaya pelabelan: homoseksualitas pernah keliru dimasukkan sebagai gangguan dalam DSM hingga dihapus pada 1973, sebuah pengingat bahwa klasifikasi dapat mencerminkan prasangka zamannya.","Studi Rosenhan yang terkenal menyoroti kuatnya efek label diagnosis terhadap cara staf menafsirkan perilaku pasien, meski metodologinya kini dipertanyakan."]},{"judul":"Klasifikasi dan Model Penjelasan","poin":["DSM (Diagnostic and Statistical Manual of Mental Disorders) yang diterbitkan American Psychiatric Association adalah sistem klasifikasi yang paling banyak digunakan, saat ini pada edisi DSM-5-TR. ICD dari WHO adalah sistem lain yang dipakai luas secara internasional.","Manfaat sistem klasifikasi: menyamakan bahasa antar-profesional, memandu pemilihan penanganan, dan memungkinkan penelitian yang dapat dibandingkan.","Kritik terhadap sistem klasifikasi: risiko pelabelan dan stigma, tingginya komorbiditas (satu orang memenuhi kriteria beberapa gangguan sekaligus), serta batas yang kabur antara normal dan gangguan.","MODEL DIATESIS-STRES adalah kerangka penjelasan yang paling banyak diterima: gangguan muncul dari interaksi antara KERENTANAN (diatesis) berupa faktor genetik, biologis, atau psikologis, dengan PEMICU STRES dari lingkungan.","Implikasi penting model ini: memiliki kerentanan tidak berarti pasti mengalami gangguan, dan sebaliknya stres berat saja tidak selalu memicu gangguan.","MODEL BIOPSIKOSOSIAL memandang gangguan sebagai hasil interaksi faktor biologis (genetik, neurotransmiter), psikologis (pola pikir, coping), dan sosial (dukungan, kemiskinan, diskriminasi)."]},{"judul":"Gangguan Kecemasan dan Terkait","poin":["GANGGUAN KECEMASAN UMUM (GAD): kekhawatiran berlebihan dan sulit dikendalikan tentang berbagai hal, berlangsung menetap dan disertai gejala fisik seperti ketegangan otot dan gangguan tidur.","FOBIA SPESIFIK: ketakutan hebat dan tidak proporsional terhadap objek atau situasi tertentu, disertai penghindaran yang mengganggu kehidupan.","GANGGUAN KECEMASAN SOSIAL: ketakutan intens akan dinilai negatif dalam situasi sosial, jauh melampaui rasa malu biasa.","GANGGUAN PANIK: serangan panik berulang yang datang tiba-tiba disertai gejala fisik hebat, sering diikuti kekhawatiran terus-menerus akan serangan berikutnya. Agorafobia dapat menyertainya.","GANGGUAN OBSESIF-KOMPULSIF (OCD): OBSESI berupa pikiran yang mengganggu dan berulang, serta KOMPULSI berupa perilaku ritual yang dilakukan untuk meredakan kecemasan. Dalam DSM-5 OCD dikelompokkan terpisah dari gangguan kecemasan.","PTSD: gejala menetap setelah peristiwa traumatis, meliputi ingatan yang mengganggu, mimpi buruk, penghindaran, perubahan suasana hati negatif, dan kewaspadaan berlebihan."]},{"judul":"Gangguan Mood","poin":["DEPRESI MAYOR ditandai suasana hati depresif dan/atau hilangnya minat serta kesenangan (anhedonia) hampir sepanjang hari selama minimal dua minggu, disertai perubahan tidur, nafsu makan, energi, konsentrasi, dan perasaan tidak berharga.","Depresi berbeda dari kesedihan biasa dalam hal intensitas, durasi, dan sejauh mana ia mengganggu fungsi sehari-hari.","GANGGUAN BIPOLAR ditandai pergantian antara episode DEPRESIF dan episode MANIK (energi sangat tinggi, kebutuhan tidur menurun drastis, ide yang melompat-lompat, dan perilaku impulsif berisiko).","Penjelasan biologis: keterlibatan sistem serotonin, norepinefrin, dan dopamin, serta faktor genetik yang cukup kuat pada bipolar.","Penjelasan kognitif: Aaron BECK menyebut TRIAD KOGNITIF NEGATIF, yaitu pandangan negatif tentang diri sendiri, dunia, dan masa depan.","Martin Seligman mengajukan LEARNED HELPLESSNESS: pengalaman berulang atas situasi yang tidak terkendali dapat memunculkan kepasrahan dan gaya penjelasan pesimistis.","Depresi merupakan salah satu penyebab utama disabilitas di dunia, dan sangat dapat ditangani dengan terapi maupun kombinasi terapi dan obat."]},{"judul":"Skizofrenia dan Gangguan Lain","poin":["SKIZOFRENIA adalah gangguan psikotik berat yang melibatkan terganggunya kontak dengan realitas.","GEJALA POSITIF adalah tambahan pengalaman yang tidak seharusnya ada: HALUSINASI (persepsi tanpa stimulus nyata, paling sering auditori), DELUSI (keyakinan keliru yang dipertahankan meski ada bukti sebaliknya), serta pikiran dan bicara yang kacau.","GEJALA NEGATIF adalah berkurangnya fungsi normal: afek datar, berkurangnya bicara (alogia), menarik diri secara sosial, dan hilangnya motivasi (avolisi).","Penjelasan biologis mencakup hipotesis dopamin, kelainan struktur otak seperti pembesaran ventrikel, serta faktor genetik yang kuat. Faktor lingkungan seperti komplikasi prenatal dan stres berat berperan sebagai pemicu.","Penting diluruskan: skizofrenia BUKAN 'kepribadian ganda'. Gangguan identitas disosiatif adalah kondisi yang sepenuhnya berbeda.","GANGGUAN KEPRIBADIAN adalah pola pikir, perasaan, dan perilaku yang kaku dan maladaptif, menetap sejak dewasa awal, dan mengganggu fungsi sosial maupun pekerjaan. Contohnya gangguan kepribadian antisosial dan gangguan kepribadian borderline.","Gangguan lain yang penting dikenali mencakup gangguan makan, gangguan perkembangan saraf seperti ADHD dan gangguan spektrum autisme, serta gangguan disosiatif."]},{"judul":"Stigma dan Sikap yang Tepat","poin":["STIGMA adalah sikap dan pandangan negatif masyarakat yang menjadi salah satu HAMBATAN TERBESAR bagi seseorang untuk mencari bantuan profesional.","Salah satu miskonsepsi paling merugikan adalah anggapan bahwa penderita gangguan mental berbahaya. Faktanya, mereka jauh lebih sering menjadi KORBAN kekerasan daripada pelakunya.","Bahasa berpengaruh: sebut 'orang dengan skizofrenia', bukan 'si skizofrenik', karena orang bukanlah diagnosisnya.","Gangguan psikologis bukan tanda kelemahan karakter atau kurangnya iman, melainkan kondisi kesehatan yang memiliki dasar biologis, psikologis, dan sosial.","Mempelajari gangguan psikologis sering memunculkan 'medical student syndrome', yaitu kecenderungan merasa mengalami gejala yang sedang dipelajari. Ini wajar, dan justru menegaskan bahwa diagnosis memerlukan asesmen profesional.","Jika kamu atau orang terdekatmu mengalami kesulitan yang mengganggu keseharian, mencari bantuan psikolog atau psikiater adalah langkah yang tepat dan sehat, bukan sesuatu yang memalukan."]}],"ringkasan":["Kriteria gangguan: distres, disfungsi, deviansi, dan bahaya. Sekadar 'berbeda' tidak cukup.","Model diatesis-stres: gangguan muncul dari interaksi kerentanan dan pemicu stres, bukan salah satunya saja.","Kecemasan (GAD, fobia, panik, OCD, PTSD) dan mood (depresi mayor, bipolar) adalah kategori yang paling sering dibahas.","Skizofrenia: gejala positif (halusinasi, delusi) vs negatif (afek datar, avolisi). BUKAN kepribadian ganda.","Stigma adalah hambatan terbesar untuk mencari bantuan; orang dengan gangguan mental lebih sering jadi KORBAN kekerasan."],"tokoh":[{"nama":"Aaron Beck","kontribusi":"Merumuskan triad kognitif negatif dalam depresi dan mengembangkan terapi kognitif."},{"nama":"Martin Seligman","kontribusi":"Konsep learned helplessness dan gaya penjelasan pesimistis dalam depresi."},{"nama":"Philippe Pinel","kontribusi":"Perintis penanganan manusiawi terhadap penderita gangguan mental."},{"nama":"Dorothea Dix","kontribusi":"Pejuang reformasi perawatan kesehatan mental yang manusiawi."},{"nama":"David Rosenhan","kontribusi":"Studi kontroversial tentang kuatnya pengaruh label diagnosis di institusi psikiatri."}],"istilah":[{"term":"DSM","definisi":"Pedoman klasifikasi dan diagnosis gangguan mental yang digunakan secara luas."},{"term":"Model diatesis-stres","definisi":"Model bahwa gangguan muncul dari interaksi kerentanan bawaan dengan pemicu stres lingkungan."},{"term":"Komorbiditas","definisi":"Kondisi ketika seseorang memenuhi kriteria lebih dari satu gangguan sekaligus."},{"term":"Gangguan kecemasan umum","definisi":"Kekhawatiran berlebihan dan sulit dikendalikan tentang berbagai hal secara menetap."},{"term":"Gangguan panik","definisi":"Serangan panik berulang yang datang tiba-tiba disertai gejala fisik hebat."},{"term":"OCD","definisi":"Gangguan dengan obsesi berupa pikiran mengganggu dan kompulsi berupa perilaku ritual."},{"term":"PTSD","definisi":"Gejala menetap setelah peristiwa traumatis, meliputi ingatan mengganggu dan kewaspadaan berlebihan."},{"term":"Depresi mayor","definisi":"Gangguan mood dengan suasana hati depresif atau anhedonia minimal dua minggu."},{"term":"Anhedonia","definisi":"Hilangnya minat dan kemampuan merasakan kesenangan."},{"term":"Gangguan bipolar","definisi":"Gangguan mood dengan pergantian episode manik dan depresif."},{"term":"Gejala positif skizofrenia","definisi":"Tambahan pengalaman yang tidak seharusnya ada, seperti halusinasi dan delusi."},{"term":"Gejala negatif skizofrenia","definisi":"Berkurangnya fungsi normal, seperti afek datar dan hilangnya motivasi."},{"term":"Triad kognitif negatif","definisi":"Pandangan negatif Beck tentang diri sendiri, dunia, dan masa depan pada depresi."},{"term":"Stigma","definisi":"Pandangan negatif masyarakat yang menghambat orang mencari bantuan profesional."}],"quiz":[{"soal":"Kriteria yang digunakan untuk menentukan suatu perilaku sebagai gangguan psikologis meliputi hal berikut, KECUALI...","pilihan":["Distres signifikan","Disfungsi dalam kehidupan sehari-hari","Sekadar berbeda dari kebanyakan orang","Bahaya bagi diri atau orang lain"],"jawaban":3,"penjelasan":"Sekadar 'berbeda' dari mayoritas tidak cukup; harus disertai distres, disfungsi, atau bahaya."},{"soal":"Model yang menjelaskan gangguan psikologis muncul dari interaksi kerentanan bawaan dan pemicu stres lingkungan disebut model...","pilihan":["Diatesis-stres","Drive-reduction","Dua faktor","Triarkis"],"jawaban":1,"penjelasan":"Model diatesis-stres menekankan bahwa kerentanan saja atau stres saja umumnya tidak cukup memunculkan gangguan."},{"soal":"Gangguan yang ditandai halusinasi, delusi, dan terganggunya kontak dengan realitas adalah...","pilihan":["Gangguan kecemasan umum","Depresi mayor","Skizofrenia","Fobia spesifik"],"jawaban":3,"penjelasan":"Skizofrenia adalah gangguan psikotik dengan gejala positif berupa halusinasi, delusi, dan pikiran kacau."},{"soal":"Afek datar, menarik diri secara sosial, dan hilangnya motivasi pada skizofrenia termasuk...","pilihan":["Gejala positif","Gejala negatif","Delusi","Kompulsi"],"jawaban":2,"penjelasan":"Gejala negatif adalah BERKURANGNYA fungsi normal, berbeda dari gejala positif yang merupakan tambahan pengalaman."},{"soal":"Pernyataan yang BENAR tentang skizofrenia adalah...","pilihan":["Skizofrenia sama dengan kepribadian ganda","Skizofrenia adalah gangguan psikotik, berbeda dari gangguan identitas disosiatif","Penderitanya hampir selalu berbahaya","Skizofrenia tidak dapat ditangani sama sekali"],"jawaban":2,"penjelasan":"Skizofrenia sering dikelirukan dengan kepribadian ganda. Keduanya adalah kondisi yang sepenuhnya berbeda."},{"soal":"Gangguan mood yang ditandai pergantian episode manik dan depresif disebut...","pilihan":["Depresi mayor","Gangguan bipolar","Gangguan panik","PTSD"],"jawaban":2,"penjelasan":"Gangguan bipolar ditandai pergantian antara episode manik dengan energi sangat tinggi dan episode depresif."},{"soal":"Triad kognitif negatif yang dirumuskan Aaron Beck pada depresi terdiri dari pandangan negatif tentang...","pilihan":["Diri sendiri, dunia, dan masa depan","Id, ego, dan superego","Masa lalu, kini, dan nanti","Keluarga, teman, dan pekerjaan"],"jawaban":1,"penjelasan":"Beck menyebut depresi dipelihara oleh pandangan negatif terhadap diri sendiri, dunia sekitar, dan masa depan."},{"soal":"Fakta yang benar mengenai orang dengan gangguan mental dan kekerasan adalah...","pilihan":["Mereka hampir selalu menjadi pelaku kekerasan","Mereka justru lebih sering menjadi korban kekerasan daripada pelakunya","Tidak ada datanya sama sekali","Semua gangguan mental menyebabkan agresi"],"jawaban":2,"penjelasan":"Anggapan bahwa penderita gangguan mental berbahaya adalah miskonsepsi yang merugikan; mereka lebih sering menjadi korban."},{"soal":"Homoseksualitas pernah dimasukkan sebagai gangguan dalam DSM hingga dihapus pada 1973. Pelajaran terpenting dari peristiwa ini adalah...","pilihan":["Klasifikasi diagnosis tidak pernah berguna","Sistem klasifikasi dapat mencerminkan prasangka zamannya sehingga perlu terus dikaji ulang","Semua diagnosis pasti salah","Norma budaya tidak relevan"],"jawaban":2,"penjelasan":"Peristiwa ini mengingatkan bahwa kriteria gangguan bukan sesuatu yang netral sepenuhnya dan perlu ditinjau secara kritis."},{"soal":"Kecenderungan merasa mengalami gejala gangguan yang sedang dipelajari disebut...","pilihan":["Medical student syndrome","Komorbiditas","Stigma","Anhedonia"],"jawaban":1,"penjelasan":"Fenomena ini wajar saat mempelajari psikopatologi, dan justru menegaskan bahwa diagnosis memerlukan asesmen profesional."}],"kasus":{"skenario":"Seorang mahasiswa selama lebih dari dua minggu merasa sedih hampir sepanjang hari, kehilangan minat pada hampir semua aktivitas yang dulu ia sukai termasuk berkumpul dengan teman, sulit tidur, nafsu makan menurun, sulit berkonsentrasi, dan merasa dirinya tidak berharga. Kuliahnya mulai terbengkalai.","pertanyaan":"Kumpulan gejala ini paling menyerupai ciri...","pilihan":["Gangguan kecemasan umum","Depresi mayor","Skizofrenia","Gangguan bipolar"],"jawaban":2,"penjelasan":"Suasana hati depresif disertai anhedonia selama minimal dua minggu, ditambah gangguan tidur, nafsu makan, konsentrasi, dan perasaan tidak berharga, adalah ciri khas depresi mayor. CATATAN PENTING: ini semata ilustrasi edukatif. Diagnosis sesungguhnya hanya boleh ditegakkan oleh psikolog atau psikiater melalui asesmen menyeluruh. Jika kamu mengalami hal serupa, mencari bantuan profesional adalah langkah yang tepat."},"isian":[{"kalimat":"Pedoman klasifikasi diagnosis gangguan mental yang banyak digunakan secara internasional disingkat ___.","jawaban":["dsm"]},{"kalimat":"Gangguan mood dengan pergantian episode manik dan depresif disebut gangguan ___.","jawaban":["bipolar"]},{"kalimat":"Hilangnya minat dan kemampuan merasakan kesenangan disebut ___.","jawaban":["anhedonia"]},{"kalimat":"Sikap negatif masyarakat yang menghambat orang mencari bantuan profesional disebut ___.","jawaban":["stigma"]}]},{"nomor":16,"id":"ch16","judul":"Terapi dan Penanganan","ikon":"comments","pendahuluan":"Bab ini membahas berbagai pendekatan penanganan gangguan psikologis: psikoterapi berbasis psikodinamik, humanistik, perilaku, dan kognitif; terapi biomedis; serta apa yang sebenarnya membuat terapi berhasil dan bagaimana mencari bantuan yang tepat.","materi":[{"judul":"Sejarah Singkat Penanganan","poin":["Sepanjang sejarah, gangguan mental pernah dijelaskan sebagai kerasukan roh dan ditangani dengan cara yang kejam.","Philippe PINEL di Prancis dan Dorothea DIX di Amerika memperjuangkan MORAL TREATMENT, yaitu penanganan yang manusiawi dan penuh martabat.","DEINSTITUSIONALISASI pada pertengahan abad ke-20 memindahkan perawatan dari rumah sakit jiwa besar ke layanan berbasis komunitas. Niatnya baik, tetapi tanpa dukungan layanan komunitas yang memadai, banyak orang justru menjadi tunawisma atau tidak tertangani.","Penanganan modern menekankan pendekatan berbasis bukti, penghormatan terhadap hak pasien, dan integrasi layanan kesehatan mental ke layanan kesehatan umum."]},{"judul":"Terapi Psikodinamik dan Humanistik","poin":["TERAPI PSIKOANALISIS klasik (Freud) bertujuan menyadarkan konflik bawah sadar melalui ASOSIASI BEBAS (mengucapkan apa pun yang terlintas), analisis mimpi, serta penafsiran RESISTENSI dan TRANSFERENSI (memindahkan perasaan terhadap tokoh masa lalu kepada terapis).","TERAPI PSIKODINAMIK modern lebih singkat, lebih fokus pada relasi saat ini, dan lebih sedikit menekankan dorongan seksual dibanding psikoanalisis klasik.","TERAPI PERSON-CENTERED (Carl Rogers) berangkat dari keyakinan bahwa klien memiliki kapasitas untuk tumbuh sendiri bila diberi iklim yang tepat.","Tiga kondisi inti Rogers: EMPATI (memahami dunia klien dari sudut pandangnya), PENERIMAAN TANPA SYARAT (unconditional positive regard), dan KESELARASAN/genuineness (terapis bersikap tulus dan tidak berpura-pura).","Teknik khas person-centered adalah MENDENGAR AKTIF dan refleksi, bukan memberi nasihat atau menghakimi.","TERAPI GESTALT (Fritz Perls) menekankan kesadaran pada pengalaman saat ini (here and now) dan penerimaan tanggung jawab atas pilihan sendiri."]},{"judul":"Terapi Perilaku","poin":["Terapi perilaku berangkat dari prinsip belajar: perilaku bermasalah dipelajari, sehingga dapat pula 'dilepas-pelajari'.","DESENSITISASI SISTEMATIS (Joseph Wolpe) memadukan pelatihan relaksasi dengan paparan bertahap terhadap hierarki situasi yang ditakuti, sangat efektif untuk fobia.","TERAPI EKSPOSUR menghadapkan klien pada stimulus yang ditakuti tanpa konsekuensi buruk sehingga respons takut mengalami extinction. Eksposur dapat bertahap maupun intensif (flooding).","EXPOSURE AND RESPONSE PREVENTION (ERP) adalah standar penanganan OCD: klien terpapar pemicu obsesi namun dicegah melakukan kompulsi, sehingga belajar bahwa kecemasan mereda dengan sendirinya.","MODIFIKASI PERILAKU menggunakan prinsip operan: token economy memberi token yang dapat ditukar sebagai penguatan atas perilaku yang diinginkan.","AVERSION THERAPY memasangkan perilaku yang tidak diinginkan dengan stimulus tidak menyenangkan; penggunaannya terbatas dan menuai perdebatan etis."]},{"judul":"Terapi Kognitif dan CBT","poin":["TERAPI KOGNITIF berangkat dari premis bahwa yang paling memengaruhi perasaan bukan peristiwa itu sendiri, melainkan PENAFSIRAN kita terhadapnya.","Aaron BECK mengidentifikasi PIKIRAN OTOMATIS NEGATIF dan berbagai DISTORSI KOGNITIF: berpikir hitam-putih, generalisasi berlebihan, katastrofisasi, penyaringan mental, personalisasi, dan pembacaan pikiran.","Albert ELLIS mengembangkan REBT dengan model ABC: Activating event (peristiwa pemicu), Belief (keyakinan tentang peristiwa itu), dan Consequence (konsekuensi emosional). Yang diubah adalah B, bukan A.","CBT (Cognitive Behavioral Therapy) memadukan restrukturisasi kognitif dengan teknik perilaku. Ciri khasnya: terstruktur, berorientasi tujuan, berjangka relatif pendek, dan menggunakan tugas rumah.","CBT adalah salah satu pendekatan dengan DUKUNGAN BUKTI TERKUAT untuk depresi, gangguan kecemasan, OCD, PTSD, insomnia, dan berbagai kondisi lain.","Gelombang ketiga terapi perilaku-kognitif mencakup ACT (Acceptance and Commitment Therapy), DBT (Dialectical Behavior Therapy, efektif untuk gangguan kepribadian borderline), dan MBCT berbasis mindfulness."]},{"judul":"Terapi Kelompok, Keluarga, dan Biomedis","poin":["TERAPI KELOMPOK memberi manfaat khas berupa universalitas (menyadari bahwa bukan hanya kita yang mengalaminya), dukungan sebaya, umpan balik dari berbagai sudut, dan biaya yang lebih terjangkau.","TERAPI KELUARGA memandang masalah sebagai bagian dari SISTEM relasi, bukan semata milik satu individu, dan berfokus memperbaiki pola komunikasi serta batas peran dalam keluarga.","TERAPI BIOMEDIS menangani gangguan melalui intervensi pada dasar biologisnya.","ANTIDEPRESAN, termasuk kelompok SSRI, bekerja memengaruhi neurotransmiter seperti serotonin. Efeknya umumnya baru terasa setelah beberapa minggu.","ANSIOLITIK (obat anti-cemas) seperti golongan benzodiazepin bekerja cepat namun berisiko menimbulkan ketergantungan bila digunakan jangka panjang.","ANTIPSIKOTIK menangani gejala psikotik terutama dengan memengaruhi sistem dopamin; lebih efektif terhadap gejala positif dibanding gejala negatif.","MOOD STABILIZER seperti litium digunakan pada gangguan bipolar.","ECT (terapi elektrokonvulsif) modern dilakukan dengan anestesi dan pemantauan ketat, dan dapat sangat efektif pada depresi berat yang tidak merespons penanganan lain. Prosedur ini berbeda jauh dari citra menyeramkan di film-film lama.","Untuk banyak kondisi, KOMBINASI psikoterapi dan farmakoterapi memberi hasil lebih baik daripada salah satunya saja. Obat tidak mengajarkan keterampilan mengelola masalah, sedangkan terapi membangun keterampilan tersebut."]},{"judul":"Efektivitas Terapi dan Mencari Bantuan","poin":["Riset menunjukkan psikoterapi secara umum EFEKTIF: rata-rata orang yang menjalani terapi berada dalam kondisi lebih baik dibanding sebagian besar orang yang tidak mendapat penanganan.","FAKTOR UMUM yang berlaku lintas pendekatan menjelaskan sebagian besar keberhasilan terapi: ALIANSI TERAPEUTIK (hubungan kerja sama dan kepercayaan antara terapis dan klien), harapan bahwa keadaan bisa membaik, kesempatan mengungkapkan diri, dan penjelasan yang masuk akal atas masalah yang dialami.","Aliansi terapeutik adalah salah satu prediktor hasil terapi yang paling konsisten, sering kali lebih kuat daripada jenis pendekatan yang dipilih.","Meski demikian, untuk sebagian kondisi ada pendekatan yang terbukti lebih unggul, misalnya ERP untuk OCD dan terapi eksposur untuk fobia serta PTSD.","Banyak terapis kini bersikap EKLEKTIK atau INTEGRATIF, memilih teknik dari berbagai pendekatan sesuai kebutuhan spesifik klien.","KOMPETENSI BUDAYA penting: terapis perlu memahami latar belakang budaya, nilai, dan konteks sosial klien agar penanganan terasa relevan dan menghormati.","Mencari bantuan adalah langkah yang wajar dan sehat. Di Indonesia, layanan psikologi tersedia di puskesmas tertentu, rumah sakit, klinik, biro psikologi, serta layanan konseling di banyak kampus - sering kali gratis untuk mahasiswa.","Terapi yang baik membutuhkan waktu dan keterlibatan aktif klien, termasuk mengerjakan latihan di luar sesi. Jika merasa tidak cocok dengan seorang terapis, mencari terapis lain adalah hal yang wajar dan bukan tanda kegagalan."]}],"ringkasan":["Psikodinamik menggali bawah sadar; humanistik menyediakan iklim tumbuh; perilaku mengubah pola belajar; kognitif mengubah penafsiran.","CBT punya dukungan bukti terkuat untuk depresi, kecemasan, OCD, PTSD, dan insomnia.","Teknik penting: desensitisasi sistematis dan eksposur untuk fobia, ERP untuk OCD, model ABC untuk REBT.","Terapi biomedis: antidepresan, ansiolitik, antipsikotik, mood stabilizer. Umumnya paling baik DIKOMBINASIKAN dengan psikoterapi.","Aliansi terapeutik adalah prediktor keberhasilan paling konsisten, sering melebihi jenis pendekatannya."],"tokoh":[{"nama":"Sigmund Freud","kontribusi":"Mengembangkan psikoanalisis dengan teknik asosiasi bebas dan analisis transferensi."},{"nama":"Carl Rogers","kontribusi":"Terapi person-centered dengan tiga kondisi inti: empati, penerimaan tanpa syarat, dan keselarasan."},{"nama":"Joseph Wolpe","kontribusi":"Mengembangkan desensitisasi sistematis untuk menangani fobia."},{"nama":"Aaron Beck","kontribusi":"Bapak terapi kognitif; mengidentifikasi pikiran otomatis negatif dan distorsi kognitif."},{"nama":"Albert Ellis","kontribusi":"Mengembangkan REBT dengan model ABC tentang keyakinan irasional."},{"nama":"Marsha Linehan","kontribusi":"Mengembangkan DBT yang efektif untuk gangguan kepribadian borderline."},{"nama":"Philippe Pinel & Dorothea Dix","kontribusi":"Memperjuangkan penanganan yang manusiawi bagi penderita gangguan mental."}],"istilah":[{"term":"Psikoterapi","definisi":"Penanganan masalah psikologis melalui interaksi dan relasi terapeutik."},{"term":"Asosiasi bebas","definisi":"Teknik psikoanalisis berupa mengucapkan apa pun yang terlintas tanpa disaring."},{"term":"Transferensi","definisi":"Pemindahan perasaan klien terhadap tokoh masa lalu kepada terapis."},{"term":"Terapi person-centered","definisi":"Pendekatan humanistik Rogers berbasis empati, penerimaan tanpa syarat, dan ketulusan."},{"term":"Desensitisasi sistematis","definisi":"Teknik memadukan relaksasi dengan paparan bertahap terhadap situasi yang ditakuti."},{"term":"Terapi eksposur","definisi":"Menghadapkan klien pada stimulus yang ditakuti agar respons takut mengalami extinction."},{"term":"ERP","definisi":"Exposure and response prevention, standar penanganan untuk OCD."},{"term":"Distorsi kognitif","definisi":"Pola pikir keliru seperti katastrofisasi dan berpikir hitam-putih."},{"term":"CBT","definisi":"Terapi yang memadukan restrukturisasi kognitif dengan teknik perilaku."},{"term":"Model ABC","definisi":"Model Ellis: Activating event, Belief, dan Consequence dalam REBT."},{"term":"Token economy","definisi":"Sistem modifikasi perilaku dengan token yang dapat ditukar sebagai penguatan."},{"term":"Aliansi terapeutik","definisi":"Hubungan kerja sama dan kepercayaan antara terapis dan klien."},{"term":"Faktor umum","definisi":"Unsur yang berlaku lintas pendekatan terapi dan menjelaskan sebagian besar keberhasilannya."},{"term":"SSRI","definisi":"Golongan antidepresan yang bekerja memengaruhi ketersediaan serotonin."}],"quiz":[{"soal":"Pendekatan terapi yang berfokus mengubah pola pikir negatif sekaligus perilaku maladaptif disebut...","pilihan":["Terapi psikodinamik","Terapi kognitif-perilaku (CBT)","Terapi biomedis","Terapi gestalt"],"jawaban":2,"penjelasan":"CBT memadukan restrukturisasi kognitif dengan teknik perilaku, dan memiliki dukungan bukti terkuat untuk banyak gangguan."},{"soal":"Tiga kondisi inti terapi person-centered menurut Carl Rogers adalah...","pilihan":["Empati, penerimaan tanpa syarat, dan keselarasan","Asosiasi bebas, analisis mimpi, dan transferensi","Relaksasi, eksposur, dan token","Obat, terapi, dan istirahat"],"jawaban":1,"penjelasan":"Rogers menyebut empati, unconditional positive regard, dan genuineness sebagai kondisi yang memungkinkan pertumbuhan klien."},{"soal":"Teknik yang memadukan pelatihan relaksasi dengan paparan bertahap terhadap objek fobia disebut...","pilihan":["Token economy","Desensitisasi sistematis","Asosiasi bebas","Analisis mimpi"],"jawaban":2,"penjelasan":"Desensitisasi sistematis dikembangkan Joseph Wolpe dan sangat efektif untuk menangani fobia."},{"soal":"Standar penanganan untuk OCD yang memapar klien pada pemicu obsesi sambil mencegah kompulsi disebut...","pilihan":["ERP (exposure and response prevention)","Token economy","Aversion therapy","Terapi gestalt"],"jawaban":1,"penjelasan":"ERP membantu klien belajar bahwa kecemasan mereda dengan sendirinya tanpa perlu melakukan ritual kompulsi."},{"soal":"Dalam model ABC dari Albert Ellis, komponen yang menjadi sasaran perubahan dalam terapi adalah...","pilihan":["A - peristiwa pemicu","B - keyakinan tentang peristiwa","C - konsekuensi emosional","Semuanya tidak dapat diubah"],"jawaban":2,"penjelasan":"REBT menargetkan keyakinan irasional (Belief), karena peristiwa pemicu (A) sering tidak dapat diubah."},{"soal":"Prediktor keberhasilan terapi yang paling konsisten lintas berbagai pendekatan adalah...","pilihan":["Jenis pendekatan yang dipilih","Kualitas aliansi terapeutik antara terapis dan klien","Lamanya pendidikan terapis","Jumlah obat yang diberikan"],"jawaban":2,"penjelasan":"Aliansi terapeutik adalah salah satu faktor umum yang paling konsisten memprediksi hasil terapi."},{"soal":"Golongan obat yang bekerja cepat mengatasi kecemasan namun berisiko menimbulkan ketergantungan adalah...","pilihan":["Antidepresan SSRI","Benzodiazepin (ansiolitik)","Antipsikotik","Mood stabilizer"],"jawaban":2,"penjelasan":"Benzodiazepin bekerja cepat tetapi berisiko ketergantungan bila digunakan dalam jangka panjang."},{"soal":"Untuk banyak gangguan, hasil terbaik umumnya diperoleh dengan...","pilihan":["Obat saja tanpa psikoterapi","Kombinasi psikoterapi dan farmakoterapi","Menghentikan penanganan begitu gejala membaik","Menghindari bantuan profesional"],"jawaban":2,"penjelasan":"Obat membantu meredakan gejala, sementara psikoterapi membangun keterampilan mengelola masalah - kombinasinya sering paling efektif."},{"soal":"Deinstitusionalisasi pada pertengahan abad ke-20 menimbulkan masalah karena...","pilihan":["Rumah sakit jiwa justru diperbanyak","Layanan berbasis komunitas tidak disiapkan secara memadai","Semua pasien sembuh total","Obat-obatan dilarang"],"jawaban":2,"penjelasan":"Niat memindahkan perawatan ke komunitas baik, tetapi tanpa dukungan layanan yang memadai banyak orang justru tidak tertangani."},{"soal":"Terapi keluarga memandang masalah psikologis terutama sebagai...","pilihan":["Kesalahan satu individu saja","Bagian dari sistem relasi dan pola komunikasi keluarga","Akibat faktor genetik semata","Sesuatu yang tidak dapat ditangani"],"jawaban":2,"penjelasan":"Pendekatan sistem memandang gejala seseorang tidak terlepas dari pola interaksi dan batas peran dalam keluarganya."}],"kasus":{"skenario":"Seorang klien dengan kecemasan sosial mengikuti terapi. Terapis membantunya mengenali pikiran otomatis seperti 'semua orang pasti menilai saya bodoh', menguji bukti untuk dan melawan pikiran tersebut, lalu memberinya tugas rumah berupa latihan bertahap memulai percakapan singkat dengan orang baru.","pertanyaan":"Pendekatan terapi yang digunakan pada kasus ini paling menyerupai...","pilihan":["Terapi psikodinamik","Terapi kognitif-perilaku (CBT)","Terapi biomedis murni","Terapi person-centered"],"jawaban":2,"penjelasan":"Kombinasi mengidentifikasi dan menguji pikiran otomatis negatif (komponen kognitif) dengan latihan perilaku bertahap dan tugas rumah adalah ciri khas CBT."},"isian":[{"kalimat":"Pendekatan terapi yang menggali konflik bawah sadar dan pengalaman masa lalu disebut terapi ___.","jawaban":["psikodinamik","psikoanalisis"]},{"kalimat":"Golongan obat yang membantu mengatasi gejala kecemasan disebut ___.","jawaban":["ansiolitik","anxiolitik"]},{"kalimat":"Kualitas hubungan kepercayaan antara terapis dan klien yang memengaruhi hasil terapi disebut aliansi ___.","jawaban":["terapeutik"]},{"kalimat":"Teknik psikoanalisis berupa mengucapkan apa pun yang terlintas di pikiran disebut ___ bebas.","jawaban":["asosiasi"]}]}]}</script><!--KONTEN:SELESAI-->
<script>
(() => {
'use strict';

/* =========================================================
   UTILITAS
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
const arr = x => Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]);
const str = x => x == null ? '' : (Array.isArray(x) ? str(x[0]) : String(x));
const un = v => (Array.isArray(v) && v.length === 1) ? v[0] : v;
const pad2 = n => String(n).padStart(2, '0');
const range = n => Array.from({ length: n }, (_, i) => i);
const huruf = i => String.fromCharCode(65 + i);
const benar = v => v === true || v === 'TRUE' || v === 1;
function acak(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hariIni(d = new Date()) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function ic(nama, cls) { return `<svg class="ic${cls ? ' ' + cls : ''}" aria-hidden="true" focusable="false"><use href="#i-${nama}"></use></svg>`; }
function normTeks(s) { return str(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function slugNama(n) { return normTeks(n).replace(/\s+/g, '-').slice(0, 48) || 'profil'; }
function levenshtein(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = range(n + 1), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function fmtWaktu(detik) { detik = Math.max(0, Math.round(detik)); const m = Math.floor(detik / 60), s = detik % 60; return pad2(m) + ':' + pad2(s); }
function fmtTanggal(iso) { try { return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return str(iso).slice(0, 10); } }

/* =========================================================
   KONTEN (skema sama dengan chapters_data di R/data_content.R)
   ========================================================= */
let RAW = {};
try { RAW = JSON.parse(document.getElementById('data-konten').textContent || '{}') || {}; } catch (e) { RAW = {}; }
const SUMBER = Object.assign({
  judul: 'Psychology 2e', penulis: 'Spielman, R. M., Jenkins, W. J., & Lovett, M. D.', tahun: '2020',
  penerbit: 'OpenStax', lisensi: 'CC BY 4.0', lisensi_url: 'https://creativecommons.org/licenses/by/4.0/',
  url: 'https://openstax.org/details/books/psychology-2e'
}, Object.fromEntries(Object.entries(RAW.sumber || RAW.SUMBER || {}).map(([k, v]) => [k, str(v)])));
const VERSI = str(RAW.versi || RAW.KONTEN_VERSI);
const CONTOH = benar(un(RAW.contoh));

function normBab(b, i) {
  b = b || {};
  const nomor = Number(un(b.nomor)) || i + 1;
  const kasusRaw = Array.isArray(b.kasus) ? b.kasus : (b.kasus ? [b.kasus] : []);
  return {
    id: str(b.id).replace(/[^A-Za-z0-9-]/g, '') || 'ch' + pad2(nomor),
    nomor, judul: str(b.judul), ikon: str(b.ikon), pendahuluan: str(b.pendahuluan),
    materi: arr(b.materi).map(s => ({
      judul: str(s && s.judul), poin: arr(s && s.poin).map(str),
      teks: arr(s && (s.teks || s.pengantar || s.paragraf)).map(str), contoh: arr(s && s.contoh).map(str)
    })),
    tokoh: arr(b.tokoh).map(t => ({ nama: str(t && t.nama), kontribusi: str(t && t.kontribusi) })).filter(t => t.nama),
    ringkasan: arr(b.ringkasan).map(str),
    istilah: arr(b.istilah).map(t => ({ term: str(t && t.term), definisi: str(t && t.definisi) })).filter(t => t.term),
    quiz: arr(b.quiz).map(q => ({
      soal: str(q && q.soal), pilihan: arr(q && q.pilihan).map(str),
      jawaban: Number(un(q && q.jawaban)) || 1, penjelasan: str(q && q.penjelasan)
    })).filter(q => q.soal && q.pilihan.length > 1),
    isian: arr(b.isian).map(f => ({ kalimat: str(f && f.kalimat), jawaban: arr(f && f.jawaban).map(str).filter(Boolean) })).filter(f => f.kalimat && f.jawaban.length),
    kasus: kasusRaw.map(k => ({
      skenario: str(k && k.skenario), pertanyaan: str(k && k.pertanyaan), pilihan: arr(k && k.pilihan).map(str),
      jawaban: Number(un(k && k.jawaban)) || 1, penjelasan: str(k && k.penjelasan)
    })).filter(k => k.pilihan.length > 1)
  };
}
let babRaw = RAW.bab || RAW.chapters_data || RAW.chapters || [];
if (!Array.isArray(babRaw)) babRaw = Object.values(babRaw);
const BAB = babRaw.map(normBab).sort((a, b) => a.nomor - b.nomor);
const BAB_ID = Object.fromEntries(BAB.map(b => [b.id, b]));
const N = BAB.length;
const TOTAL_ISTILAH = BAB.reduce((n, b) => n + b.istilah.length, 0);

const IKON_NOMOR = ['brain', 'flask', 'neuron', 'moon', 'eye', 'bell', 'spark', 'archive', 'sprout', 'heart', 'mask', 'users', 'briefcase', 'pulse', 'cloud', 'chat'];
const IKON_FA = {
  brain: 'brain', flask: 'flask', vial: 'flask', microscope: 'flask', dna: 'neuron', 'head-side-virus': 'neuron',
  moon: 'moon', bed: 'moon', eye: 'eye', bell: 'bell', lightbulb: 'spark', memory: 'archive', 'box-archive': 'archive',
  baby: 'sprout', child: 'sprout', seedling: 'sprout', heart: 'heart', 'masks-theater': 'mask', fingerprint: 'mask',
  users: 'users', 'people-group': 'users', 'user-group': 'users', briefcase: 'briefcase', 'heart-pulse': 'pulse',
  heartbeat: 'pulse', 'cloud-rain': 'cloud', cloud: 'cloud', comments: 'chat', 'hand-holding-heart': 'chat', handshake: 'chat'
};
const ikonBab = b => IKON_FA[b.ikon] || IKON_NOMOR[b.nomor - 1] || 'book';

/* =========================================================
   PENYIMPANAN (localStorage, aman bila tidak tersedia)
   ========================================================= */
const PFX = 'psikologi-interaktif:';
const store = (() => { try { const k = PFX + 'uji'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) { return null; } })();
const SIMPAN_OK = !!store;
const memori = {};
function sGet(k) { try { if (store) return store.getItem(PFX + k); } catch (e) { } return k in memori ? memori[k] : null; }
function sSet(k, v) { try { if (store) { store.setItem(PFX + k, v); return true; } } catch (e) { } memori[k] = v; return false; }
function sDel(k) { try { if (store) store.removeItem(PFX + k); } catch (e) { } delete memori[k]; }
function sJSON(k, def) { try { const v = sGet(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }

const PREF_DEF = { tema: null, teks: 0, acakKuis: false, modeKuis: 'akhir', fcDefDulu: false };
const pref = Object.assign({}, PREF_DEF, sJSON('pref', {}));
const simpanPref = () => sSet('pref', JSON.stringify(pref));

/* =========================================================
   PROGRES (nama field sama dengan progres_ke_list di versi Shiny)
   ========================================================= */
const KUNCI_MAP = ['materi_done', 'flashcard_done', 'quiz_done', 'quiz_score', 'quiz_perfect', 'quiz_percobaan',
  'kasus_done', 'cocok_done', 'isian_done', 'quiz_riwayat', 'cocok_skor', 'isian_skor', 'kasus_benar', 'fc_dilihat', 'hafal'];
const MAP_LIST = ['quiz_riwayat', 'fc_dilihat', 'hafal'];
function progresKosong(nama) {
  const now = new Date().toISOString();
  const p = { skema: 2, nama: nama || null, dibuat: now, terakhir_buka: now, bab_terakhir: null, total_sesi: 0, hari_aktif: [], ujian: [], lencana: [] };
  KUNCI_MAP.forEach(k => { p[k] = {}; });
  return p;
}
function normProgres(o, nama) {
  const p = progresKosong(nama);
  if (!o || typeof o !== 'object') return p;
  KUNCI_MAP.forEach(k => {
    const v = o[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      const isi = {};
      Object.entries(v).forEach(([id, x]) => { isi[id] = MAP_LIST.includes(k) ? arr(x) : un(x); });
      p[k] = isi;
    }
  });
  ['dibuat', 'terakhir_buka', 'bab_terakhir'].forEach(k => { const v = str(un(o[k])); if (v) p[k] = v; });
  if (!nama && str(un(o.nama))) p.nama = str(un(o.nama));
  p.total_sesi = Number(un(o.total_sesi)) || 0;
  if (Array.isArray(o.hari_aktif)) p.hari_aktif = o.hari_aktif.filter(x => typeof x === 'string').slice(-120);
  if (Array.isArray(o.ujian)) p.ujian = o.ujian.filter(x => x && typeof x === 'object').slice(-20);
  if (Array.isArray(o.lencana)) p.lencana = o.lencana.filter(x => typeof x === 'string');
  return p;
}

let daftarProfil = sJSON('profil', []).filter(x => x && x.kunci && x.nama);
let kunciAktif = null;      // null = belajar sebagai tamu
let P = progresKosong(null);
let lastSimpanOK = SIMPAN_OK;

const muatProgres = kunci => normProgres(sJSON('p:' + kunci, null));
const simpanDaftar = () => sSet('profil', JSON.stringify(daftarProfil));

function simpan(aktivitas = true) {
  if (aktivitas) {
    const h = hariIni();
    if (!P.hari_aktif.includes(h)) { P.hari_aktif.push(h); P.hari_aktif = P.hari_aktif.slice(-120); }
  }
  P.terakhir_buka = new Date().toISOString();
  cekLencana(aktivitas);
  lastSimpanOK = sSet('p:' + (kunciAktif || '_tamu'), JSON.stringify(P));
  renderSidebar();
}

function pakaiProfil(nama) {
  nama = str(nama).trim().replace(/\s+/g, ' ').slice(0, 40);
  if (!nama) return false;
  const kunci = slugNama(nama);
  const ada = daftarProfil.find(x => x.kunci === kunci);
  let p;
  if (ada) {
    p = muatProgres(kunci); p.nama = ada.nama;
  } else {
    const tamuPunyaProgres = !kunciAktif && adaProgres(P);
    p = tamuPunyaProgres ? normProgres(P, nama) : progresKosong(nama);
    p.nama = nama;
    daftarProfil.push({ kunci, nama }); simpanDaftar();
    if (tamuPunyaProgres) sDel('p:_tamu');
  }
  p.total_sesi = (p.total_sesi || 0) + 1;
  kunciAktif = kunci; P = p; sSet('aktif', kunci);
  resetStateSesi();
  simpan(false);
  return true;
}
function adaProgres(p) { return KUNCI_MAP.some(k => Object.keys(p[k] || {}).length > 0) || (p.ujian || []).length > 0; }

/* ---- Kode progres: cadangan & pindah perangkat ----
   Formatnya sama dengan progres_ke_kode() di versi Shiny ("PSI1:" + base64 JSON),
   jadi kode dari aplikasi Shiny bisa dipulihkan di sini dan sebaliknya.
   Field tambahan versi HTML diabaikan oleh versi Shiny. */
// UTF-8 <-> string biner untuk btoa/atob (setara charToRaw/rawToChar di R)
function keBiner(teks) { return unescape(encodeURIComponent(teks)); }
function dariBiner(bin) { try { return decodeURIComponent(escape(bin)); } catch (e) { return bin; } }
function keKode(p) {
  const salin = Object.assign({}, p, { nama: p.nama || '', bab_terakhir: p.bab_terakhir || '' });
  return 'PSI1:' + btoa(keBiner(JSON.stringify(salin)));
}
function dariKode(kode) {
  const m = str(kode).replace(/\s+/g, '').match(/^PSI(\d+):(.+)$/i);
  if (!m) return null;
  try {
    let b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bin = atob(b64);
    const json = dariBiner(bin);
    const o = JSON.parse(json);
    if (!o || typeof o !== 'object') return null;
    const dikenal = KUNCI_MAP.concat(['nama', 'bab_terakhir', 'total_sesi']).some(k => k in o);
    return dikenal ? normProgres(o) : null;
  } catch (e) { return null; }
}

   RINGKASAN PROGRES & LENCANA
   ========================================================= */
function hafalSet(id) { return new Set(arr(P.hafal[id]).map(str)); }
function statusBab(b) {
  const id = b.id, akt = [];
  akt.push({ k: 'materi', label: 'Materi', ok: benar(P.materi_done[id]) });
  if (b.istilah.length) akt.push({ k: 'flashcard', label: 'Flashcard', ok: benar(P.flashcard_done[id]) });
  if (b.quiz.length) akt.push({ k: 'kuis', label: 'Kuis', ok: benar(P.quiz_done[id]) });
  const adaCocok = b.istilah.length >= 2, adaIsian = b.isian.length > 0;
  if (adaCocok || adaIsian) {
    const c = benar(P.cocok_done[id]), s = benar(P.isian_done[id]);
    const ok = (!adaCocok || c) && (!adaIsian || s);
    akt.push({ k: 'latihan', label: 'Cocokkan & Isian', ok, half: !ok && (c || s) });
  }
  if (b.kasus.length) akt.push({ k: 'kasus', label: 'Studi Kasus', ok: benar(P.kasus_done[id]) });
  const selesai = akt.filter(a => a.ok).length;
  const skor = P.quiz_score[id];
  return { akt, selesai, total: akt.length, persen: Math.round(selesai / akt.length * 100), skor: skor == null ? null : Number(skor) };
}
function hitungStreak() {
  const set = new Set(P.hari_aktif); const d = new Date(); let n = 0;
  if (!set.has(hariIni(d))) { d.setDate(d.getDate() - 1); if (!set.has(hariIni(d))) return 0; }
  while (set.has(hariIni(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function jumlahHafal() { return BAB.reduce((n, b) => { const h = hafalSet(b.id); return n + b.istilah.filter(t => h.has(t.term)).length; }, 0); }
function ringkas() {
  let s = 0, t = 0;
  BAB.forEach(b => { const st = statusBab(b); s += st.selesai; t += st.total; });
  const skor = BAB.map(b => P.quiz_score[b.id]).filter(v => v != null).map(Number);
  return {
    persen: t ? Math.round(s / t * 100) : 0,
    kuisSelesai: BAB.filter(b => benar(P.quiz_done[b.id])).length,
    rata: skor.length ? Math.round(skor.reduce((a, c) => a + c, 0) / skor.length) : null,
    hafal: jumlahHafal(), streak: hitungStreak()
  };
}

const hitungBab = k => BAB.filter(b => benar(P[k][b.id])).length;

function cekLencana(beriTahu) {

  if (beriTahu) baru.forEach((id, i) => { const l = LENCANA.find(x => x.id === id); setTimeout(() => toast(`Lencana baru: ${l.nama}`, 'badge', 5200), 350 + i * 500); });

/* =========================================================
   ROUTER (hash sederhana: #beranda, #ch03, #ch03-kuis, ...)
   ========================================================= */
const TAB = [
  { k: 'materi', label: 'Materi', icon: 'book-open' },
  { k: 'flashcard', label: 'Flashcard', icon: 'layers' },
  { k: 'kuis', label: 'Kuis', icon: 'pen' },
  { k: 'latihan', label: 'Cocokkan & Isian', icon: 'link' },
  { k: 'kasus', label: 'Studi Kasus', icon: 'bulb' }
];

let anchorTunda = null;
function bacaHash() {
  let h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = location.hash.slice(1); }
  if (!h || h === 'beranda') return { view: 'beranda' };
  if (['glosarium', 'ujian', 'tentang'].includes(h)) return { view: h };
  const m = h.match(/^(.+?)(?:-(materi|flashcard|kuis|latihan|kasus))?$/);
  if (m && BAB_ID[m[1]]) {
    const b = BAB_ID[m[1]];
    const tab = m[2] || 'materi';
    return { view: 'bab', bab: b.id, tab: tabTersedia(b).some(t => t.k === tab) ? tab : 'materi' };
  }
  return { view: 'beranda' };
}
function tabTersedia(b) {
  return TAB.filter(t => t.k === 'materi' || (t.k === 'flashcard' && b.istilah.length) || (t.k === 'kuis' && b.quiz.length)
    || (t.k === 'latihan' && (b.istilah.length >= 2 || b.isian.length)) || (t.k === 'kasus' && b.kasus.length));
}
function pergi(hash) {
  if (location.hash === '#' + hash) render(); else location.hash = hash;
}
function render(opts = {}) {
  const yLama = window.scrollY;
  if (ujTimer && !(opts.jaga && rute.view === 'ujian')) { clearInterval(ujTimer); ujTimer = null; }
  rute = bacaHash();
  const v = $('#view');
  let html;
  if (rute.view === 'bab') {
    const b = BAB_ID[rute.bab];
    if (P.bab_terakhir !== b.id) { P.bab_terakhir = b.id; simpan(false); }
    html = viewBab(b, rute.tab);
  } else if (rute.view === 'glosarium') html = viewGlosarium();
  else if (rute.view === 'ujian') html = viewUjian();
  else if (rute.view === 'tentang') html = viewTentang();
  else html = viewBeranda();
  v.innerHTML = html;
  tandaiNav();
  setelahRender();
  document.body.classList.remove('menu-terbuka');
  if (anchorTunda) {
    const el = document.getElementById(anchorTunda); anchorTunda = null;
    if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 1800); }
  } else if (opts.jaga) window.scrollTo(0, yLama);
  else window.scrollTo(0, 0);
}

  const aktif = rute.view === 'bab' ? rute.bab : rute.view;
  $$('#sidebar [data-nav]').forEach(a => { if (a.dataset.nav === aktif) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });

/* =========================================================
   HALAMAN BAB

function segmenHtml(b) {

}
function viewBab(b, tab) {

  <header class="bab-head">

    ${ber ? `<a class="berikut" href="#${ber.id}"><small>Bab berikutnya ${ic('arrow-right')}</small><b>${ber.nomor}. ${esc(ber.judul)}</b></a>` : ''}

function panelBab(b, tab) {

  if (tab === 'kuis') return panelKuis(b);

function segarkanPanel() {

    const k = (a.getAttribute('href').split('-').pop());

    const ada = a.querySelector('.tab-ok');
    if (ok && !ada) a.insertAdjacentHTML('beforeend', ic('check-circle', 'tab-ok'));

  setelahRender();
}

/* ---------- Materi ---------- */

      ${bagian.map(x => `<button type="button" class="toc-link" data-act="ke-anchor" data-target="${x.id}"><span>${x.no || ic('chevron')}</span><span>${esc(x.judul)}</span></button>`).join('')}
      <div class="teks-ukur"><span>Ukuran teks</span><button type="button" data-act="teks" data-d="-1" aria-label="Perkecil teks">A−</button><button type="button" data-act="teks" data-d="1" aria-label="Perbesar teks">A+</button></div>

        <h2><span class="sub-no">${b.nomor}.${i + 1}</span><span>${esc(s.judul)}</span></h2>
        ${s.teks.map(t => `<p class="paragraf">${esc(t)}</p>`).join('')}
        ${s.poin.length ? `<ul class="poin">${s.poin.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
        ${s.contoh.map(c => `<div class="contoh"><strong>Contoh.</strong> ${esc(c)}</div>`).join('')}
      </section>`).join('')}
      ${b.tokoh.length ? `<section class="tokoh-blok" id="tokoh"><h2>${ic('users')} Tokoh & riset kunci</h2><div class="tokoh-grid">${b.tokoh.map(t => `<div class="tokoh"><div class="tokoh-nama">${esc(t.nama)}</div><div class="tokoh-kontribusi">${esc(t.kontribusi)}</div></div>`).join('')}</div></section>` : ''}
      ${b.ringkasan.length ? `<section class="ringkasan-blok" id="ringkasan"><h2>${ic('star')} Ringkasan kunci</h2><ol>${b.ringkasan.map(r => `<li>${esc(r)}</li>`).join('')}</ol></section>` : ''}
      <div class="materi-footer">
        <p>${sudah ? 'Materi bab ini sudah kamu tandai selesai dibaca.' : 'Sudah selesai membaca? Tandai, lalu uji pemahamanmu lewat flashcard dan kuis.'}</p>
        <div class="row">
          ${sudah ? `<span class="chip chip-hafal">${ic('check')} Sudah dibaca</span>` : `<button class="btn" type="button" data-act="tandai-baca">${ic('check')} Tandai sudah dibaca</button>`}
          ${berikut ? `<a class="btn btn-garis" href="#${b.id}-${berikut.k}">${berikut.label} ${ic('arrow-right')}</a>` : ''}
        </div>
      </div>
    </article>
  </div>`;
}

/* ---------- Flashcard ---------- */
function fcS(b) {
  let s = fcState[b.id];
  if (!s) s = fcState[b.id] = { order: range(b.istilah.length), pos: 0, flip: false, filter: 'semua' };
  return s;
}
function fcList(b) {
  const s = fcS(b), h = hafalSet(b.id);
  return s.filter === 'belum' ? s.order.filter(i => !h.has(b.istilah[i].term)) : s.order;
}
function panelFlashcard(b) {
  const s = fcS(b), list = fcList(b), h = hafalSet(b.id), n = b.istilah.length;
  const nHafal = b.istilah.filter(t => h.has(t.term)).length;
  const dilihat = new Set(arr(P.fc_dilihat[b.id]).map(Number)).size;
  if (s.pos >= list.length) s.pos = Math.max(0, list.length - 1);
  const toolbar = `<div class="fc-toolbar">
      <div class="seg-ctrl" role="group" aria-label="Kartu yang ditampilkan">
        <button type="button" data-act="fc-filter" data-v="semua" aria-pressed="${s.filter === 'semua'}">Semua (${n})</button>
        <button type="button" data-act="fc-filter" data-v="belum" aria-pressed="${s.filter === 'belum'}">Belum hafal (${n - nHafal})</button>
      </div>
      <div class="row">
        <label class="switch"><input type="checkbox" data-ubah="fc-def" ${pref.fcDefDulu ? 'checked' : ''}> Definisi dulu</label>
        <button class="btn btn-garis btn-kecil" type="button" data-act="fc-acak">${ic('shuffle')} Acak</button>
      </div>
    </div>`;
  if (!list.length) {
    return `<div class="fc-wrap">${toolbar}<div class="card kosong">${ic('check-circle')}<h3>Semua istilah bab ini sudah kamu tandai hafal.</h3><p class="muted">Ulangi sesekali supaya tetap melekat, atau lanjut ke kuis.</p>
      <div class="row" style="justify-content:center"><button class="btn btn-garis" type="button" data-act="fc-filter" data-v="semua">Tampilkan semua kartu</button><a class="btn" href="#${b.id}-kuis">Kerjakan kuis ${ic('arrow-right')}</a></div></div></div>`;
  }
  const i = list[s.pos], t = b.istilah[i], sudahHafal = h.has(t.term);
  const depan = pref.fcDefDulu ? { tag: 'Definisi', isi: `<span class="fc-definisi">${esc(t.definisi)}</span>` } : { tag: 'Istilah', isi: `<span class="fc-istilah">${esc(t.term)}</span>` };
  const belakang = pref.fcDefDulu ? { tag: 'Istilah', isi: `<span class="fc-istilah">${esc(t.term)}</span>` } : { tag: 'Definisi', isi: `<span class="fc-definisi">${esc(t.definisi)}</span>` };
  const tanda = sudahHafal ? `<span class="fc-hafal-tanda">${ic('check')} Hafal</span>` : '';
  return `<div class="fc-wrap">
    ${toolbar}
    <div class="fc-stage">
      <button type="button" class="fc-card${s.flip ? ' is-flipped' : ''}" id="fc-card" data-act="fc-flip" aria-label="Kartu ${s.pos + 1} dari ${list.length}. Tekan untuk membalik.">
        <span class="fc-inner">
          <span class="fc-face fc-front" aria-hidden="${s.flip}">${tanda}<span class="fc-tag">${depan.tag}</span>${depan.isi}</span>
          <span class="fc-face fc-back" aria-hidden="${!s.flip}">${tanda}<span class="fc-tag">${belakang.tag}</span>${belakang.isi}</span>
        </span>
      </button>
    </div>
    <div class="fc-nav">
      <button class="icon-btn" type="button" data-act="fc-geser" data-d="-1" aria-label="Kartu sebelumnya">${ic('arrow-left')}</button>
      <span class="fc-hitung" aria-live="polite">${s.pos + 1} / ${list.length}</span>
      <button class="icon-btn" type="button" data-act="fc-geser" data-d="1" aria-label="Kartu berikutnya">${ic('arrow-right')}</button>
    </div>
    <div class="fc-nilai">
      <button class="btn btn-belum" type="button" data-act="fc-nilai" data-v="0">${ic('rotate')} Masih belajar</button>
      <button class="btn btn-hafal" type="button" data-act="fc-nilai" data-v="1">${ic('check')} ${sudahHafal ? 'Tetap hafal, lanjut' : 'Sudah hafal'}</button>
    </div>
    <div class="fc-meta">
      <div><span>Kartu dilihat: ${dilihat} dari ${n}</span><div class="bar"><i style="width:${n ? dilihat / n * 100 : 0}%"></i></div></div>
      <div><span>Ditandai hafal: ${nHafal} dari ${n}</span><div class="bar hijau"><i style="width:${n ? nHafal / n * 100 : 0}%"></i></div></div>
    </div>
    <p class="petunjuk">${ic('info')} Spasi untuk membalik, tombol panah untuk berpindah, angka 1 atau 2 untuk menilai. Di ponsel, geser kartu ke kiri atau kanan.</p>
  </div>`;
}
function fcCatatDilihat(b) {
  if (!b || !b.istilah.length) return;
  const list = fcList(b); if (!list.length) return;
  const i = list[fcS(b).pos];
  const set = new Set(arr(P.fc_dilihat[b.id]).map(Number));
  if (set.has(i)) return;
  set.add(i);
  P.fc_dilihat[b.id] = Array.from(set);
  if (set.size >= b.istilah.length && !benar(P.flashcard_done[b.id])) {
    P.flashcard_done[b.id] = true;
    toast(`Semua ${b.istilah.length} kartu Bab ${b.nomor} sudah kamu lihat.`, 'ok');
    simpan();
    const seg = $('#bab-seg'); if (seg) seg.outerHTML = segmenHtml(b);
    const meta = $('.fc-meta'); if (meta) { const tmp = document.createElement('div'); tmp.innerHTML = panelFlashcard(b); meta.replaceWith(tmp.querySelector('.fc-meta')); }
  } else {
    simpan();
    const meta = $('.fc-meta span'); if (meta) meta.textContent = `Kartu dilihat: ${set.size} dari ${b.istilah.length}`;
    const bar = $('.fc-meta .bar > i'); if (bar) bar.style.width = (set.size / b.istilah.length * 100) + '%';
  }
}
function fcFlip() {
  const b = BAB_ID[rute.bab], s = fcS(b); s.flip = !s.flip;
  const el = $('#fc-card'); if (!el) return;
  el.classList.toggle('is-flipped', s.flip);
  const f = el.querySelector('.fc-front'), k = el.querySelector('.fc-back');
  if (f) f.setAttribute('aria-hidden', String(s.flip)); if (k) k.setAttribute('aria-hidden', String(!s.flip));
}
function fcGeser(d) {
  const b = BAB_ID[rute.bab], s = fcS(b), list = fcList(b); if (!list.length) return;
  s.pos = (s.pos + d + list.length) % list.length; s.flip = false;
  segarkanPanel(); const c = $('#fc-card'); if (c && document.activeElement && document.activeElement.closest('.fc-wrap')) c.focus();
}
function fcNilai(v) {
  const b = BAB_ID[rute.bab], s = fcS(b), list = fcList(b); if (!list.length) return;
  const t = b.istilah[list[s.pos]];
  const h = hafalSet(b.id);
  if (v) h.add(t.term); else h.delete(t.term);
  P.hafal[b.id] = Array.from(h);
  simpan();
  s.flip = false;
  const listBaru = fcList(b);
  if (!(s.filter === 'belum' && v)) s.pos = listBaru.length ? (s.pos + 1) % listBaru.length : 0;
  segarkanPanel();
}
let geserX = null;
function pasangGeser() {
  const c = $('#fc-card'); if (!c) return;
  c.addEventListener('touchstart', e => { geserX = e.touches[0].clientX; }, { passive: true });
  c.addEventListener('touchend', e => {
    if (geserX == null) return;
    const dx = e.changedTouches[0].clientX - geserX; geserX = null;
    if (Math.abs(dx) > 55) { e.preventDefault(); fcGeser(dx < 0 ? 1 : -1); }
  });
}

/* ---------- Kuis ---------- */
function kuisS(b, reset) {
  let s = kuisState[b.id];
  if (!s || reset) {
    const n = b.quiz.length, acakAktif = pref.acakKuis;
    const order = acakAktif ? acak(range(n)) : range(n);
    const opt = {};
    order.forEach(qi => { const m = b.quiz[qi].pilihan.length; opt[qi] = acakAktif ? acak(range(m)) : range(m); });
    s = kuisState[b.id] = { order, opt, jawab: {}, kunci: {}, hasil: null, latihan: null };
  }
  return s;
}
const kunciBenar = q => Math.min(Math.max(q.jawaban - 1, 0), q.pilihan.length - 1);
function soalHtml(b, s, qi, k) {
  const q = b.quiz[qi];
  const terbuka = !!s.hasil || (pref.modeKuis === 'langsung' && s.kunci[qi]);
  const jaw = s.jawab[qi], kb = kunciBenar(q);
  const status = terbuka ? (jaw === kb ? '<span class="status-ok">Benar</span>' : '<span class="status-no">Kurang tepat</span>') : '';
  return `<li class="soal" id="soal-${qi}">
    <div class="soal-no"><span>Soal ${k + 1}</span>${status}</div>
    <p class="soal-teks" id="st-${b.id}-${qi}">${esc(q.soal)}</p>
    <div class="opsi" role="radiogroup" aria-labelledby="st-${b.id}-${qi}">
      ${s.opt[qi].map((oi, j) => {
        let cls = '';
        if (terbuka) cls = oi === kb ? ' benar' : (oi === jaw ? ' salah' : '');
        return `<label class="opsi-item${terbuka ? ' terkunci' : ''}${cls}"><input type="radio" name="q-${b.id}-${qi}" value="${oi}" data-ubah="kuis-jawab" data-q="${qi}"${jaw === oi ? ' checked' : ''}${terbuka ? ' disabled' : ''}><span class="opsi-huruf">${huruf(j)}</span><span class="opsi-teks">${esc(q.pilihan[oi])}</span></label>`;
      }).join('')}
    </div>
    ${terbuka ? `<div class="umpan ${jaw === kb ? 'ok' : 'no'}"><p><strong>${jaw === kb ? 'Benar.' : 'Kurang tepat.'}</strong> Jawaban yang tepat: ${huruf(s.opt[qi].indexOf(kb))}. ${esc(q.pilihan[kb])}</p>${q.penjelasan ? `<p class="penjelasan">${esc(q.penjelasan)}</p>` : ''}</div>` : ''}
  </li>`;
}
function panelKuis(b) {
  const s = kuisS(b), list = s.latihan || s.order;
  const terbaik = P.quiz_score[b.id], perc = Number(P.quiz_percobaan[b.id]) || 0;
  const terjawab = list.filter(qi => s.jawab[qi] != null).length;
  return `
  <div class="kuis-bar">
    <div class="row">
      <div class="seg-ctrl" role="group" aria-label="Cara pemeriksaan">
        <button type="button" data-act="mode-kuis" data-v="akhir" aria-pressed="${pref.modeKuis === 'akhir'}">Periksa di akhir</button>
        <button type="button" data-act="mode-kuis" data-v="langsung" aria-pressed="${pref.modeKuis === 'langsung'}">Umpan balik langsung</button>
      </div>
      <label class="switch"><input type="checkbox" data-ubah="acak-kuis" ${pref.acakKuis ? 'checked' : ''}> Acak soal & pilihan</label>
    </div>
    <div class="kuis-info">${terbaik != null ? `Skor terbaik <b>${terbaik}%</b> · ${perc} percobaan` : `${b.quiz.length} soal · belum pernah dikerjakan`}</div>
  </div>
  ${s.latihan ? `<div class="pita pita-warn" style="margin-bottom:14px;align-items:center;flex-wrap:wrap">${ic('rotate')}<span style="flex:1;min-width:200px">Mode latihan: hanya ${list.length} soal yang tadi salah. Hasilnya tidak mengubah skor terbaikmu.</span><button class="btn btn-garis btn-kecil" type="button" data-act="kuis-ulang">Kembali ke kuis penuh</button></div>` : ''}
  ${s.hasil ? hasilKuisHtml(b, s) : ''}

  ${!s.hasil ? `<div class="kuis-aksi">
      <span class="kuis-info" id="kuis-hitung"><b>${terjawab}</b> dari ${list.length} terjawab</span>
      <div class="bar"><i id="kuis-bar" style="width:${terjawab / list.length * 100}%"></i></div>
      ${pref.modeKuis === 'akhir' ? `<button class="btn" type="button" data-act="kuis-periksa">${ic('check')} Periksa jawaban</button>` : '<span class="kuis-info">Jawaban langsung diperiksa</span>'}
    </div>` : ''}`;
}
function hasilKuisHtml(b, s) {
  const h = s.hasil;
  const riw = arr(P.quiz_riwayat[b.id]).map(Number);
  if (h.latihan) {
    return `<div class="hasil ${h.skor >= 70 ? 'lulus' : 'ulang'}" id="kuis-hasil" tabindex="-1">

      ${h.salah.length ? `<button class="btn btn-garis" type="button" data-act="kuis-latih">Latih lagi ${h.salah.length} soal yang salah</button>` : ''}</div></div></div>`;
  }
  return `<div class="hasil ${h.skor >= 70 ? 'lulus' : 'ulang'}" id="kuis-hasil" tabindex="-1">
    <div class="hasil-skor">${h.skor}<small>%</small></div>
    <div>
      <h3>${h.nb} dari ${h.n} jawaban benar</h3>

function sorot(teks, q) {
  const t = str(teks), kata = normTeks(q).split(' ').filter(Boolean)[0];
  if (!kata) return esc(t);
  const idx = t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').indexOf(kata);
  if (idx < 0) return esc(t);
  return esc(t.slice(0, idx)) + '<mark>' + esc(t.slice(idx, idx + kata.length)) + '</mark>' + esc(t.slice(idx + kata.length));
}
function daftarGlosarium() {

  const hasil = semua.filter(x => { const n = normTeks(x.t.term + ' ' + x.t.definisi); return kata.every(k => n.includes(k)); })
    .sort((a, c) => a.t.term.localeCompare(c.t.term, 'id'));

}

function mulaiTimer() {
  if (ujTimer) clearInterval(ujTimer);
  const tick = () => {
    const el = $('#uj-timer span'); if (!el || uj.fase !== 'jalan') { clearInterval(ujTimer); ujTimer = null; return; }
    if (uj.batas) {
      const sisa = (uj.batas - Date.now()) / 1000;
      el.textContent = fmtWaktu(sisa);
      $('#uj-timer').classList.toggle('mepet', sisa <= 60);
      if (sisa <= 0) { clearInterval(ujTimer); ujTimer = null; toast('Waktu habis. Jawabanmu diperiksa otomatis.', 'warn'); ujSelesai(); }
    } else el.textContent = fmtWaktu((Date.now() - uj.mulai) / 1000);
  };
  tick();
  if (uj.fase === 'jalan') ujTimer = setInterval(tick, 1000);
}
function ujSelesai() {
  const per = {}; let nb = 0;
  uj.soal.forEach((s, k) => {
    const q = BAB_ID[s.bab].quiz[s.qi], ok = uj.jawab[k] === kunciBenar(q);
    if (ok) nb++;
    per[s.bab] = per[s.bab] || { n: 0, b: 0 }; per[s.bab].n++; if (ok) per[s.bab].b++;
  });
  const n = uj.soal.length, skor = Math.round(nb / n * 100);
  const durasi = Math.round((Math.min(Date.now(), uj.batas || Infinity) - uj.mulai) / 1000);
  uj.hasil = { skor, nb, n, durasi, per };
  P.ujian = (P.ujian || []).concat({ t: new Date().toISOString(), n, skor, durasi, bab: Object.keys(per) }).slice(-20);
  uj.fase = 'hasil';
  if (ujTimer) { clearInterval(ujTimer); ujTimer = null; }
  simpan();
  if (rute.view === 'ujian') render();
}

let INDEKS = null;
function bangunIndeks() {
  INDEKS = [];
  BAB.forEach(b => {
    INDEKS.push({ jenis: 'Bab', b, teks: b.judul, ke: { hash: b.id } });
    b.materi.forEach((s, si) => {
      INDEKS.push({ jenis: 'Sub-topik', b, teks: s.judul, ke: { hash: b.id, anchor: 'sub-' + si } });
      s.poin.concat(s.teks, s.contoh).forEach(p => INDEKS.push({ jenis: 'Materi', b, teks: p, ke: { hash: b.id, anchor: 'sub-' + si } }));
    });
    b.istilah.forEach((t, ti) => INDEKS.push({ jenis: 'Istilah', b, teks: t.term, sub: t.definisi, ke: { hash: b.id + '-flashcard', kartu: ti } }));
    b.tokoh.forEach(t => INDEKS.push({ jenis: 'Tokoh', b, teks: t.nama, sub: t.kontribusi, ke: { hash: b.id, anchor: 'tokoh' } }));
  });
  INDEKS.forEach(x => { x.n = normTeks(x.teks + ' ' + (x.sub || '')); x.nj = normTeks(x.teks); });
}
let hasilCari = [];
function cari(q) {
  if (!INDEKS) bangunIndeks();
  const kata = normTeks(q).split(' ').filter(Boolean);
  if (!kata.length) return [];
  const frasa = kata.join(' ');
  const bobot = { 'Istilah': 4, 'Tokoh': 3, 'Bab': 3, 'Sub-topik': 2, 'Materi': 0 };
  return INDEKS.filter(x => kata.every(k => x.n.includes(k)))
    .map(x => ({ x, s: (bobot[x.jenis] || 0) + (x.nj.startsWith(frasa) ? 5 : 0) + (x.nj.includes(frasa) ? 2 : 0) }))
    .sort((a, c) => c.s - a.s).slice(0, 24).map(o => o.x);
}
function cuplikan(teks, q) {
  const t = str(teks), kata = normTeks(q).split(' ').filter(Boolean)[0] || '';
  const plain = t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const idx = kata ? plain.indexOf(kata) : -1;
  if (t.length <= 140 || idx < 0) return sorot(t.length > 140 ? t.slice(0, 140) + '…' : t, q);
  const a = Math.max(0, idx - 50), z = Math.min(t.length, idx + 90);
  return (a > 0 ? '…' : '') + sorot(t.slice(a, z), q) + (z < t.length ? '…' : '');
}
function renderCari() {
  const inp = $('#cari-input'), panel = $('#cari-panel'), q = inp.value;
  if (!normTeks(q)) { panel.hidden = true; panel.innerHTML = ''; return; }
  hasilCari = cari(q);
  panel.hidden = false;
  panel.innerHTML = hasilCari.length ? hasilCari.map((x, i) => `<button type="button" class="cari-item" data-act="cari-ke" data-i="${i}">
      <span class="cari-meta"><span class="cari-jenis">${x.jenis}</span><span>Bab ${x.b.nomor} · ${esc(x.b.judul)}</span></span>
      <span class="cari-teks">${x.jenis === 'Materi' ? cuplikan(x.teks, q) : `<strong>${sorot(x.teks, q)}</strong>${x.sub ? ' · ' + cuplikan(x.sub, q) : ''}`}</span></button>`).join('')
    : `<div class="cari-kosong">Tidak ditemukan hasil untuk “${esc(q)}”.</div>`;
}
function tutupCari() { const p = $('#cari-panel'); if (p) p.hidden = true; }
function bukaHasil(x) {
  tutupCari();
  $('#cari-input').blur();
  if (x.ke.kartu != null) keKartu(x.b, x.ke.kartu);
  else { if (x.ke.anchor) anchorTunda = x.ke.anchor; pergi(x.ke.hash); }
}
function keKartu(b, i) {
  const s = fcS(b); s.filter = 'semua'; s.pos = Math.max(0, s.order.indexOf(i)); s.flip = false;
  pergi(b.id + '-flashcard');
}

/* =========================================================
   TEMA & UKURAN TEKS
   ========================================================= */
function temaAktif() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'dark' || t === 'light') return t;
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function terapkanTema() {
  if (pref.tema === 'dark' || pref.tema === 'light') document.documentElement.setAttribute('data-theme', pref.tema);
  const btn = $('#tombol-tema');
  if (btn) { const gelap = temaAktif() === 'dark'; btn.innerHTML = ic(gelap ? 'sun' : 'moon'); btn.setAttribute('aria-label', gelap ? 'Pakai tema terang' : 'Pakai tema gelap'); }
}
function terapkanTeks() {
  pref.teks = Math.max(-1, Math.min(3, Number(pref.teks) || 0));
  document.documentElement.style.setProperty('--read-size', (1.0625 + pref.teks * 0.0625) + 'rem');
}

/* =========================================================
   SALIN KE CLIPBOARD
   ========================================================= */
function salinTeks(id) {
  const el = document.getElementById(id); if (!el) return;
  const teks = el.value || el.textContent;
  const cadangan = () => {
    try { el.focus(); el.select(); const ok = document.execCommand('copy'); toast(ok ? 'Disalin ke clipboard.' : 'Teks sudah dipilih. Tekan Ctrl+C atau Cmd+C untuk menyalin.', ok ? 'ok' : 'info'); }
    catch (e) { toast('Teks sudah dipilih. Tekan Ctrl+C atau Cmd+C untuk menyalin.'); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(teks).then(() => toast('Disalin ke clipboard.', 'ok'), cadangan);
    else cadangan();
  } catch (e) { cadangan(); }
}

const AKSI = {

  'fc-flip': () => fcFlip(),
  'fc-geser': el => fcGeser(Number(el.dataset.d)),
  'fc-nilai': el => fcNilai(el.dataset.v === '1'),
  'fc-filter': el => { const s = fcS(babAktif()); s.filter = el.dataset.v; s.pos = 0; s.flip = false; segarkanPanel(); },
  'fc-acak': () => { const b = babAktif(), s = fcS(b); s.order = acak(s.order); s.pos = 0; s.flip = false; segarkanPanel(); toast('Urutan kartu diacak.'); },
  'mode-kuis': el => {

    const b = babAktif(), s = kuisS(b);

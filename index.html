<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="E-book interaktif Psikologi Umum dalam Bahasa Indonesia: materi, flashcard, kuis, latihan, dan studi kasus untuk 16 bab.">
<title>Psikologi Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar navy tetap di kiri + kolom baca lebar sedang; angka bab italic serif jadi ciri visual */
:root {
  --bg: #f1f4f9;
  --surface: #ffffff;
  --sunken: #e7edf6;
  --ink: #0e1b30;
  --muted: #55627a;
  --line: #d6deea;
  --brand: #073763;
  --brand-ink: #ffffff;
  --brand-soft: #dde8f5;
  --link: #0b4f8f;
  --accent: #c46f12;
  --accent-soft: #fbeedd;
  --good: #16764d;
  --good-soft: #dff3e9;
  --bad: #ad3528;
  --bad-soft: #fbe5e1;
  --warn: #8f5a00;
  --warn-soft: #fdf1d8;
  --side-bg: #073763;
  --side-ink: #e8eff8;
  --side-muted: #a3b9d5;
  --side-hover: rgba(255, 255, 255, .07);
  --side-active: rgba(255, 255, 255, .14);
  --ring: #f0a24a;
  --ring-bg: rgba(255, 255, 255, .18);
  --shadow: 0 1px 2px rgba(7, 27, 52, .05), 0 6px 20px rgba(7, 27, 52, .06);
  --radius: 14px;
  --font-ui: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --read-size: 1.0625rem;
  --p0: #2563a8; --p1: #b4570f; --p2: #1f7a55; --p3: #8a3fa0; --p4: #a5312f;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1220; --surface: #111c2f; --sunken: #0d1727; --ink: #e3eaf5; --muted: #9ba9c0; --line: #233350;
    --brand: #3b78bf; --brand-ink: #ffffff; --brand-soft: #172a49; --link: #8fbdf0;
    --accent: #f0a24a; --accent-soft: #3a2711;
    --good: #52c391; --good-soft: #0f2e20; --bad: #f2806f; --bad-soft: #3a1815; --warn: #e8b55a; --warn-soft: #33260c;
    --side-bg: #08101d; --side-ink: #dfe7f3; --side-muted: #8396b2; --side-hover: rgba(255,255,255,.05); --side-active: rgba(255,255,255,.1);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --p0: #7fb2ec; --p1: #f0a861; --p2: #63cf9d; --p3: #d39ae3; --p4: #f4918a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1220; --surface: #111c2f; --sunken: #0d1727; --ink: #e3eaf5; --muted: #9ba9c0; --line: #233350;
  --brand: #3b78bf; --brand-ink: #ffffff; --brand-soft: #172a49; --link: #8fbdf0;
  --accent: #f0a24a; --accent-soft: #3a2711;
  --good: #52c391; --good-soft: #0f2e20; --bad: #f2806f; --bad-soft: #3a1815; --warn: #e8b55a; --warn-soft: #33260c;
  --side-bg: #08101d; --side-ink: #dfe7f3; --side-muted: #8396b2; --side-hover: rgba(255,255,255,.05); --side-active: rgba(255,255,255,.1);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --p0: #7fb2ec; --p1: #f0a861; --p2: #63cf9d; --p3: #d39ae3; --p4: #f4918a;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 84px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 1rem; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body.modal-terbuka { overflow: hidden; }
a { color: var(--link); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
.ic { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- kerangka ---------- */
.app { display: grid; grid-template-columns: 296px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--side-bg); color: var(--side-ink);
  display: flex; flex-direction: column; gap: 18px; padding: 20px 16px 22px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent;
}
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 12px clamp(16px, 3vw, 36px);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
#view { padding: clamp(20px, 3.2vw, 40px) clamp(16px, 3vw, 36px) 72px; width: 100%; max-width: 1180px; outline: none; }
.scrim { display: none; }
.only-mobile { display: none !important; }

/* ---------- sidebar ---------- */
.brand { display: flex; align-items: center; gap: 12px; padding: 2px 6px; }
.brand-ic { width: 34px; height: 34px; padding: 6px; border-radius: 10px; background: rgba(255,255,255,.1); color: var(--ring); }
.brand-nama { font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; }
.brand-sub { font-size: .78rem; color: var(--side-muted); }
.side-close { margin-left: auto; color: var(--side-ink) !important; }
.profil-chip {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; cursor: pointer;
  padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: var(--side-ink);
}
.profil-chip:hover { background: var(--side-hover); }
.avatar {
  flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  background: var(--ring); color: #2a1600; font-weight: 800;
}
.profil-teks { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.profil-nama { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profil-status { font-size: .76rem; color: var(--side-muted); }
.profil-status.gagal { color: #ffb4a8; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px;
  color: var(--side-ink); text-decoration: none; font-size: .92rem; font-weight: 500;
}
.side-nav a:hover { background: var(--side-hover); }
.side-nav a[aria-current="page"] { background: var(--side-active); font-weight: 700; }
.side-label { margin: 14px 10px 4px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted); }
.side-bab { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.sb-no { font-family: var(--font-read); font-style: italic; font-size: .95rem; color: var(--side-muted); width: 1.6em; flex: none; font-variant-numeric: lining-nums tabular-nums; }
.side-nav a[aria-current="page"] .sb-no { color: var(--ring); }
.sb-judul { flex: 1; min-width: 0; line-height: 1.3; }
.sb-ring {
  flex: none; width: 16px; height: 16px; border-radius: 50%;
  background: conic-gradient(var(--ring) calc(var(--p) * 1%), var(--ring-bg) 0);
  -webkit-mask: radial-gradient(circle, transparent 4.2px, #000 4.7px); mask: radial-gradient(circle, transparent 4.2px, #000 4.7px);
}
.side-kredit { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.12); font-size: .76rem; line-height: 1.5; color: var(--side-muted); }
.side-kredit a { color: var(--side-ink); }

/* ---------- topbar ---------- */
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer;
}
.icon-btn:hover { background: var(--sunken); }
.cari { position: relative; flex: 1; max-width: 560px; }
.cari > .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.cari input {
  width: 100%; height: 42px; padding: 0 44px 0 38px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.cari input::placeholder { color: var(--muted); }
.cari kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font: 600 .72rem var(--font-ui); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: var(--bg);
}
.cari-panel {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); max-height: min(70vh, 520px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
}
.cari-item {
  display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; border: 0; background: none; cursor: pointer;
}
.cari-item:hover, .cari-item:focus-visible { background: var(--sunken); outline: none; }
.cari-meta { display: flex; gap: 8px; align-items: center; font-size: .74rem; color: var(--muted); margin-bottom: 2px; }
.cari-jenis { font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .05em; }
:root[data-theme="dark"] .cari-jenis { color: var(--link); }
.cari-teks { font-size: .92rem; line-height: 1.4; }
.cari-teks mark, .glos-def mark, .glos-term mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.cari-kosong { padding: 14px; color: var(--muted); font-size: .9rem; }
.topbar-kanan { margin-left: auto; display: flex; gap: 6px; align-items: center; }

/* ---------- elemen umum ---------- */
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 2.4vw, 26px); }
.stack { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.muted { color: var(--muted); }
.kecil { font-size: .875rem; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px;
  padding: 9px 18px; border-radius: 11px; border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink);
  font-weight: 700; font-size: .93rem; cursor: pointer; text-decoration: none; transition: filter .15s, transform .15s;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn-garis { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-garis:hover { background: var(--sunken); filter: none; }
.btn-lembut { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
:root[data-theme="dark"] .btn-lembut { color: var(--link); }
.btn-bahaya { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn-bahaya:hover { background: var(--bad-soft); filter: none; }
.btn-bahaya-isi { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-kecil { min-height: 34px; padding: 6px 12px; font-size: .85rem; border-radius: 9px; }
.seg-ctrl { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--sunken); gap: 2px; flex-wrap: wrap; }
.seg-ctrl button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: .85rem; font-weight: 600; color: var(--muted); cursor: pointer;
}
.seg-ctrl button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; cursor: pointer; color: var(--muted); }
.switch input { appearance: none; width: 36px; height: 21px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--brand); }
.switch input:checked::after { transform: translateX(15px); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--sunken); font-size: .8rem; font-weight: 600; color: var(--muted); text-decoration: none; }
a.chip:hover { background: var(--brand-soft); color: var(--brand); }
.pita { padding: 12px 14px; border-radius: 12px; font-size: .9rem; display: flex; gap: 10px; align-items: flex-start; }
.pita .ic { margin-top: 2px; }
.pita-info { background: var(--brand-soft); color: var(--ink); }
.pita-warn { background: var(--warn-soft); color: var(--ink); }
.sec-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.sec-head h2 { font-size: 1.3rem; letter-spacing: -.01em; }
.sec-head p { color: var(--muted); font-size: .93rem; }
.page-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; max-width: 70ch; }
.page-head h1 { font-size: clamp(1.8rem, 3.4vw, 2.5rem); letter-spacing: -.025em; font-weight: 800; }
.page-head p { color: var(--muted); }
.bar { height: 8px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .5s ease; }

/* ---------- beranda ---------- */
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center;
  padding: clamp(22px, 3.4vw, 40px); border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
  position: relative; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(color-mix(in srgb, var(--brand) 18%, transparent) 1px, transparent 1.2px);
  background-size: 18px 18px; -webkit-mask: linear-gradient(100deg, transparent 40%, #000 95%); mask: linear-gradient(100deg, transparent 40%, #000 95%);
}
.hero > * { position: relative; }
.hero h1 { font-size: clamp(2rem, 4.6vw, 3.1rem); font-weight: 800; letter-spacing: -.035em; margin: 10px 0 12px; }
.hero h1 em { font-family: var(--font-read); font-weight: 400; font-style: italic; letter-spacing: -.02em; color: var(--brand); }
:root[data-theme="dark"] .hero h1 em { color: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero h1 em { color: var(--link); } }
.hero .lead { color: var(--muted); max-width: 58ch; font-size: 1.02rem; }
.hero-aksi { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cincin { position: relative; width: 168px; height: 168px; }
.cincin svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.cincin circle { fill: none; stroke-width: 12; }
.cincin .jalur { stroke: var(--sunken); }
.cincin .isi { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.cincin-teks { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.cincin-angka { font-family: var(--font-read); font-size: 2.6rem; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.cincin-angka small { font-size: 1.1rem; }
.cincin-label { font-size: .75rem; color: var(--muted); font-weight: 600; margin-top: 4px; }
.form-nama { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; max-width: 520px; }
.form-nama label { font-weight: 700; font-size: .92rem; }
.form-nama .row input { flex: 1; min-width: 180px; height: 44px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); }
.profil-ada { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .86rem; color: var(--muted); }
.statistik { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.stat-label { font-size: .8rem; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.stat-angka { font-family: var(--font-read); font-size: 1.9rem; line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; }
.stat-angka small { font-size: 1rem; color: var(--muted); }
.blok { margin-top: 38px; }
.blok-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.blok-head h2 { font-size: 1.35rem; letter-spacing: -.015em; }
.blok-head p { color: var(--muted); font-size: .9rem; }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 18px; height: 6px; border-radius: 3px; background: var(--sunken); display: inline-block; }
.legenda i.ok { background: var(--good); }
.legenda i.half { background: linear-gradient(90deg, var(--good) 50%, var(--sunken) 50%); }
.peta { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 12px; }
.tile {
  display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s, box-shadow .15s;
}
.tile:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); transform: translateY(-2px); box-shadow: var(--shadow); }
.tile-atas { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.tile-no { font-family: var(--font-read); font-style: italic; font-size: 2.3rem; line-height: .9; color: var(--brand); font-variant-numeric: lining-nums; letter-spacing: -.03em; }
:root[data-theme="dark"] .tile-no { color: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile-no { color: var(--link); } }
.tile-ic { color: var(--muted); width: 22px; height: 22px; }
.tile-judul { font-weight: 700; line-height: 1.3; min-height: 2.6em; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 4px; }
.seg i { height: 6px; border-radius: 3px; background: var(--sunken); }
.seg i.ok { background: var(--good); }
.seg i.half { background: linear-gradient(90deg, var(--good) 50%, var(--sunken) 50%); }
.tile-meta { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile-meta b { color: var(--ink); }
.lencana-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px; }
.lencana { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--radius); border: 1px dashed var(--line); background: transparent; }
.lencana .lencana-ic { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--sunken); color: var(--muted); }
.lencana .lencana-ic .ic { width: 22px; height: 22px; }
.lencana h4 { font-size: .9rem; }
.lencana p { font-size: .78rem; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.lencana.dapat { border-style: solid; background: var(--surface); }
.lencana.dapat .lencana-ic { background: var(--accent-soft); color: var(--accent); }
.lencana:not(.dapat) h4 { color: var(--muted); }
.kredit { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; }
.kredit-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
:root[data-theme="dark"] .kredit-ic { color: var(--link); }
.kredit-judul { font-family: var(--font-read); font-style: italic; font-size: 1.2rem; }
.kredit p + p { margin-top: 8px; }
.kredit p { color: var(--muted); font-size: .92rem; }
.kredit p strong { color: var(--ink); }

/* ---------- bab ---------- */
.bab-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(16px, 3vw, 34px); align-items: start; margin-bottom: 26px; }
.bab-no {
  font-family: var(--font-read); font-style: italic; font-weight: 400; font-size: clamp(4.2rem, 10vw, 7.4rem); line-height: .78;
  color: var(--brand); letter-spacing: -.05em; font-variant-numeric: lining-nums; padding-top: 6px;
}
:root[data-theme="dark"] .bab-no { color: var(--link); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bab-no { color: var(--link); } }
.bab-info { display: flex; flex-direction: column; gap: 10px; }
.bab-info h1 { font-size: clamp(1.7rem, 3.4vw, 2.45rem); font-weight: 800; letter-spacing: -.03em; }
.bab-intro { color: var(--muted); max-width: 68ch; font-size: 1rem; }
.bab-seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.bab-seg span { display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.bab-seg span .ic { width: 14px; height: 14px; }
.bab-seg span.ok { background: var(--good-soft); color: var(--good); }
.bab-seg span.half { background: var(--warn-soft); color: var(--warn); }
.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: 26px;
  position: sticky; top: 67px; z-index: 10; background: var(--bg);
}
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  display: inline-flex; align-items: center; gap: 8px; padding: 12px 14px; white-space: nowrap;
  color: var(--muted); text-decoration: none; font-weight: 600; font-size: .92rem; border-bottom: 2.5px solid transparent; margin-bottom: -1px;
}
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .tab-ok { width: 15px; height: 15px; color: var(--good); }
.bab-pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); }
.bab-pager a { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); background: var(--surface); }
.bab-pager a:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); }
.bab-pager a.berikut { text-align: right; grid-column: 2; }
.bab-pager small { color: var(--muted); font-size: .78rem; font-weight: 600; }
.bab-pager b { font-weight: 700; }

/* materi */
.materi { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 36px; align-items: start; }
.toc { position: sticky; top: 132px; display: flex; flex-direction: column; gap: 4px; font-size: .86rem; }
.toc-judul { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.toc-link { display: flex; gap: 8px; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 8px; cursor: pointer; color: var(--muted); line-height: 1.35; }
.toc-link:hover { background: var(--sunken); color: var(--ink); }
.toc-link span:first-child { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); flex: none; }
.teks-ukur { display: flex; align-items: center; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
.teks-ukur button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 30px; cursor: pointer; font-weight: 700; }
.teks-ukur button:hover { background: var(--sunken); }
.baca { min-width: 0; max-width: 72ch; }
.subbab { padding: 4px 0 30px; border-radius: 10px; transition: background .6s; }
.subbab + .subbab { border-top: 1px solid var(--line); padding-top: 26px; }
.subbab h2 { display: flex; gap: 12px; align-items: baseline; font-size: 1.32rem; letter-spacing: -.015em; margin-bottom: 14px; }
.subbab h2 .sub-no { font-family: var(--font-read); font-style: italic; font-weight: 400; color: var(--accent); font-size: 1.15rem; flex: none; font-variant-numeric: lining-nums; }
.baca p.paragraf { font-family: var(--font-read); font-size: var(--read-size); line-height: 1.75; margin-bottom: 12px; }
.poin { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.poin li { font-family: var(--font-read); font-size: var(--read-size); line-height: 1.72; padding-left: 22px; position: relative; }
.poin li::before { content: ""; position: absolute; left: 3px; top: .72em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); transform: rotate(45deg); }
.contoh { margin-top: 14px; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; font-family: var(--font-read); font-size: var(--read-size); }
.sorot { background: var(--accent-soft); }
.tokoh-blok { margin-top: 10px; padding-top: 26px; border-top: 1px solid var(--line); }
.tokoh-blok h2, .ringkasan-blok h2 { font-size: 1.32rem; letter-spacing: -.015em; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
.tokoh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.tokoh { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.tokoh-nama { font-weight: 700; margin-bottom: 4px; }
.tokoh-kontribusi { font-size: .88rem; color: var(--muted); line-height: 1.5; }
.ringkasan-blok { margin-top: 28px; padding: 22px 24px; border-radius: var(--radius); background: var(--brand); color: var(--brand-ink); }
.ringkasan-blok h2 { color: inherit; }
.ringkasan-blok ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-family: var(--font-read); font-size: var(--read-size); line-height: 1.6; }
.ringkasan-blok ol li::marker { font-family: var(--font-ui); font-weight: 700; color: var(--ring); }
.materi-footer { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 18px 20px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
.materi-footer p { color: var(--muted); font-size: .9rem; max-width: 46ch; }

/* flashcard */
.fc-wrap { display: flex; flex-direction: column; gap: 18px; max-width: 760px; margin: 0 auto; }
.fc-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.fc-stage { perspective: 1600px; }
.fc-card { display: block; width: 100%; height: clamp(250px, 42vh, 340px); border: 0; padding: 0; background: none; cursor: pointer; touch-action: pan-y; border-radius: 20px; }
.fc-inner { position: relative; display: block; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.2, .75, .25, 1); transform-style: preserve-3d; }
.fc-card.is-flipped .fc-inner { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 28px clamp(20px, 5vw, 48px); border-radius: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden; text-align: center; overflow-y: auto;
}
.fc-front { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.fc-back { background: var(--brand); color: var(--brand-ink); transform: rotateY(180deg); box-shadow: var(--shadow); }
.fc-tag { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.fc-istilah { font-family: var(--font-read); font-weight: 600; font-size: clamp(1.6rem, 4vw, 2.4rem); line-height: 1.2; letter-spacing: -.01em; }
.fc-definisi { font-family: var(--font-read); font-size: clamp(1.05rem, 2.2vw, 1.3rem); line-height: 1.55; max-width: 46ch; }
.fc-hafal-tanda { position: absolute; top: 14px; right: 16px; display: inline-flex; gap: 5px; align-items: center; font-size: .74rem; font-weight: 700; color: var(--good); }
.fc-back .fc-hafal-tanda { color: #c8f2dd; }
.fc-nav { display: flex; align-items: center; justify-content: center; gap: 16px; }
.fc-nav .icon-btn { border-color: var(--line); background: var(--surface); width: 46px; height: 46px; border-radius: 50%; }
.fc-hitung { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 70px; text-align: center; }
.fc-nilai { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fc-nilai .btn { min-height: 48px; }
.btn-hafal { background: var(--good); border-color: var(--good); }
.btn-belum { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-belum:hover { background: var(--sunken); filter: none; }
.fc-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: .8rem; color: var(--muted); }
.fc-meta div { display: flex; flex-direction: column; gap: 6px; }
.fc-meta .bar.hijau > i { background: var(--good); }
.petunjuk { font-size: .82rem; color: var(--muted); display: flex; gap: 8px; align-items: center; justify-content: center; text-align: center; }
.kosong { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.kosong .ic { width: 40px; height: 40px; color: var(--good); }

/* kuis */
.kuis-bar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.kuis-bar .row { gap: 14px; }
.kuis-info { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.kuis-info b { color: var(--ink); }
.soal-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.soal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px clamp(16px, 2.4vw, 24px); transition: box-shadow .3s, border-color .3s; }
.soal.perlu { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.soal-no { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.soal-no .status-ok { color: var(--good); }
.soal-no .status-no { color: var(--bad); }
.soal-teks { font-family: var(--font-read); font-size: 1.08rem; line-height: 1.6; font-weight: 600; margin-bottom: 14px; }
.opsi { display: flex; flex-direction: column; gap: 8px; }
.opsi-item {
  display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border-radius: 11px; border: 1px solid var(--line);
  cursor: pointer; transition: border-color .15s, background .15s;
}
.opsi-item:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); background: var(--bg); }
.opsi-item input { position: absolute; opacity: 0; pointer-events: none; }
.opsi-huruf { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: .82rem; border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
.opsi-teks { padding-top: 2px; line-height: 1.5; }
.opsi-item:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.opsi-item:has(input:checked) .opsi-huruf { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.opsi-item:has(input:focus-visible) { outline: 3px solid var(--ring); outline-offset: 2px; }
.opsi-item.terkunci { cursor: default; }
.opsi-item.terkunci:hover { background: transparent; border-color: var(--line); }
.opsi-item.benar, .opsi-item.benar:hover, .opsi-item.benar:has(input:checked) { border-color: var(--good); background: var(--good-soft); }
.opsi-item.benar .opsi-huruf, .opsi-item.benar:has(input:checked) .opsi-huruf { background: var(--good); color: #fff; border-color: var(--good); }
.opsi-item.salah, .opsi-item.salah:hover, .opsi-item.salah:has(input:checked) { border-color: var(--bad); background: var(--bad-soft); }
.opsi-item.salah .opsi-huruf, .opsi-item.salah:has(input:checked) .opsi-huruf { background: var(--bad); color: #fff; border-color: var(--bad); }
.umpan { margin-top: 12px; padding: 12px 14px; border-radius: 11px; font-size: .92rem; line-height: 1.55; border-left: 3px solid; }
.umpan.ok { background: var(--good-soft); border-color: var(--good); }
.umpan.no { background: var(--bad-soft); border-color: var(--bad); }
.umpan p + p { margin-top: 6px; }
.umpan .penjelasan { font-family: var(--font-read); color: var(--ink); }
.kuis-aksi {
  position: sticky; bottom: 12px; z-index: 5; margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 14px 12px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.kuis-aksi .bar { flex: 1; min-width: 120px; max-width: 280px; }
.hasil { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; padding: 22px 24px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); margin-bottom: 18px; outline: none; }
.hasil.lulus { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.hasil.ulang { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.hasil-skor { font-family: var(--font-read); font-size: 3.6rem; line-height: 1; font-variant-numeric: lining-nums tabular-nums; color: var(--good); }
.hasil.ulang .hasil-skor { color: var(--warn); }
.hasil-skor small { font-size: 1.4rem; }
.hasil h3 { font-size: 1.15rem; margin-bottom: 4px; }
.hasil .row { margin-top: 14px; }
.riwayat { display: inline-flex; gap: 4px; align-items: flex-end; height: 22px; vertical-align: middle; margin-left: 6px; }
.riwayat i { width: 6px; border-radius: 2px 2px 0 0; background: color-mix(in srgb, var(--brand) 55%, transparent); }
.riwayat i:last-child { background: var(--accent); }

/* cocok & isian */
.cocok-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 14px 20px; }
.cocok-kol { display: flex; flex-direction: column; gap: 8px; }
.kol-judul { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ck-item {
  position: relative; display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; cursor: pointer;
  padding: 11px 12px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); line-height: 1.45; font-size: .93rem;
  transition: border-color .15s, background .15s, transform .1s;
}
.ck-item:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
.ck-term { font-weight: 700; }
.ck-badge { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 800; border: 1.5px dashed var(--line); color: transparent; }
.ck-item.pilih { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.ck-item.pilih .ck-badge { border-color: var(--brand); }
.ck-item[data-pair] .ck-badge { border-style: solid; color: #fff; }
.ck-item[data-pair="0"] { border-color: var(--p0); } .ck-item[data-pair="0"] .ck-badge { background: var(--p0); border-color: var(--p0); }
.ck-item[data-pair="1"] { border-color: var(--p1); } .ck-item[data-pair="1"] .ck-badge { background: var(--p1); border-color: var(--p1); }
.ck-item[data-pair="2"] { border-color: var(--p2); } .ck-item[data-pair="2"] .ck-badge { background: var(--p2); border-color: var(--p2); }
.ck-item[data-pair="3"] { border-color: var(--p3); } .ck-item[data-pair="3"] .ck-badge { background: var(--p3); border-color: var(--p3); }
.ck-item[data-pair="4"] { border-color: var(--p4); } .ck-item[data-pair="4"] .ck-badge { background: var(--p4); border-color: var(--p4); }
:root[data-theme="dark"] .ck-item[data-pair] .ck-badge { color: #0a1220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ck-item[data-pair] .ck-badge { color: #0a1220; } }
.ck-item.betul { background: var(--good-soft); }
.ck-item.keliru { background: var(--bad-soft); }
.ck-item[disabled] { cursor: default; }
.ck-koreksi { font-size: .8rem; color: var(--bad); font-weight: 600; display: block; margin-top: 4px; }
.ck-koreksi.ok { color: var(--good); }
.hasil-baris { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.hasil-baris .pesan { font-weight: 700; }
.pesan.ok { color: var(--good); } .pesan.no { color: var(--bad); }
.isian-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px; counter-reset: isian; }
.isian-item { counter-increment: isian; padding: 14px 16px 14px 52px; position: relative; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.isian-item::before { content: counter(isian); position: absolute; left: 16px; top: 15px; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-weight: 800; font-size: .8rem; background: var(--surface); border: 1px solid var(--line); }
.isian-kalimat { font-family: var(--font-read); font-size: var(--read-size); line-height: 2.1; }
.isian-input {
  font-family: var(--font-ui); font-size: .95rem; font-weight: 700; height: 34px; padding: 0 10px; margin: 0 4px; min-width: 7ch; max-width: 100%;
  border: 0; border-bottom: 2px solid var(--brand); border-radius: 8px 8px 0 0; background: var(--surface); color: var(--ink); vertical-align: baseline;
}
.isian-input:focus { outline: none; box-shadow: 0 0 0 3px var(--ring); }
.isian-item.benar .isian-input { border-color: var(--good); background: var(--good-soft); }
.isian-item.salah .isian-input { border-color: var(--bad); background: var(--bad-soft); }
.isian-bawah { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 6px; font-size: .86rem; }
.link-btn { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; font-weight: 600; font-size: .84rem; text-decoration: underline; text-underline-offset: 2px; }
.isian-umpan { font-weight: 600; }
.isian-umpan.ok { color: var(--good); } .isian-umpan.no { color: var(--bad); }

/* studi kasus */
.kasus { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; padding: 0; overflow: hidden; }
.kasus + .kasus { margin-top: 18px; }
.kasus-skenario { padding: clamp(20px, 3vw, 30px); background: var(--sunken); border-right: 1px solid var(--line); }
.kasus-skenario p { font-family: var(--font-read); font-size: var(--read-size); line-height: 1.75; font-style: italic; margin-top: 12px; }
.kasus-tanya { padding: clamp(20px, 3vw, 30px); display: flex; flex-direction: column; gap: 14px; }
.kasus-tanya h3 { font-family: var(--font-read); font-size: 1.12rem; line-height: 1.5; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }

/* glosarium */
.glos-alat { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.glos-alat input[type="search"], .glos-alat select {
  height: 42px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.glos-alat input[type="search"] { flex: 1; min-width: 220px; }
.abjad { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 20px; }
.abjad button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: .82rem; cursor: pointer; }
.abjad button:hover { background: var(--brand-soft); }
.glos-grup { margin-bottom: 26px; }
.glos-huruf { font-family: var(--font-read); font-style: italic; font-size: 2rem; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 4px; }
.glos-item { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(0, 2.4fr); gap: 6px 22px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.glos-term { font-weight: 700; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.glos-def { font-family: var(--font-read); line-height: 1.6; }
.glos-tag { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-hafal { background: var(--good-soft); color: var(--good); }

/* ujian */
.ujian-atur fieldset { border: 0; padding: 0; margin: 0 0 22px; }
.ujian-atur legend { font-weight: 700; margin-bottom: 10px; padding: 0; }
.chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin-bottom: 10px; }
.chip-cek { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; font-size: .9rem; }
.chip-cek:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.chip-cek input { accent-color: var(--brand); width: 17px; height: 17px; margin: 0; }
.chip-cek b { font-family: var(--font-read); font-style: italic; font-weight: 400; color: var(--muted); }
.uj-top {
  position: sticky; top: 67px; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 16px; margin-bottom: 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.uj-timer { display: inline-flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.05rem; padding: 4px 12px; border-radius: 9px; background: var(--sunken); }
.uj-timer.mepet { background: var(--bad-soft); color: var(--bad); }
.uj-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; align-items: start; }
.uj-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.palet { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 6px; margin: 12px 0; }
.palet button { height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: .82rem; cursor: pointer; font-variant-numeric: tabular-nums; }
.palet button.terjawab { background: var(--brand-soft); border-color: transparent; }
.palet button[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.palet button.ok { background: var(--good-soft); color: var(--good); border-color: transparent; }
.palet button.no { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.per-bab { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.per-bab-baris { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) auto; gap: 14px; align-items: center; font-size: .9rem; }
.per-bab-baris .bar { height: 10px; }
.per-bab-baris .bar > i.rendah { background: var(--bad); }
.per-bab-baris .bar > i.sedang { background: var(--warn); }
.per-bab-baris .bar > i.tinggi { background: var(--good); }
.per-bab-baris span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.tabel { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
.tabel th, .tabel td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tabel th { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.gulir-x { overflow-x: auto; }

/* modal & toast */
.modal-latar { position: fixed; inset: 0; z-index: 60; background: rgba(6, 14, 28, .55); display: grid; place-items: center; padding: 16px; animation: muncul .2s ease; }
.modal {
  position: relative; width: min(620px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; outline: none;
  background: var(--surface); border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.3); padding: 26px clamp(18px, 4vw, 30px) 24px;
}
.modal h2 { font-size: 1.35rem; margin-bottom: 4px; padding-right: 40px; }
.modal-tutup { position: absolute; top: 14px; right: 14px; }
.modal-bagian { padding: 18px 0; border-top: 1px solid var(--line); }
.modal-bagian:first-of-type { border-top: 0; }
.modal-bagian h3 { font-size: .98rem; margin-bottom: 10px; }
.modal input[type="text"], .modal textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.modal textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; resize: vertical; word-break: break-all; }
.daftar-profil { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.profil-opsi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; }
.profil-opsi:hover { background: var(--sunken); }
.profil-opsi.aktif { border-color: var(--brand); background: var(--brand-soft); cursor: default; }
.profil-opsi .avatar { width: 32px; height: 32px; font-size: .9rem; }
.profil-opsi small { margin-left: auto; color: var(--muted); font-size: .78rem; }
#toast-root { position: fixed; right: 18px; bottom: 18px; z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; max-width: min(380px, calc(100vw - 36px));
  padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: .9rem; font-weight: 500;
  opacity: 0; transform: translateY(10px); transition: opacity .25s, transform .25s;
}
.toast.muncul { opacity: 1; transform: none; }
.toast .ic { margin-top: 2px; }
.toast-ok .ic { color: #6fe0a8; } .toast-warn .ic { color: #ffc46b; } .toast-badge .ic { color: var(--ring); }
@keyframes muncul { from { opacity: 0; } }

/* ---------- responsif ---------- */
@media (max-width: 1080px) {
  .materi { grid-template-columns: minmax(0, 1fr); }

  body.menu-terbuka .sidebar { transform: none; }

}
@media (prefers-reduced-motion: reduce) {

}

}

<!--KONTEN:MULAI--><script type="application/json" id="data-konten">{"versi":"v3.4","sumber":{"judul":"Psychology 2e","penulis":"Rose M. Spielman, William J. Jenkins, dan Marilyn D. Lovett","tahun":"2020","penerbit":"OpenStax, Rice University","lisensi":"CC BY-NC-SA 4.0","lisensi_url":"https://creativecommons.org/licenses/by-nc-sa/4.0/","url":"https://openstax.org/books/psychology-2e/pages/1-introduction"},"bab":[{"nomor":1,"id":"ch01","judul":"Pengantar Psikologi","ikon":"brain","pendahuluan":"Psikologi adalah studi ilmiah tentang perilaku dan proses mental. Bab ini mengenalkan definisi psikologi, perjalanan sejarahnya dari filsafat menjadi ilmu empiris, aliran-aliran besar yang membentuknya, perspektif kontemporer, serta ragam bidang dan karier psikologi.","materi":[{"judul":"Apa Itu Psikologi?","poin":["Psikologi adalah studi ILMIAH tentang perilaku dan proses mental. Kata 'ilmiah' menegaskan bahwa kesimpulan psikologi harus berdasarkan bukti empiris yang dapat diuji ulang, bukan sekadar akal sehat atau pengalaman pribadi.","Perilaku (behavior) adalah segala tindakan yang dapat diamati dan diukur secara langsung, misalnya berbicara, menangis, menekan tombol, atau menghindari keramaian.","Proses mental adalah aktivitas internal yang tidak dapat dilihat langsung, seperti berpikir, mengingat, merasakan emosi, dan mengambil keputusan. Proses ini disimpulkan secara tidak langsung melalui perilaku, laporan diri, waktu reaksi, dan pengukuran fisiologis.","Empat tujuan psikologi: (1) MENDESKRIPSIKAN apa yang terjadi, (2) MENJELASKAN mengapa terjadi, (3) MEMPREDIKSI kapan akan terjadi lagi, dan (4) MENGUBAH atau mengendalikan perilaku ke arah yang lebih adaptif.","Psikologi berbeda dari akal sehat karena menguji dugaan secara sistematis. Banyak 'kebenaran umum' ternyata keliru saat diuji, misalnya anggapan bahwa melampiaskan amarah selalu menurunkan agresi (riset justru sering menemukan sebaliknya).","Bias hindsight ('saya sudah tahu dari dulu') membuat hasil penelitian terasa jelas SETELAH diketahui. Inilah salah satu alasan psikologi tetap membutuhkan data, bukan intuisi."]},{"judul":"Akar Filsafat dan Kelahiran Psikologi Ilmiah","poin":["Sebelum menjadi ilmu mandiri, pertanyaan psikologis dibahas dalam filsafat: perdebatan nature vs nurture (apakah pengetahuan bersifat bawaan atau hasil pengalaman) dan hubungan pikiran dengan tubuh (mind-body problem).","Wilhelm Wundt mendirikan laboratorium psikologi eksperimental pertama di Leipzig, Jerman, pada tahun 1879. Peristiwa ini umumnya dipandang sebagai kelahiran psikologi sebagai ilmu tersendiri, terpisah dari filsafat dan fisiologi.","Wundt mengembangkan introspeksi terlatih, yaitu partisipan dilatih melaporkan pengalaman sadarnya secara rinci dan sistematis saat diberi stimulus terkontrol.","Kelemahan introspeksi: hasilnya sangat subjektif dan sulit direplikasi antar-orang. Kritik inilah yang kelak mendorong lahirnya behaviorisme."]},{"judul":"Aliran-Aliran Besar Psikologi","poin":["STRUKTURALISME (Edward Titchener): berupaya memecah kesadaran menjadi elemen-elemen dasarnya (sensasi, perasaan, citra), layaknya kimia memecah zat menjadi unsur. Metodenya introspeksi.","FUNGSIONALISME (William James): dipengaruhi teori evolusi Darwin, menanyakan APA FUNGSI dari pikiran dan perilaku, bukan apa strukturnya - bagaimana kesadaran membantu manusia beradaptasi dengan lingkungan.","PSIKOANALISIS (Sigmund Freud): menekankan peran alam bawah sadar, konflik internal, dan pengalaman masa kanak-kanak dalam membentuk kepribadian serta gangguan psikologis.","BEHAVIORISME (John B. Watson, B.F. Skinner): menolak kajian proses mental karena tidak teramati, dan menegaskan psikologi harus mempelajari hubungan stimulus-respons yang objektif dan terukur.","PSIKOLOGI GESTALT (Wertheimer, Koffka, Kohler): menekankan bahwa pengalaman adalah keseluruhan yang bermakna, bukan sekadar jumlah bagian-bagiannya.","PSIKOLOGI HUMANISTIK (Abraham Maslow, Carl Rogers): muncul sebagai 'kekuatan ketiga' yang mengkritik pandangan pesimistis psikoanalisis dan pandangan mekanistis behaviorisme; menekankan kehendak bebas, potensi positif, dan aktualisasi diri.","REVOLUSI KOGNITIF (sejak 1950-1960-an): perkembangan ilmu komputer dan linguistik menghidupkan kembali kajian proses mental, memandang pikiran sebagai sistem pemroses informasi."]},{"judul":"Perspektif Psikologi Kontemporer","poin":["Perspektif BIOLOGIS: menjelaskan perilaku melalui otak, neurotransmiter, hormon, dan faktor genetik.","Perspektif KOGNITIF: berfokus pada bagaimana orang menerima, mengolah, menyimpan, dan menggunakan informasi.","Perspektif BEHAVIORAL: menjelaskan perilaku sebagai hasil belajar dari pengalaman dan konsekuensi lingkungan.","Perspektif PSIKODINAMIK: menyoroti motif tak sadar dan pengalaman awal kehidupan.","Perspektif HUMANISTIK: menekankan pengalaman subjektif, makna hidup, dan dorongan untuk bertumbuh.","Perspektif SOSIOKULTURAL: menekankan pengaruh budaya, norma, kelas sosial, dan konteks kelompok terhadap perilaku.","Perspektif EVOLUSIONER: menjelaskan perilaku sebagai hasil adaptasi yang dahulu meningkatkan kelangsungan hidup dan reproduksi.","Sebagian besar psikolog masa kini bersikap EKLEKTIK, yaitu memadukan beberapa perspektif karena perilaku manusia terlalu kompleks untuk dijelaskan satu sudut pandang saja. Model biopsikososial menggabungkan faktor biologis, psikologis, dan sosial sekaligus."]},{"judul":"Bidang dan Karier dalam Psikologi","poin":["Psikologi KLINIS dan KONSELING: asesmen dan penanganan masalah psikologis; bidang dengan jumlah praktisi terbesar.","Psikologi PERKEMBANGAN: mempelajari perubahan manusia sepanjang rentang kehidupan.","Psikologi SOSIAL: mempelajari pengaruh kehadiran dan pikiran orang lain terhadap individu.","Psikologi INDUSTRI-ORGANISASI (PIO): menerapkan psikologi di dunia kerja, mulai dari rekrutmen hingga kepemimpinan.","Psikologi PENDIDIKAN, FORENSIK, KESEHATAN, OLAHRAGA, dan LINTAS BUDAYA adalah contoh bidang terapan lain yang terus berkembang.","Perbedaan penting: PSIKOLOG umumnya menempuh pendidikan psikologi dan berfokus pada asesmen serta intervensi psikologis, sedangkan PSIKIATER adalah dokter lulusan kedokteran yang berwenang meresepkan obat."]}],"ringkasan":["Psikologi = studi ILMIAH tentang perilaku dan proses mental; kesimpulannya harus berbasis bukti empiris, bukan akal sehat.","Empat tujuan: mendeskripsikan, menjelaskan, memprediksi, dan mengubah perilaku.","Wundt (1879, Leipzig) menandai lahirnya psikologi sebagai ilmu mandiri.","Aliran besar: strukturalisme, fungsionalisme, psikoanalisis, behaviorisme, Gestalt, humanistik, lalu revolusi kognitif.","Psikolog masa kini umumnya EKLEKTIK karena perilaku terlalu kompleks untuk satu perspektif saja."],"tokoh":[{"nama":"Wilhelm Wundt","kontribusi":"Mendirikan laboratorium psikologi eksperimental pertama (1879), menandai lahirnya psikologi sebagai ilmu."},{"nama":"Edward Titchener","kontribusi":"Pelopor strukturalisme; menganalisis elemen dasar kesadaran melalui introspeksi."},{"nama":"William James","kontribusi":"Bapak psikologi Amerika dan pelopor fungsionalisme; menulis 'The Principles of Psychology'."},{"nama":"Sigmund Freud","kontribusi":"Pendiri psikoanalisis; menekankan alam bawah sadar dan pengalaman masa kecil."},{"nama":"John B. Watson","kontribusi":"Pendiri behaviorisme; menegaskan psikologi harus mempelajari perilaku yang teramati."},{"nama":"Maslow & Rogers","kontribusi":"Tokoh psikologi humanistik; menekankan potensi positif dan aktualisasi diri."},{"nama":"Mary Whiton Calkins","kontribusi":"Presiden perempuan pertama American Psychological Association; peneliti memori."},{"nama":"Kenneth & Mamie Clark","kontribusi":"Riset 'doll study' tentang dampak psikologis segregasi terhadap anak."}],"istilah":[{"term":"Psikologi","definisi":"Studi ilmiah tentang perilaku dan proses mental."},{"term":"Introspeksi","definisi":"Metode pengamatan dan pelaporan isi kesadaran diri sendiri secara sistematis."},{"term":"Strukturalisme","definisi":"Aliran yang menganalisis komponen dasar kesadaran atau pengalaman mental."},{"term":"Fungsionalisme","definisi":"Aliran yang menekankan fungsi adaptif perilaku dan pikiran bagi kelangsungan hidup."},{"term":"Behaviorisme","definisi":"Aliran yang berfokus pada perilaku teramati dan mengabaikan proses mental internal."},{"term":"Psikologi humanistik","definisi":"Perspektif yang menekankan potensi, pertumbuhan, dan kehendak bebas manusia."},{"term":"Perspektif eklektik","definisi":"Pendekatan yang memadukan beberapa perspektif psikologi sekaligus."},{"term":"Model biopsikososial","definisi":"Model yang menjelaskan perilaku melalui interaksi faktor biologis, psikologis, dan sosial."},{"term":"Bias hindsight","definisi":"Kecenderungan merasa sudah mengetahui suatu hasil setelah hasil itu diketahui."}],"quiz":[{"soal":"Tokoh yang mendirikan laboratorium psikologi eksperimental pertama pada tahun 1879 adalah...","pilihan":["Sigmund Freud","Wilhelm Wundt","William James","B.F. Skinner"],"jawaban":2,"penjelasan":"Wilhelm Wundt mendirikan laboratorium psikologi eksperimental pertama di Leipzig, Jerman, pada 1879 - peristiwa yang menandai lahirnya psikologi sebagai ilmu mandiri."},{"soal":"Aliran yang berfokus hanya pada perilaku yang dapat diamati secara objektif disebut...","pilihan":["Strukturalisme","Psikoanalisis","Behaviorisme","Humanistik"],"jawaban":3,"penjelasan":"Behaviorisme (Watson, Skinner) menolak kajian proses mental internal karena dianggap tidak dapat diamati secara objektif."},{"soal":"Aliran yang bertanya 'apa FUNGSI dari pikiran dan perilaku bagi adaptasi' adalah...","pilihan":["Fungsionalisme","Strukturalisme","Gestalt","Psikoanalisis"],"jawaban":1,"penjelasan":"Fungsionalisme yang dipelopori William James dipengaruhi teori evolusi Darwin dan menekankan fungsi adaptif pikiran."},{"soal":"Berikut yang BUKAN termasuk tujuan psikologi sebagai ilmu adalah...","pilihan":["Mendeskripsikan perilaku","Menjelaskan perilaku","Menghakimi moralitas seseorang","Memprediksi dan mengubah perilaku"],"jawaban":3,"penjelasan":"Empat tujuan psikologi adalah mendeskripsikan, menjelaskan, memprediksi, dan mengubah perilaku - bukan menghakimi moralitas."},{"soal":"Perspektif yang menjelaskan perilaku melalui pengaruh budaya, norma, dan konteks kelompok adalah perspektif...","pilihan":["Biologis","Sosiokultural","Kognitif","Psikodinamik"],"jawaban":2,"penjelasan":"Perspektif sosiokultural menekankan bagaimana budaya dan lingkungan sosial membentuk perilaku individu."},{"soal":"Perbedaan utama antara psikolog dan psikiater adalah...","pilihan":["Psikolog dapat meresepkan obat, psikiater tidak","Psikiater adalah lulusan kedokteran dan berwenang meresepkan obat","Keduanya sama persis","Psikiater hanya menangani anak-anak"],"jawaban":2,"penjelasan":"Psikiater menempuh pendidikan kedokteran sehingga berwenang meresepkan obat, sedangkan psikolog berfokus pada asesmen dan intervensi psikologis."},{"soal":"Klaim 'melampiaskan amarah selalu menurunkan agresi' ternyata sering tidak didukung riset. Hal ini menunjukkan bahwa...","pilihan":["Akal sehat selalu benar","Psikologi perlu menguji dugaan secara sistematis, tidak cukup mengandalkan akal sehat","Riset psikologi tidak dapat dipercaya","Agresi tidak dapat dipelajari"],"jawaban":2,"penjelasan":"Salah satu alasan psikologi harus ilmiah adalah karena banyak 'kebenaran umum' ternyata keliru ketika benar-benar diuji dengan data."},{"soal":"Aliran yang menekankan bahwa pengalaman adalah keseluruhan bermakna, bukan sekadar jumlah bagian-bagiannya, adalah...","pilihan":["Strukturalisme","Psikologi Gestalt","Behaviorisme","Psikoanalisis"],"jawaban":2,"penjelasan":"Psikologi Gestalt (Wertheimer, Koffka, Kohler) menegaskan bahwa keseluruhan berbeda dari sekadar penjumlahan bagian-bagiannya."},{"soal":"Perkembangan ilmu komputer dan linguistik pada 1950-1960-an memicu kembalinya kajian proses mental. Peristiwa ini dikenal sebagai...","pilihan":["Revolusi kognitif","Revolusi industri","Moral treatment","Deinstitusionalisasi"],"jawaban":1,"penjelasan":"Revolusi kognitif menghidupkan kembali studi proses mental dengan memandang pikiran sebagai sistem pemroses informasi."},{"soal":"Perspektif yang menjelaskan perilaku sebagai hasil adaptasi yang dahulu meningkatkan kelangsungan hidup disebut perspektif...","pilihan":["Sosiokultural","Evolusioner","Humanistik","Behavioral"],"jawaban":2,"penjelasan":"Perspektif evolusioner menjelaskan perilaku melalui nilai adaptifnya bagi kelangsungan hidup dan reproduksi nenek moyang manusia."}],"kasus":{"skenario":"Seorang mahasiswa penasaran mengapa ia selalu gugup setiap kali akan ujian, padahal sudah belajar dengan baik. Ia menyadari bahwa yang membuatnya cemas adalah pikiran berulang 'kalau gagal, habislah masa depan saya'. Ia ingin memahami bagaimana pikirannya memicu kecemasan tersebut.","pertanyaan":"Perspektif psikologi manakah yang paling relevan untuk membantu mahasiswa ini?","pilihan":["Behaviorisme, karena hanya perilaku teramati yang penting","Kognitif, karena berfokus pada proses berpikir dan interpretasi terhadap situasi","Strukturalisme, karena menganalisis struktur otak","Psikologi industri, karena berkaitan dengan performa"],"jawaban":2,"penjelasan":"Perspektif kognitif mengkaji bagaimana cara seseorang menafsirkan situasi - di sini pikiran katastrofik tentang kegagalan - dapat memicu emosi cemas. Inilah yang ingin dipahami mahasiswa tersebut."},"isian":[{"kalimat":"Aliran yang menekankan fungsi adaptif perilaku terhadap lingkungan disebut ___.","jawaban":["fungsionalisme"]},{"kalimat":"___ adalah tokoh yang mendirikan laboratorium psikologi eksperimental pertama di Leipzig.","jawaban":["wilhelm wundt","wundt"]},{"kalimat":"Psikolog yang menekankan potensi positif dan pertumbuhan pribadi manusia disebut penganut aliran ___.","jawaban":["humanistik","psikologi humanistik"]},{"kalimat":"Pendekatan yang memadukan beberapa perspektif psikologi sekaligus disebut pendekatan ___.","jawaban":["eklektik"]}]},{"nomor":2,"id":"ch02","judul":"Psikologi sebagai Ilmu","ikon":"flask","pendahuluan":"Yang membedakan psikologi dari opini populer adalah METODENYA. Bab ini membahas cara berpikir ilmiah, langkah-langkah metode ilmiah, berbagai desain penelitian beserta kelebihan dan keterbatasannya, dasar statistik, serta etika penelitian.","materi":[{"judul":"Cara Berpikir Ilmiah","poin":["Sikap ilmiah mencakup rasa ingin tahu, skeptisisme (tidak menerima klaim mentah-mentah), dan kerendahan hati untuk mengubah pendapat bila data berkata lain.","TEORI adalah penjelasan terintegrasi yang mengorganisasi banyak temuan dan menghasilkan prediksi baru. Teori yang baik bersifat sederhana (parsimonius) dan produktif (memunculkan riset lanjutan).","HIPOTESIS adalah prediksi spesifik yang dapat diuji dan yang terpenting DAPAT DIFALSIFIKASI, artinya harus mungkin dibuktikan salah. Klaim yang tidak bisa salah dalam kondisi apa pun bukanlah klaim ilmiah.","DEFINISI OPERASIONAL menerjemahkan konsep abstrak menjadi sesuatu yang terukur. Misalnya 'stres' didefinisikan sebagai skor pada skala stres tertentu atau kadar kortisol air liur.","REPLIKASI, yaitu mengulang penelitian untuk melihat apakah hasilnya konsisten, adalah jantung sains. 'Krisis replikasi' dalam psikologi mendorong praktik yang lebih transparan seperti pra-registrasi dan berbagi data.","Peer review (telaah sejawat) menyaring kualitas penelitian sebelum dipublikasikan, meski bukan jaminan mutlak kebenaran."]},{"judul":"Langkah-Langkah Metode Ilmiah","poin":["1) Mengamati fenomena dan merumuskan pertanyaan penelitian yang jelas dan dapat dijawab secara empiris.","2) Menelusuri literatur untuk mengetahui apa yang sudah diketahui dan celah apa yang masih terbuka.","3) Merumuskan hipotesis yang spesifik dan dapat diuji.","4) Merancang penelitian dan mengumpulkan data dengan metode yang sesuai dengan pertanyaan.","5) Menganalisis data secara statistik untuk melihat apakah pola yang muncul lebih dari sekadar kebetulan.","6) Menarik kesimpulan, melaporkan hasil, lalu membuka diri untuk direplikasi dan dikritik peneliti lain."]},{"judul":"Metode Penelitian Deskriptif","poin":["STUDI KASUS: mengkaji satu individu atau kelompok kecil secara sangat mendalam. Kaya informasi dan berguna untuk kasus langka, tetapi hasilnya sulit digeneralisasi ke populasi luas.","OBSERVASI NATURALISTIK: mengamati perilaku di lingkungan alaminya tanpa campur tangan. Menghasilkan perilaku yang otentik, tetapi peneliti tidak dapat mengontrol variabel dan rentan bias pengamat.","SURVEI: mengumpulkan data dari banyak orang lewat kuesioner atau wawancara. Efisien untuk sampel besar, tetapi rentan jawaban tidak jujur dan social desirability bias (menjawab agar terlihat baik).","Kualitas survei sangat bergantung pada SAMPEL. Sampel acak (random sampling) membuat setiap anggota populasi berpeluang sama terpilih, sehingga hasilnya lebih dapat digeneralisasi.","Efek Hawthorne: orang cenderung mengubah perilakunya ketika sadar sedang diamati."]},{"judul":"Penelitian Korelasional","poin":["Penelitian korelasional mengukur sejauh mana dua variabel bergerak bersama, tanpa memanipulasi apa pun.","Koefisien korelasi (r) berkisar dari -1,00 sampai +1,00. TANDA menunjukkan arah hubungan, sedangkan ANGKA menunjukkan kekuatannya. Nilai r = 0 berarti tidak ada hubungan linear.","Korelasi POSITIF: kedua variabel bergerak searah (jam belajar naik, nilai naik). Korelasi NEGATIF: bergerak berlawanan (jam bermain game naik, nilai turun).","KORELASI BUKAN SEBAB-AKIBAT. Ini prinsip yang paling sering dilanggar dalam pemberitaan populer.","Ada dua alasan utama: (a) masalah arah - mungkin B yang menyebabkan A, bukan A menyebabkan B; (b) VARIABEL PERANCU (confounding variable) - ada variabel ketiga yang menyebabkan keduanya.","Korelasi ilusi (illusory correlation): kita merasa melihat hubungan antara dua hal padahal secara statistik tidak ada, karena hanya mengingat kejadian yang mencolok."]},{"judul":"Penelitian Eksperimen","poin":["Eksperimen adalah SATU-SATUNYA metode yang memungkinkan kesimpulan sebab-akibat, karena peneliti aktif memanipulasi variabel.","VARIABEL BEBAS (independen) adalah yang dimanipulasi peneliti; VARIABEL TERIKAT (dependen) adalah yang diukur sebagai akibatnya.","KELOMPOK EKSPERIMEN menerima perlakuan, sedangkan KELOMPOK KONTROL tidak menerimanya (atau menerima plasebo) sebagai pembanding.","PENUGASAN ACAK (random assignment) menempatkan partisipan ke kelompok secara acak sehingga perbedaan awal antar-kelompok tersebar merata. Inilah kunci yang membuat sebab-akibat dapat disimpulkan.","Penting membedakan random SAMPLING (memilih siapa yang ikut, demi generalisasi) dan random ASSIGNMENT (menempatkan ke kelompok mana, demi kesimpulan sebab-akibat).","Efek PLASEBO: perbaikan yang terjadi hanya karena partisipan percaya sedang mendapat perlakuan. Desain DOUBLE-BLIND, di mana partisipan maupun peneliti sama-sama tidak tahu siapa mendapat perlakuan asli, mencegah efek plasebo sekaligus bias ekspektasi peneliti.","Keterbatasan eksperimen: situasi laboratorium bisa terasa artifisial, dan sebagian variabel tidak etis atau tidak mungkin dimanipulasi (misalnya kekerasan terhadap anak)."]},{"judul":"Dasar Statistik dan Etika Penelitian","poin":["Statistik DESKRIPTIF meringkas data: mean (rata-rata), median (nilai tengah), modus (paling sering muncul), dan standar deviasi (sebaran data).","Statistik INFERENSIAL menyimpulkan apakah hasil dari sampel dapat digeneralisasi. Hasil disebut signifikan secara statistik bila kecil kemungkinannya muncul semata karena kebetulan.","Signifikan secara statistik TIDAK SAMA dengan penting secara praktis; dengan sampel sangat besar, perbedaan kecil pun bisa menjadi signifikan secara statistik.","Etika penelitian pada manusia: INFORMED CONSENT (persetujuan setelah memahami prosedur dan risiko), hak mengundurkan diri kapan saja, KERAHASIAAN data, serta perlindungan dari bahaya.","DEBRIEFING wajib dilakukan setelah penelitian, terutama bila ada deception (penyamaran tujuan), untuk menjelaskan tujuan sebenarnya kepada partisipan.","Komite etik (IRB / Institutional Review Board) menelaah kelayakan etis penelitian SEBELUM penelitian dijalankan.","Penelitian dengan hewan juga diatur ketat, harus meminimalkan penderitaan, dan memerlukan justifikasi ilmiah yang kuat."]}],"ringkasan":["Hipotesis harus dapat DIFALSIFIKASI; klaim yang tak mungkin salah bukan klaim ilmiah.","Deskriptif menggambarkan, korelasional mengukur hubungan, dan hanya EKSPERIMEN yang bisa menyimpulkan sebab-akibat.","Korelasi bukan sebab-akibat: bisa jadi arahnya terbalik, atau ada variabel perancu.","Random SAMPLING untuk generalisasi; random ASSIGNMENT untuk kesimpulan sebab-akibat. Keduanya berbeda.","Etika wajib: informed consent, hak mengundurkan diri, kerahasiaan, debriefing, dan telaah komite etik."],"tokoh":[{"nama":"Karl Popper","kontribusi":"Menekankan falsifiabilitas sebagai ciri utama klaim ilmiah."},{"nama":"Ronald Fisher","kontribusi":"Mengembangkan dasar statistik inferensial dan prinsip penugasan acak dalam eksperimen."},{"nama":"Studi Tuskegee","kontribusi":"Kasus pelanggaran etika historis yang memicu lahirnya standar etika penelitian modern."},{"nama":"Institutional Review Board","kontribusi":"Komite penelaah kelayakan etis penelitian sebelum penelitian dijalankan."}],"istilah":[{"term":"Hipotesis","definisi":"Prediksi spesifik yang dapat diuji dan dapat difalsifikasi."},{"term":"Teori","definisi":"Penjelasan terintegrasi yang mengorganisasi temuan dan menghasilkan prediksi baru."},{"term":"Definisi operasional","definisi":"Penerjemahan konsep abstrak menjadi prosedur pengukuran yang konkret."},{"term":"Variabel bebas","definisi":"Variabel yang dimanipulasi peneliti dalam eksperimen."},{"term":"Variabel terikat","definisi":"Variabel yang diukur sebagai hasil atau akibat dalam eksperimen."},{"term":"Variabel perancu","definisi":"Variabel ketiga yang memengaruhi dua variabel lain sehingga menciptakan hubungan semu."},{"term":"Penugasan acak","definisi":"Menempatkan partisipan ke kelompok secara acak agar perbedaan awal tersebar merata."},{"term":"Kelompok kontrol","definisi":"Kelompok pembanding yang tidak menerima perlakuan eksperimen."},{"term":"Efek plasebo","definisi":"Perbaikan yang terjadi semata karena keyakinan sedang menerima perlakuan."},{"term":"Double-blind","definisi":"Desain ketika partisipan dan peneliti sama-sama tidak tahu siapa menerima perlakuan asli."},{"term":"Informed consent","definisi":"Persetujuan partisipan setelah memahami prosedur dan risiko penelitian."},{"term":"Debriefing","definisi":"Penjelasan tujuan sebenarnya penelitian kepada partisipan setelah penelitian selesai."}],"quiz":[{"soal":"Satu-satunya metode penelitian yang dapat menyimpulkan hubungan sebab-akibat adalah...","pilihan":["Studi kasus","Survei","Eksperimen","Observasi naturalistik"],"jawaban":3,"penjelasan":"Hanya eksperimen yang memanipulasi variabel bebas secara terkontrol disertai penugasan acak, sehingga sebab-akibat dapat disimpulkan."},{"soal":"Korelasi sebesar -0,85 antara dua variabel menunjukkan...","pilihan":["Tidak ada hubungan","Hubungan positif yang kuat","Hubungan negatif yang kuat","Hubungan sebab-akibat yang pasti"],"jawaban":3,"penjelasan":"Tanda minus menunjukkan arah negatif, dan angka 0,85 yang mendekati 1 menunjukkan kekuatan hubungan yang kuat."},{"soal":"Prosedur yang membuat perbedaan awal antar-kelompok tersebar merata sehingga sebab-akibat dapat disimpulkan adalah...","pilihan":["Random sampling","Random assignment","Debriefing","Definisi operasional"],"jawaban":2,"penjelasan":"Random assignment (penugasan acak) menempatkan partisipan ke kelompok secara acak. Random sampling berbeda tujuannya, yaitu untuk generalisasi."},{"soal":"Sebuah klaim yang tidak mungkin dibuktikan salah dalam kondisi apa pun berarti klaim tersebut...","pilihan":["Pasti benar","Tidak ilmiah karena tidak dapat difalsifikasi","Merupakan teori yang kuat","Sudah tervalidasi"],"jawaban":2,"penjelasan":"Falsifiabilitas adalah syarat klaim ilmiah. Klaim yang kebal terhadap bukti apa pun berada di luar ranah sains."},{"soal":"Desain ketika partisipan maupun peneliti tidak mengetahui siapa menerima perlakuan asli disebut...","pilihan":["Single-blind","Double-blind","Observasi naturalistik","Studi kasus"],"jawaban":2,"penjelasan":"Desain double-blind mencegah efek plasebo sekaligus bias ekspektasi peneliti."},{"soal":"Mengapa korelasi tidak dapat membuktikan sebab-akibat?","pilihan":["Karena datanya selalu tidak akurat","Karena arah hubungan bisa terbalik dan mungkin ada variabel perancu","Karena korelasi hanya untuk data kualitatif","Karena sampelnya selalu kecil"],"jawaban":2,"penjelasan":"Dua alasan utamanya adalah masalah arah hubungan dan kemungkinan adanya variabel ketiga (perancu) yang memengaruhi keduanya."},{"soal":"Proses menjelaskan tujuan sebenarnya penelitian kepada partisipan setelah penelitian selesai disebut...","pilihan":["Informed consent","Debriefing","Randomisasi","Replikasi"],"jawaban":2,"penjelasan":"Debriefing dilakukan setelah penelitian, terutama bila melibatkan deception, sebagai kewajiban etis peneliti."},{"soal":"Seorang peneliti mengukur 'stres' sebagai skor pada skala tertentu agar konsepnya dapat diukur. Ini disebut...","pilihan":["Hipotesis","Definisi operasional","Replikasi","Debriefing"],"jawaban":2,"penjelasan":"Definisi operasional menerjemahkan konsep abstrak menjadi prosedur pengukuran yang konkret dan dapat diulang peneliti lain."},{"soal":"Mengulang sebuah penelitian untuk melihat apakah hasilnya konsisten disebut...","pilihan":["Replikasi","Randomisasi","Generalisasi","Operasionalisasi"],"jawaban":1,"penjelasan":"Replikasi adalah jantung sains. Krisis replikasi dalam psikologi mendorong praktik yang lebih transparan seperti pra-registrasi."},{"soal":"Kelemahan utama metode studi kasus adalah...","pilihan":["Tidak menghasilkan data apa pun","Hasilnya sulit digeneralisasi ke populasi luas","Selalu melanggar etika","Tidak bisa dipakai untuk kasus langka"],"jawaban":2,"penjelasan":"Studi kasus sangat kaya informasi dan berguna untuk kasus langka, tetapi karena hanya melibatkan sedikit orang, generalisasinya terbatas."}],"kasus":{"skenario":"Sebuah berita menampilkan judul besar: 'Penelitian Membuktikan Makan Es Krim Menyebabkan Orang Tenggelam', berdasarkan data yang menunjukkan bahwa saat penjualan es krim naik, angka kejadian tenggelam di pantai juga naik.","pertanyaan":"Evaluasi paling tepat terhadap klaim berita tersebut adalah...","pilihan":["Klaim benar karena datanya nyata","Ini hanya korelasi; variabel perancu berupa cuaca panas kemungkinan menyebabkan keduanya","Data korelasional selalu salah dan tidak berguna","Tenggelam menyebabkan orang makan es krim"],"jawaban":2,"penjelasan":"Ini contoh klasik variabel perancu: cuaca panas meningkatkan konsumsi es krim SEKALIGUS meningkatkan jumlah orang berenang. Data korelasional tetap berguna, hanya tidak boleh ditafsirkan sebagai sebab-akibat."},"isian":[{"kalimat":"Peneliti yang memanipulasi jumlah jam tidur untuk mengukur pengaruhnya terhadap konsentrasi sedang menjalankan metode ___.","jawaban":["eksperimen"]},{"kalimat":"Prediksi spesifik yang dapat diuji secara empiris dalam penelitian disebut ___.","jawaban":["hipotesis"]},{"kalimat":"Variabel ketiga yang menyebabkan dua variabel lain tampak berhubungan disebut variabel ___.","jawaban":["perancu","confounding","pengganggu"]},{"kalimat":"Komite yang meninjau kelayakan etika sebuah penelitian sebelum dijalankan disebut ___.","jawaban":["irb","institutional review board","komite etik"]}]},{"nomor":3,"id":"ch03","judul":"Biopsikologi","ikon":"dna","pendahuluan":"Setiap pikiran, perasaan, dan tindakan berakar pada aktivitas biologis. Bab ini membahas genetika perilaku, cara kerja neuron, organisasi sistem saraf, struktur dan fungsi otak, sistem endokrin, serta teknik pencitraan otak modern.","materi":[{"judul":"Genetika dan Perilaku","poin":["GEN adalah segmen DNA yang membawa instruksi pembentukan protein. Manusia memiliki 23 pasang kromosom di setiap sel tubuhnya.","GENOTIPE adalah susunan genetik yang diwarisi, sedangkan FENOTIPE adalah ciri yang benar-benar tampak sebagai hasil interaksi genotipe dengan lingkungan.","Perdebatan nature vs nurture kini digantikan pemahaman bahwa keduanya BERINTERAKSI. Pertanyaan yang tepat bukan 'mana yang berperan', melainkan 'bagaimana keduanya saling memengaruhi'.","Studi kembar dan studi adopsi dipakai untuk memisahkan pengaruh genetik dan lingkungan. Kembar identik (monozigot) berbagi hampir 100 persen gen, sedangkan kembar fraternal (dizigot) sekitar 50 persen.","EPIGENETIKA menunjukkan bahwa lingkungan seperti stres, nutrisi, dan pengasuhan dapat mengaktifkan atau menonaktifkan ekspresi gen tanpa mengubah urutan DNA-nya."]},{"judul":"Neuron dan Komunikasi Saraf","poin":["NEURON adalah sel saraf, unit dasar sistem saraf. Bagian utamanya: DENDRIT (menerima sinyal), BADAN SEL atau soma (mengolah sinyal dan menjaga kehidupan sel), AKSON (mengirim sinyal), serta TERMINAL AKSON (melepaskan neurotransmiter).","SELUBUNG MIELIN adalah lapisan lemak yang membungkus akson dan mempercepat penghantaran impuls. Kerusakan mielin terjadi pada penyakit seperti multiple sclerosis.","POTENSIAL AKSI adalah impuls listrik yang menjalar sepanjang akson. Sifatnya ALL-OR-NONE: neuron menembak dengan kekuatan penuh atau tidak sama sekali. Intensitas stimulus dikodekan lewat FREKUENSI penembakan, bukan kekuatannya.","Sinyal antar-neuron menyeberangi celah kecil bernama SINAPS menggunakan pembawa pesan kimiawi bernama NEUROTRANSMITER.","Neurotransmiter dapat bersifat EKSITATORIK (meningkatkan peluang neuron berikutnya menembak) atau INHIBITORIK (menurunkan peluang tersebut).","Sisa neurotransmiter diserap kembali melalui proses REUPTAKE. Banyak obat antidepresan bekerja dengan menghambat reuptake sehingga neurotransmiter bertahan lebih lama di sinaps."]},{"judul":"Neurotransmiter Utama dan Perannya","poin":["DOPAMIN: motivasi, sistem reward, dan gerakan. Kekurangan dopamin di area tertentu berkaitan dengan penyakit Parkinson, sedangkan aktivitas berlebih dikaitkan dengan gejala skizofrenia.","SEROTONIN: suasana hati, tidur, dan nafsu makan. Kadar rendah dikaitkan dengan depresi.","ASETILKOLIN: kontraksi otot, belajar, dan memori. Hilangnya neuron penghasil asetilkolin dikaitkan dengan penyakit Alzheimer.","GABA: neurotransmiter INHIBITORIK utama otak yang berperan menenangkan aktivitas saraf. Banyak obat anti-cemas bekerja dengan meningkatkan efek GABA.","GLUTAMAT: neurotransmiter EKSITATORIK utama, penting untuk belajar dan memori.","NOREPINEFRIN: kewaspadaan dan gairah (arousal), berperan dalam respons stres.","ENDORFIN: pereda nyeri alami tubuh sekaligus pemberi rasa senang; kadarnya meningkat saat berolahraga."]},{"judul":"Organisasi Sistem Saraf","poin":["Sistem saraf terbagi menjadi SISTEM SARAF PUSAT (otak dan sumsum tulang belakang) dan SISTEM SARAF TEPI (seluruh saraf di luar keduanya).","Sistem saraf tepi terbagi lagi menjadi SISTEM SOMATIK yang mengendalikan otot rangka secara sadar, dan SISTEM OTONOM yang mengatur organ dalam secara otomatis.","Sistem otonom terbagi dua: SIMPATIS yang menyiapkan tubuh menghadapi ancaman (fight or flight - jantung berdebar, napas cepat, pupil melebar), dan PARASIMPATIS yang menenangkan tubuh kembali (rest and digest).","REFLEKS adalah respons otomatis yang diproses di sumsum tulang belakang tanpa menunggu perintah otak, sehingga jauh lebih cepat - misalnya menarik tangan dari benda panas."]},{"judul":"Struktur dan Fungsi Otak","poin":["BATANG OTAK (medula, pons) mengatur fungsi dasar kehidupan seperti pernapasan dan detak jantung. Kerusakan di sini paling mengancam nyawa.","SEREBELUM atau otak kecil mengatur keseimbangan, koordinasi gerakan halus, dan sebagian memori prosedural.","TALAMUS berperan sebagai stasiun relai yang meneruskan hampir semua informasi indrawi ke area otak yang tepat, kecuali penciuman.","SISTEM LIMBIK terdiri dari AMIGDALA (pemrosesan emosi, terutama takut dan agresi), HIPOKAMPUS (pembentukan

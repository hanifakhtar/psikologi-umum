an salah satu.","KONTINUITAS vs TAHAPAN: apakah perkembangan berlangsung sebagai perubahan bertahap yang mulus, atau melalui lompatan tahapan yang berbeda secara kualitatif.","STABILITAS vs PERUBAHAN: sejauh mana ciri seseorang di masa kecil bertahan hingga dewasa. Temperamen relatif stabil, tetapi banyak aspek kepribadian tetap dapat berubah.","PERIODE KRITIS adalah rentang waktu ketika suatu pengalaman HARUS terjadi agar perkembangan normal tercapai. PERIODE SENSITIF lebih longgar: waktu optimal, namun perkembangan masih mungkin terjadi di luarnya.","Penelitian perkembangan memakai desain LONGITUDINAL (mengikuti orang yang sama selama bertahun-tahun; akurat tetapi mahal dan lama) dan CROSS-SECTIONAL (membandingkan berbagai kelompok usia sekaligus; cepat tetapi rentan efek kohort)."]},{"judul":"Perkembangan Prenatal dan Bayi","poin":["Tahap prenatal terdiri atas periode germinal (0-2 minggu), embrionik (3-8 minggu, saat organ utama terbentuk), dan fetal (9 minggu hingga lahir).","TERATOGEN adalah zat atau kondisi yang dapat merusak perkembangan janin, seperti alkohol, nikotin, obat tertentu, dan infeksi. Periode embrionik adalah masa paling rentan.","Bayi baru lahir memiliki refleks bawaan seperti refleks menghisap, menggenggam, dan rooting yang membantu kelangsungan hidup.","Perkembangan motorik mengikuti urutan yang relatif universal (tengkurap, duduk, merangkak, berjalan), meski waktunya bervariasi antar-anak.","TEMPERAMEN adalah gaya emosional dan reaktivitas bawaan yang tampak sejak bayi, umumnya dikelompokkan menjadi easy, difficult, dan slow-to-warm-up."]},{"judul":"Perkembangan Kognitif Menurut Piaget","poin":["Piaget berpendapat anak membangun pemahaman lewat SKEMA, yaitu kerangka mental tentang dunia, yang berkembang melalui ASIMILASI (memasukkan pengalaman baru ke skema lama) dan AKOMODASI (mengubah skema agar sesuai pengalaman baru).","TAHAP SENSORIMOTOR (0-2 tahun): bayi belajar melalui indra dan gerakan. Pencapaian utamanya adalah OBJECT PERMANENCE, yaitu pemahaman bahwa objek tetap ada meski tidak terlihat.","TAHAP PRAOPERASIONAL (2-7 tahun): berkembangnya pemikiran simbolis dan bahasa, tetapi masih EGOSENTRIS (sulit mengambil sudut pandang orang lain) dan belum menguasai KONSERVASI.","Uji konservasi klasik: air dari gelas pendek-lebar dituang ke gelas tinggi-ramping; anak praoperasional mengira airnya bertambah karena hanya berfokus pada satu dimensi (centration).","TAHAP OPERASIONAL KONKRET (7-11 tahun): mampu berpikir logis tentang objek dan situasi konkret, menguasai konservasi, dan memahami reversibilitas.","TAHAP OPERASIONAL FORMAL (11 tahun ke atas): mampu berpikir abstrak, hipotetis, dan sistematis - misalnya mendiskusikan keadilan atau merancang eksperimen dalam pikiran.","Kritik terhadap Piaget: perkembangan tidak setegas tahapan yang ia gambarkan, dan penelitian modern menunjukkan anak sering mampu melakukan hal-hal tertentu LEBIH AWAL daripada perkiraan Piaget.","Lev VYGOTSKY menawarkan alternatif dengan menekankan peran sosial dan budaya. Konsep kuncinya adalah ZONE OF PROXIMAL DEVELOPMENT, yaitu rentang antara apa yang dapat dilakukan anak sendiri dan apa yang dapat dicapainya dengan bantuan (SCAFFOLDING) dari orang yang lebih mampu."]},{"judul":"Kelekatan (Attachment) dan Pengasuhan","poin":["Harry Harlow menunjukkan lewat eksperimen monyet rhesus bahwa KENYAMANAN KONTAK jauh lebih penting bagi kelekatan daripada sekadar pemberian makan.","John Bowlby merumuskan teori kelekatan: kedekatan dengan pengasuh adalah kebutuhan bawaan yang berfungsi melindungi anak.","Mary Ainsworth mengembangkan prosedur STRANGE SITUATION untuk mengukur pola kelekatan bayi.","KELEKATAN AMAN (secure): anak menjadikan pengasuh sebagai basis aman untuk mengeksplorasi, kecewa saat ditinggal, dan mudah ditenangkan saat pengasuh kembali. Terkait dengan pengasuhan yang responsif dan konsisten.","KELEKATAN CEMAS-AMBIVALEN: anak sangat cemas saat ditinggal dan sulit ditenangkan, kadang marah pada pengasuh saat kembali.","KELEKATAN MENGHINDAR (avoidant): anak tampak tidak terlalu terpengaruh oleh kepergian maupun kembalinya pengasuh.","KELEKATAN DISORGANISASI: perilaku bingung dan tidak konsisten, sering dikaitkan dengan pengasuhan yang menakutkan atau tidak terprediksi.","GAYA PENGASUHAN Baumrind: OTORITATIF (hangat dan menuntut, disertai penjelasan - umumnya berhubungan dengan hasil paling positif), OTORITER (menuntut tetapi kurang hangat, menekankan kepatuhan), PERMISIF (hangat tetapi kurang menuntut), dan TIDAK TERLIBAT (kurang hangat sekaligus kurang menuntut).","Hubungan gaya pengasuhan dan hasil perkembangan bersifat KORELASIONAL dan dipengaruhi budaya, sehingga tidak boleh ditafsirkan sebagai sebab-akibat sederhana."]},{"judul":"Perkembangan Psikososial dan Moral","poin":["Erik ERIKSON mengajukan delapan tahap psikososial, masing-masing dengan krisis khas yang perlu diselesaikan.","Bayi: TRUST vs MISTRUST - membangun rasa percaya dasar terhadap dunia melalui pengasuhan yang dapat diandalkan.","Balita: AUTONOMY vs SHAME AND DOUBT - belajar mandiri melakukan hal sendiri.","Prasekolah: INITIATIVE vs GUILT - berani memulai kegiatan dan rencana.","Usia sekolah: INDUSTRY vs INFERIORITY - mengembangkan rasa kompeten lewat pencapaian.","Remaja: IDENTITY vs ROLE CONFUSION - mencari jawaban atas 'siapa saya', krisis paling terkenal dari teori ini.","Dewasa awal: INTIMACY vs ISOLATION - membangun hubungan dekat yang bermakna.","Dewasa madya: GENERATIVITY vs STAGNATION - berkontribusi bagi generasi berikutnya.","Lansia: INTEGRITY vs DESPAIR - menerima perjalanan hidup dengan rasa puas atau justru penyesalan.","Lawrence KOHLBERG membagi penalaran moral menjadi tiga tingkat: PRAKONVENSIONAL (berorientasi hukuman dan imbalan), KONVENSIONAL (berorientasi persetujuan sosial dan aturan/hukum), dan PASCAKONVENSIONAL (berorientasi prinsip etis universal).","Kohlberg dikritik karena sampel awalnya hanya laki-laki dan cenderung bias budaya Barat. Carol Gilligan berargumen bahwa perempuan lebih sering menggunakan etika kepedulian (ethics of care), bukan semata keadilan abstrak."]},{"judul":"Remaja, Dewasa, dan Lansia","poin":["PUBERTAS ditandai kematangan seksual dan lonjakan pertumbuhan fisik. Perkembangan otak remaja tidak merata: sistem limbik (emosi dan pencarian sensasi) matang lebih dulu daripada korteks prefrontal (pengendalian impuls), yang menjelaskan kecenderungan mengambil risiko.","Remaja mengalami egosentrisme khas berupa imaginary audience (merasa terus diperhatikan orang) dan personal fable (merasa pengalamannya unik dan dirinya kebal risiko).","Pada masa dewasa awal dan madya, tugas perkembangan berpusat pada karier, hubungan intim, dan pengasuhan. Konsep 'krisis paruh baya' sebagai fenomena universal tidak didukung bukti kuat.","PENUAAN KOGNITIF bersifat selektif: kecepatan pemrosesan dan memori kerja cenderung menurun, sedangkan kosakata dan pengetahuan akumulatif (kecerdasan kristal) umumnya bertahan atau meningkat.","DEMENSIA bukan bagian normal dari penuaan, melainkan kondisi patologis. Alzheimer adalah penyebab paling umum.","Riset menunjukkan kesejahteraan emosional sering justru MENINGKAT pada usia lanjut, sebagian karena orang lebih memprioritaskan hubungan bermakna (teori selektivitas sosioemosional Carstensen).","Elisabeth Kubler-Ross menggambarkan lima reaksi terhadap kematian dan kehilangan (denial, anger, bargaining, depression, acceptance), meski riset menunjukkan urutannya tidak selalu berlaku secara kaku."]}],"ringkasan":["Perkembangan adalah interaksi nature dan nurture, bukan pilihan salah satu.","Piaget: sensorimotor (object permanence), praoperasional (egosentrisme), operasional konkret (konservasi), operasional formal (abstrak).","Vygotsky menambahkan peran sosial: zone of proximal development dan scaffolding.","Kelekatan aman terkait pengasuhan responsif; gaya pengasuhan otoritatif umumnya berhubungan dengan hasil paling positif.","Erikson memberi krisis khas tiap tahap; yang paling terkenal adalah identity vs role confusion pada remaja."],"tokoh":[{"nama":"Jean Piaget","kontribusi":"Teori empat tahap perkembangan kognitif anak."},{"nama":"Lev Vygotsky","kontribusi":"Menekankan peran sosial-budaya; konsep zone of proximal development dan scaffolding."},{"nama":"Erik Erikson","kontribusi":"Teori delapan tahap perkembangan psikososial sepanjang hayat."},{"nama":"Harry Harlow","kontribusi":"Eksperimen monyet rhesus; membuktikan pentingnya kenyamanan kontak bagi kelekatan."},{"nama":"John Bowlby","kontribusi":"Merumuskan teori kelekatan sebagai kebutuhan bawaan."},{"nama":"Mary Ainsworth","kontribusi":"Mengembangkan prosedur Strange Situation dan klasifikasi pola kelekatan."},{"nama":"Diana Baumrind","kontribusi":"Mengklasifikasikan gaya pengasuhan otoritatif, otoriter, dan permisif."},{"nama":"Lawrence Kohlberg","kontribusi":"Teori tiga tingkat perkembangan penalaran moral."}],"istilah":[{"term":"Object permanence","definisi":"Pemahaman bahwa objek tetap ada meski tidak terlihat."},{"term":"Konservasi","definisi":"Pemahaman bahwa kuantitas tetap sama meski bentuk atau wadahnya berubah."},{"term":"Egosentrisme","definisi":"Kesulitan anak praoperasional memahami sudut pandang orang lain."},{"term":"Asimilasi dan akomodasi","definisi":"Proses memasukkan pengalaman ke skema lama versus mengubah skema agar sesuai pengalaman baru."},{"term":"Zone of proximal development","definisi":"Rentang antara kemampuan mandiri anak dan kemampuannya dengan bantuan orang lain."},{"term":"Scaffolding","definisi":"Bantuan bertahap dari orang yang lebih mampu yang dikurangi seiring meningkatnya kemandirian anak."},{"term":"Kelekatan aman","definisi":"Pola kelekatan ketika anak menjadikan pengasuh sebagai basis aman untuk mengeksplorasi."},{"term":"Strange Situation","definisi":"Prosedur Ainsworth untuk mengukur pola kelekatan bayi terhadap pengasuh."},{"term":"Gaya pengasuhan otoritatif","definisi":"Pola asuh yang hangat namun tetap menetapkan batasan yang jelas disertai penjelasan."},{"term":"Krisis psikososial","definisi":"Konflik perkembangan khas pada tiap tahap kehidupan menurut Erikson."},{"term":"Periode kritis","definisi":"Rentang waktu ketika suatu pengalaman harus terjadi agar perkembangan normal tercapai."},{"term":"Teratogen","definisi":"Zat atau kondisi yang dapat merusak perkembangan janin."}],"quiz":[{"soal":"Kemampuan memahami bahwa mainan yang disembunyikan tetap ada disebut...","pilihan":["Konservasi","Object permanence","Egosentrisme","Skema"],"jawaban":2,"penjelasan":"Object permanence adalah pencapaian utama tahap sensorimotor menurut Piaget."},{"soal":"Anak usia 5 tahun mengira air menjadi lebih banyak setelah dipindah ke gelas yang lebih tinggi. Anak ini belum menguasai konsep...","pilihan":["Konservasi","Object permanence","Kelekatan","Skema"],"jawaban":1,"penjelasan":"Konservasi baru berkembang pada tahap operasional konkret, sekitar usia 7-11 tahun."},{"soal":"Rentang antara apa yang bisa dilakukan anak sendiri dan apa yang bisa dicapainya dengan bantuan disebut...","pilihan":["Periode kritis","Zone of proximal development","Konservasi","Asimilasi"],"jawaban":2,"penjelasan":"Konsep ZPD dari Vygotsky menekankan bahwa belajar optimal terjadi dengan bantuan orang yang lebih mampu."},{"soal":"Eksperimen Harry Harlow dengan monyet rhesus membuktikan bahwa kelekatan terutama didorong oleh...","pilihan":["Pemberian makanan","Kenyamanan kontak","Hukuman","Peniruan"],"jawaban":2,"penjelasan":"Bayi monyet lebih memilih induk kain yang nyaman disentuh daripada induk kawat yang menyediakan susu."},{"soal":"Menurut Erikson, krisis psikososial utama pada masa remaja adalah...","pilihan":["Trust vs mistrust","Identity vs role confusion","Intimacy vs isolation","Integrity vs despair"],"jawaban":2,"penjelasan":"Remaja menghadapi tugas utama membentuk identitas diri versus kebingungan peran."},{"soal":"Gaya pengasuhan yang hangat namun tetap menetapkan batasan jelas disertai penjelasan disebut gaya...","pilihan":["Otoriter","Permisif","Otoritatif","Tidak terlibat"],"jawaban":3,"penjelasan":"Gaya otoritatif menggabungkan kehangatan dengan tuntutan dan aturan yang konsisten."},{"soal":"Kecenderungan remaja mengambil risiko sebagian dijelaskan oleh...","pilihan":["Korteks prefrontal matang lebih dulu daripada sistem limbik","Sistem limbik matang lebih dulu daripada korteks prefrontal","Otak remaja sudah matang sepenuhnya","Tidak ada kaitannya dengan perkembangan otak"],"jawaban":2,"penjelasan":"Sistem limbik yang mengatur emosi dan pencarian sensasi matang lebih dulu, sementara korteks prefrontal pengendali impuls masih berkembang."},{"soal":"Menurut Kohlberg, penalaran moral yang berorientasi pada hukuman dan imbalan berada pada tingkat...","pilihan":["Prakonvensional","Konvensional","Pascakonvensional","Otoritatif"],"jawaban":1,"penjelasan":"Tingkat prakonvensional menilai benar-salah berdasarkan konsekuensi langsung berupa hukuman atau imbalan."},{"soal":"Zat atau kondisi yang dapat merusak perkembangan janin, seperti alkohol dan infeksi tertentu, disebut...","pilihan":["Teratogen","Skema","Diatesis","Neurotransmiter"],"jawaban":1,"penjelasan":"Periode embrionik (minggu 3-8), saat organ utama terbentuk, adalah masa paling rentan terhadap teratogen."},{"soal":"Menurut Piaget, mengubah skema lama agar sesuai dengan pengalaman baru disebut...","pilihan":["Asimilasi","Akomodasi","Konservasi","Egosentrisme"],"jawaban":2,"penjelasan":"Asimilasi memasukkan pengalaman baru ke skema yang sudah ada, sedangkan akomodasi mengubah skemanya agar cocok."}],"kasus":{"skenario":"Seorang anak berusia 4 tahun sedang menelepon neneknya. Sambil memegang gambar yang baru ia buat menghadap dirinya sendiri, ia berkata dengan antusias, 'Nek, lihat kan gambarnya bagus?' Ia tampak benar-benar yakin neneknya bisa melihat gambar tersebut lewat telepon.","pertanyaan":"Perilaku anak ini paling tepat menggambarkan ciri khas tahap perkembangan kognitif...","pilihan":["Sensorimotor","Praoperasional, khususnya egosentrisme","Operasional konkret","Operasional formal"],"jawaban":2,"penjelasan":"Egosentrisme adalah ciri khas tahap praoperasional: anak kesulitan memahami bahwa orang lain memiliki sudut pandang dan akses informasi yang berbeda dari dirinya."},"isian":[{"kalimat":"Tahap perkembangan kognitif Piaget ketika anak mulai mampu berpikir abstrak dan hipotetis disebut tahap ___.","jawaban":["operasional formal"]},{"kalimat":"Tokoh yang mengembangkan teori delapan tahap perkembangan psikososial sepanjang hayat adalah ___.","jawaban":["erikson","erik erikson"]},{"kalimat":"Pola asuh yang menuntut kepatuhan tinggi tanpa banyak kehangatan disebut gaya pengasuhan ___.","jawaban":["otoriter"]},{"kalimat":"Prosedur yang dikembangkan Mary Ainsworth untuk mengukur pola kelekatan bayi disebut ___ situation.","jawaban":["strange"]}]},{"nomor":10,"id":"ch10","judul":"Motivasi dan Emosi","ikon":"heart","pendahuluan":"Motivasi menjelaskan mengapa kita memulai, mengarahkan, dan mempertahankan suatu perilaku, sedangkan emosi adalah pengalaman afektif yang melibatkan komponen fisiologis, kognitif, dan ekspresif. Bab ini membahas teori-teori motivasi, motif lapar dan sosial, teori emosi, serta ekspresi emosi lintas budaya.","materi":[{"judul":"Teori-Teori Motivasi","poin":["TEORI INSTING memandang perilaku sebagai pola bawaan. Pendekatan ini ditinggalkan karena hanya melabeli perilaku tanpa benar-benar menjelaskannya.","TEORI DORONGAN (drive-reduction): kebutuhan biologis menciptakan ketegangan (drive) yang mendorong perilaku untuk memulihkan HOMEOSTASIS, yaitu keseimbangan internal tubuh.","Kelemahan teori dorongan: banyak perilaku manusia justru MENAMBAH ketegangan, misalnya naik roller coaster atau mendaki gunung.","TEORI AROUSAL: manusia termotivasi mempertahankan tingkat gairah OPTIMAL, tidak terlalu rendah dan tidak terlalu tinggi. Ini menjelaskan mengapa kita mencari stimulasi saat bosan.","HUKUM YERKES-DODSON: performa terbaik dicapai pada tingkat arousal SEDANG. Untuk tugas yang mudah, arousal optimalnya lebih tinggi; untuk tugas sulit, arousal optimalnya lebih rendah.","TEORI INSENTIF menekankan tarikan dari luar: perilaku didorong oleh imbalan yang menarik, bukan hanya dorongan dari dalam.","MOTIVASI INTRINSIK berasal dari dalam diri berupa minat dan kepuasan pribadi; MOTIVASI EKSTRINSIK berasal dari imbalan atau tekanan eksternal.","EFEK OVERJUSTIFICATION: memberi imbalan berlebihan pada aktivitas yang tadinya disukai justru dapat MENURUNKAN motivasi intrinsik terhadap aktivitas tersebut.","TEORI DETERMINASI DIRI (Deci & Ryan) menyebut tiga kebutuhan psikologis dasar: OTONOMI (merasa punya kendali), KOMPETENSI (merasa mampu), dan KETERHUBUNGAN (merasa terhubung dengan orang lain)."]},{"judul":"Hierarki Kebutuhan Maslow","poin":["Maslow menyusun kebutuhan manusia dalam piramida berjenjang, dari yang paling dasar hingga paling tinggi.","FISIOLOGIS: makan, minum, tidur, dan kebutuhan tubuh mendasar lainnya.","RASA AMAN: keamanan fisik, stabilitas finansial, dan keteraturan hidup.","CINTA DAN KEPEMILIKAN: hubungan, persahabatan, dan rasa diterima kelompok.","HARGA DIRI: penghargaan, pengakuan, pencapaian, dan rasa kompeten.","AKTUALISASI DIRI: mewujudkan potensi penuh diri sendiri; belakangan Maslow menambahkan transendensi diri di atasnya.","Gagasan utamanya: kebutuhan tingkat bawah cenderung dipenuhi lebih dulu sebelum yang lebih tinggi menjadi prioritas.","Kritik: urutan hierarki ini tidak selalu berlaku universal. Ada orang yang mengorbankan kebutuhan dasar demi nilai, cinta, atau keyakinan, dan urutannya bervariasi antar-budaya."]},{"judul":"Motif Lapar dan Motif Sosial","poin":["Lapar diatur oleh sinyal tubuh (kadar glukosa, hormon ghrelin yang memicu lapar dan leptin yang menandakan kenyang) serta oleh HIPOTALAMUS.","Faktor psikologis dan sosial sangat memengaruhi makan: ukuran porsi, variasi makanan, kehadiran orang lain, dan isyarat waktu.","TEORI SET POINT menyatakan tubuh cenderung mempertahankan berat badan tertentu, yang menjelaskan mengapa penurunan berat badan sering sulit dipertahankan.","KEBUTUHAN BERPRESTASI (need for achievement) adalah dorongan mencapai standar keunggulan; orang dengan kebutuhan berprestasi tinggi cenderung memilih tugas yang menantang namun realistis.","KEBUTUHAN AFILIASI adalah dorongan membangun dan mempertahankan hubungan sosial. Manusia memiliki kebutuhan mendasar untuk MEMILIKI (need to belong), dan penolakan sosial mengaktifkan area otak yang tumpang tindih dengan nyeri fisik."]},{"judul":"Komponen dan Teori Emosi","poin":["Emosi memiliki tiga komponen: FISIOLOGIS (jantung berdebar, berkeringat), KOGNITIF (penafsiran atas situasi), dan PERILAKU/EKSPRESIF (ekspresi wajah, nada suara, postur).","TEORI JAMES-LANGE: stimulus memicu reaksi FISIOLOGIS terlebih dahulu, lalu kita menafsirkan reaksi tubuh itu sebagai emosi. Ringkasnya: 'saya takut KARENA jantung saya berdebar'.","TEORI CANNON-BARD: reaksi fisiologis dan pengalaman emosi terjadi SECARA BERSAMAAN dan independen, karena talamus mengirim sinyal ke korteks dan ke tubuh sekaligus.","TEORI DUA FAKTOR SCHACHTER-SINGER: emosi = AROUSAL FISIOLOGIS + LABEL KOGNITIF. Tubuh memberi sinyal bahwa 'ada sesuatu terjadi', dan pikiran menentukan emosi apa itu berdasarkan konteks.","Eksperimen jembatan goyang menunjukkan MISATTRIBUTION OF AROUSAL: debaran jantung akibat ketinggian dapat keliru dilabeli sebagai ketertarikan romantis.","TEORI LAZARUS menekankan bahwa PENILAIAN KOGNITIF (appraisal) atas situasi terjadi lebih dulu dan menentukan emosi yang muncul.","Robert ZAJONC dan Joseph LeDoux berargumen sebagian respons emosional, terutama rasa takut, dapat muncul melalui jalur cepat menuju amigdala TANPA melewati pemrosesan kognitif sadar terlebih dahulu."]},{"judul":"Ekspresi Emosi dan Budaya","poin":["Paul EKMAN menemukan bahwa sejumlah ekspresi wajah dasar dikenali lintas budaya: senang, sedih, marah, takut, jijik, dan terkejut, yang mendukung adanya komponen universal dalam emosi.","Charles Darwin lebih dulu berargumen bahwa ekspresi emosi bersifat bawaan dan memiliki nilai adaptif untuk komunikasi.","ATURAN TAMPILAN (display rules) adalah norma budaya tentang kapan dan bagaimana emosi boleh ditampilkan. Karena itu budaya yang berbeda menampilkan emosi yang sama dengan cara berbeda.","HIPOTESIS UMPAN BALIK WAJAH (facial feedback): ekspresi wajah tidak hanya menampilkan emosi, tetapi juga dapat memperkuat pengalaman emosi itu sendiri. Hasil replikasi hipotesis ini beragam sehingga perlu disikapi hati-hati.","REGULASI EMOSI adalah kemampuan memengaruhi emosi yang muncul, kapan muncul, dan bagaimana diekspresikan. Strategi REAPPRAISAL (menafsirkan ulang situasi) umumnya lebih sehat daripada SUPPRESSION (menekan ekspresi emosi).","Emosi tidak selalu mengganggu rasionalitas; emosi membantu mengarahkan perhatian, mempercepat keputusan, dan memandu perilaku sosial."]}],"ringkasan":["Teori motivasi: dorongan (homeostasis), arousal optimal, insentif, hierarki Maslow, dan determinasi diri.","Yerkes-Dodson: performa terbaik pada arousal SEDANG; tugas sulit butuh arousal lebih rendah.","Imbalan berlebihan pada aktivitas yang disukai dapat menurunkan motivasi intrinsik (efek overjustification).","Tiga teori emosi: James-Lange (fisiologis dulu), Cannon-Bard (bersamaan), Schachter-Singer (arousal + label kognitif).","Ekspresi emosi dasar dikenali lintas budaya (Ekman), tetapi aturan tampilan berbeda tiap budaya."],"tokoh":[{"nama":"Abraham Maslow","kontribusi":"Menyusun hierarki kebutuhan dari fisiologis hingga aktualisasi diri."},{"nama":"William James & Carl Lange","kontribusi":"Teori emosi yang menempatkan reaksi fisiologis mendahului pengalaman emosi."},{"nama":"Walter Cannon & Philip Bard","kontribusi":"Teori bahwa reaksi fisiologis dan emosi terjadi bersamaan."},{"nama":"Schachter & Singer","kontribusi":"Teori dua faktor: emosi sebagai arousal ditambah label kognitif."},{"nama":"Richard Lazarus","kontribusi":"Menekankan peran penilaian kognitif (appraisal) dalam memunculkan emosi."},{"nama":"Paul Ekman","kontribusi":"Menemukan universalitas ekspresi wajah emosi dasar lintas budaya."},{"nama":"Deci & Ryan","kontribusi":"Teori determinasi diri: kebutuhan otonomi, kompetensi, dan keterhubungan."},{"nama":"Yerkes & Dodson","kontribusi":"Merumuskan hubungan lengkung antara tingkat arousal dan performa."}],"istilah":[{"term":"Motivasi intrinsik","definisi":"Dorongan berperilaku yang berasal dari minat dan kepuasan pribadi."},{"term":"Motivasi ekstrinsik","definisi":"Dorongan berperilaku karena imbalan atau tekanan dari luar."},{"term":"Homeostasis","definisi":"Kondisi keseimbangan internal tubuh yang cenderung dipertahankan."},{"term":"Hukum Yerkes-Dodson","definisi":"Prinsip bahwa performa optimal terjadi pada tingkat arousal sedang."},{"term":"Efek overjustification","definisi":"Menurunnya motivasi intrinsik akibat pemberian imbalan eksternal berlebihan."},{"term":"Teori determinasi diri","definisi":"Teori tentang tiga kebutuhan dasar: otonomi, kompetensi, dan keterhubungan."},{"term":"Hierarki kebutuhan Maslow","definisi":"Model kebutuhan manusia berjenjang dari fisiologis hingga aktualisasi diri."},{"term":"Teori dua faktor","definisi":"Teori Schachter-Singer bahwa emosi berasal dari arousal fisiologis ditambah label kognitif."},{"term":"Misattribution of arousal","definisi":"Kekeliruan melabeli sumber arousal fisiologis sebagai emosi tertentu."},{"term":"Aturan tampilan","definisi":"Norma budaya tentang kapan dan bagaimana emosi boleh diekspresikan."},{"term":"Reappraisal","definisi":"Strategi regulasi emosi dengan menafsirkan ulang makna suatu situasi."},{"term":"Set point","definisi":"Berat badan tertentu yang cenderung dipertahankan tubuh secara alami."}],"quiz":[{"soal":"Seorang siswa belajar giat karena benar-benar menikmati materinya, bukan demi nilai. Ini contoh motivasi...","pilihan":["Ekstrinsik","Intrinsik","Homeostatis","Insentif"],"jawaban":2,"penjelasan":"Motivasi intrinsik berasal dari minat dan kepuasan pribadi, bukan imbalan eksternal."},{"soal":"Menurut hierarki Maslow, kebutuhan yang paling dasar dan cenderung dipenuhi lebih dulu adalah...","pilihan":["Aktualisasi diri","Harga diri","Fisiologis","Cinta dan kepemilikan"],"jawaban":3,"penjelasan":"Kebutuhan fisiologis seperti makan dan minum berada di dasar piramida Maslow."},{"soal":"Teori emosi yang menyatakan reaksi fisiologis terjadi DULU lalu ditafsirkan sebagai emosi adalah teori...","pilihan":["Cannon-Bard","James-Lange","Schachter-Singer","Lazarus"],"jawaban":2,"penjelasan":"Teori James-Lange menyatakan kita merasa takut KARENA jantung berdebar, bukan sebaliknya."},{"soal":"Menurut teori dua faktor Schachter-Singer, emosi merupakan hasil dari...","pilihan":["Arousal fisiologis ditambah label kognitif atas situasi","Ekspresi wajah semata","Hierarki kebutuhan","Refleks bawaan"],"jawaban":1,"penjelasan":"Tubuh memberi sinyal arousal, lalu pikiran memberi label emosi berdasarkan konteks situasi."},{"soal":"Menurut hukum Yerkes-Dodson, performa terbaik umumnya terjadi pada tingkat arousal...","pilihan":["Sangat rendah","Sedang","Sangat tinggi","Nol"],"jawaban":2,"penjelasan":"Arousal terlalu rendah membuat kurang fokus, terlalu tinggi membuat cemas berlebihan; performa optimal ada di tengah."},{"soal":"Memberi hadiah uang pada anak yang tadinya suka membaca, lalu minatnya justru menurun, adalah contoh...","pilihan":["Efek overjustification","Homeostasis","Set point","Aturan tampilan"],"jawaban":1,"penjelasan":"Efek overjustification terjadi ketika imbalan eksternal menggeser dan menurunkan motivasi intrinsik."},{"soal":"Paul Ekman menemukan bahwa sejumlah ekspresi wajah emosi dasar...","pilihan":["Sepenuhnya dipelajari dari budaya masing-masing","Dikenali secara lintas budaya sehingga memiliki komponen universal","Hanya ada pada orang dewasa","Tidak berkaitan dengan emosi"],"jawaban":2,"penjelasan":"Ekman menemukan ekspresi seperti senang, sedih, marah, takut, jijik, dan terkejut dikenali di berbagai budaya."},{"soal":"Tiga kebutuhan psikologis dasar menurut teori determinasi diri adalah...","pilihan":["Makan, minum, tidur","Otonomi, kompetensi, keterhubungan","Id, ego, superego","Analitis, kreatif, praktis"],"jawaban":2,"penjelasan":"Deci dan Ryan menyebut otonomi, kompetensi, dan keterhubungan sebagai kebutuhan psikologis dasar manusia."},{"soal":"Kelemahan utama teori dorongan (drive-reduction) dalam menjelaskan motivasi manusia adalah...","pilihan":["Tidak menjelaskan kebutuhan biologis","Banyak perilaku manusia justru MENAMBAH ketegangan, misalnya naik roller coaster","Terlalu menekankan imbalan","Tidak dapat diuji sama sekali"],"jawaban":2,"penjelasan":"Teori dorongan sulit menjelaskan mengapa orang mencari sensasi yang justru meningkatkan arousal, bukan menurunkannya."},{"soal":"Strategi regulasi emosi yang umumnya lebih sehat menurut riset adalah...","pilihan":["Suppression, yaitu menekan ekspresi emosi","Reappraisal, yaitu menafsirkan ulang makna situasi","Menghindari semua situasi emosional","Memendam perasaan sendirian"],"jawaban":2,"penjelasan":"Reappraisal mengubah cara kita memaknai situasi dan umumnya berdampak lebih baik daripada sekadar menekan ekspresi emosi."}],"kasus":{"skenario":"Sebelum presentasi penting, seorang mahasiswa merasa jantungnya berdebar kencang dan telapak tangannya berkeringat. Karena menyadari bahwa ia sedang berada di situasi presentasi yang menegangkan, ia menafsirkan sensasi itu sebagai rasa gugup. Temannya yang mengalami sensasi fisik serupa saat akan naik panggung konser justru menafsirkannya sebagai antusiasme.","pertanyaan":"Perbedaan penafsiran atas sensasi fisik yang serupa ini paling sesuai dengan teori emosi...","pilihan":["James-Lange","Cannon-Bard","Schachter-Singer (teori dua faktor)","Teori insting"],"jawaban":3,"penjelasan":"Teori dua faktor menyatakan arousal fisiologis bersifat umum dan tidak spesifik; KONTEKS serta label kognitiflah yang menentukan emosi apa yang dirasakan. Arousal yang sama dilabeli 'gugup' atau 'antusias' tergantung penafsiran situasi."},"isian":[{"kalimat":"Kondisi keseimbangan internal tubuh yang berusaha dipertahankan organisme disebut ___.","jawaban":["homeostasis"]},{"kalimat":"Dorongan berperilaku karena hadiah atau imbalan eksternal disebut motivasi ___.","jawaban":["ekstrinsik"]},{"kalimat":"Menurut hukum Yerkes-Dodson, performa terbaik dicapai pada tingkat arousal ___.","jawaban":["sedang","menengah"]},{"kalimat":"Strategi regulasi emosi dengan menafsirkan ulang makna suatu situasi disebut ___.","jawaban":["reappraisal","penilaian ulang"]}]},{"nomor":11,"id":"ch11","judul":"Kepribadian","ikon":"id-badge","pendahuluan":"Kepribadian adalah pola pikiran, perasaan, dan perilaku yang khas dan relatif konsisten pada seseorang. Bab ini membahas pendekatan psikodinamik, humanistik, trait, sosial-kognitif, serta cara kepribadian diukur.","materi":[{"judul":"Pendekatan Psikodinamik: Freud","poin":["Freud memandang sebagian besar kehidupan mental berlangsung di ALAM BAWAH SADAR, di luar jangkauan kesadaran namun tetap memengaruhi perilaku.","ID beroperasi dengan prinsip kesenangan, berisi dorongan primitif yang menuntut pemuasan segera tanpa mempertimbangkan realitas atau moral.","EGO beroperasi dengan prinsip realitas, menjadi penengah yang mencari cara realistis memuaskan id tanpa melanggar batas.","SUPEREGO mewakili nilai moral dan hati nurani hasil internalisasi aturan orang tua dan masyarakat.","KECEMASAN muncul ketika ego kewalahan menengahi konflik antara id dan superego.","MEKANISME PERTAHANAN EGO adalah strategi bawah sadar untuk meredakan kecemasan: REPRESI (menekan ke bawah sadar), PROYEKSI (menuduhkan dorongan sendiri kepada orang lain), RASIONALISASI (mencari alasan yang tampak masuk akal), DISPLACEMENT (mengalihkan emosi ke sasaran yang lebih aman), REGRESI (kembali ke perilaku tahap sebelumnya), REACTION FORMATION (bersikap sebaliknya dari dorongan sebenarnya), dan SUBLIMASI (menyalurkan dorongan ke kegiatan yang diterima secara sosial).","Freud juga mengajukan tahap perkembangan psikoseksual (oral, anal, falik, laten, genital) dan berpendapat fiksasi pada suatu tahap memengaruhi kepribadian dewasa.","Kritik utama terhadap Freud: banyak konsepnya sulit diuji secara ilmiah, sampelnya terbatas, dan penekanannya pada seksualitas dinilai berlebihan. Namun gagasan tentang proses mental tak sadar dan mekanisme pertahanan tetap berpengaruh."]},{"judul":"Neo-Freudian","poin":["Carl JUNG mengajukan konsep ketidaksadaran KOLEKTIF, yaitu warisan pengalaman bersama umat manusia berupa ARKETIPE atau pola universal.","Alfred ADLER menekankan dorongan mengatasi RASA RENDAH DIRI (inferiority) dan pentingnya urutan kelahiran serta minat sosial.","Karen HORNEY menolak pandangan Freud yang bias gender dan menekankan KECEMASAN DASAR akibat rasa tidak aman pada masa kanak-kanak dalam relasi sosial.","Ciri umum neo-Freudian: tetap mengakui pentingnya bawah sadar, tetapi lebih menekankan faktor SOSIAL dan BUDAYA serta lebih optimistis dibanding Freud."]},{"judul":"Pendekatan Humanistik","poin":["Carl ROGERS menempatkan KONSEP DIRI (self-concept), yaitu pandangan seseorang tentang dirinya, sebagai pusat kepribadian.","Rogers membedakan DIRI IDEAL (ingin menjadi siapa) dan DIRI NYATA (siapa saya sekarang). Kesenjangan besar (INKONGRUENSI) antara keduanya menimbulkan ketidakpuasan dan masalah psikologis.","UNCONDITIONAL POSITIVE REGARD adalah penerimaan penuh tanpa syarat. Rogers menilai inilah kondisi yang memungkinkan seseorang tumbuh sehat dan jujur pada dirinya.","CONDITIONS OF WORTH terbentuk saat penerimaan diberikan hanya bila memenuhi syarat tertentu, sehingga orang belajar menyembunyikan bagian dirinya.","Abraham MASLOW mempelajari orang-orang yang teraktualisasi diri dan menemukan ciri seperti penerimaan diri, spontanitas, otonomi, hubungan mendalam dengan sedikit orang, dan pengalaman puncak (peak experience).","Kritik: konsep humanistik sulit diukur secara objektif dan dinilai terlalu optimistis tentang sifat manusia."]},{"judul":"Pendekatan Trait","poin":["Pendekatan trait berupaya mendeskripsikan kepribadian melalui dimensi sifat yang relatif stabil, bukan menjelaskan asal-usulnya.","Gordon Allport mengklasifikasikan trait menjadi kardinal, sentral, dan sekunder. Raymond Cattell menggunakan analisis faktor untuk memadatkannya menjadi 16 faktor.","Hans Eysenck mengusulkan dimensi utama ekstraversi-introversi dan stabilitas-neurotisisme.","MODEL LIMA BESAR (Big Five / OCEAN) kini paling banyak didukung bukti lintas budaya.","OPENNESS (keterbukaan pada pengalaman): imajinatif, ingin tahu, menyukai hal baru versus konvensional dan praktis.","CONSCIENTIOUSNESS (kehati-hatian): terorganisasi, disiplin, dan dapat diandalkan versus spontan dan kurang teratur. Dimensi ini paling konsisten memprediksi keberhasilan akademik dan kerja.","EXTRAVERSION (ekstraversi): mudah bergaul, energik, mencari stimulasi sosial versus pendiam dan lebih menyukai kesendirian.","AGREEABLENESS (keramahan): kooperatif, penuh empati, mudah percaya versus kompetitif dan skeptis.","NEUROTICISM (neurotisisme): cenderung cemas, mudah tertekan, dan reaktif secara emosional versus tenang dan stabil.","Trait Big Five relatif stabil pada masa dewasa, sebagian diwariskan secara genetik, dan dapat memprediksi berbagai hasil hidup.","DEBAT PERSON-SITUATION: Walter Mischel menunjukkan perilaku juga sangat dipengaruhi situasi. Kesimpulan modern: kepribadian dan situasi BERINTERAKSI, dan trait paling baik memprediksi pola perilaku rata-rata dalam jangka panjang, bukan tindakan tunggal pada satu momen."]},{"judul":"Pendekatan Sosial-Kognitif dan Biologis","poin":["Albert Bandura mengajukan DETERMINISME RESIPROKAL: perilaku, faktor pribadi (pikiran dan keyakinan), serta lingkungan saling memengaruhi secara timbal balik.","SELF-EFFICACY adalah keyakinan seseorang atas kemampuannya berhasil dalam situasi tertentu. Keyakinan ini memengaruhi pilihan tugas, usaha yang dikerahkan, dan ketahanan menghadapi kesulitan.","Julian Rotter membedakan LOCUS OF CONTROL internal (merasa hasil hidup ditentukan usaha sendiri) dan eksternal (merasa ditentukan nasib atau kekuatan luar).","Martin Seligman menemukan LEARNED HELPLESSNESS, yaitu kepasrahan yang dipelajari setelah berulang kali mengalami situasi yang tidak dapat dikendalikan.","Faktor BIOLOGIS: studi kembar menunjukkan sebagian besar trait kepribadian memiliki komponen keturunan yang substansial, meski lingkungan tetap berperan besar.","TEMPERAMEN yang tampak sejak bayi menjadi fondasi biologis bagi kepribadian dewasa.","Budaya juga membentuk kepribadian: budaya INDIVIDUALIS cenderung menekankan keunikan dan pencapaian pribadi, sedangkan budaya KOLEKTIVIS menekankan harmoni kelompok dan peran sosial."]},{"judul":"Pengukuran Kepribadian","poin":["INVENTORI OBJEKTIF menggunakan pertanyaan terstruktur dengan penskoran terstandar. Contohnya MMPI, yang banyak dipakai dalam konteks klinis, dan berbagai inventori berbasis Big Five.","Keunggulan inventori objektif: reliabilitas dan validitasnya dapat diuji secara statistik. Kelemahannya: responden dapat memberi jawaban yang tidak jujur atau sesuai citra yang diinginkan.","TES PROYEKTIF menggunakan stimulus ambigu dengan asumsi responden akan 'memproyeksikan' isi batinnya. Contohnya tes bercak tinta RORSCHACH dan TAT (Thematic Apperception Test).","Validitas dan reliabilitas tes proyektif jauh lebih diperdebatkan dibandingkan inventori objektif, karena penafsirannya sangat bergantung pada penilai.","Metode lain: laporan diri, laporan dari orang lain (informant report), dan observasi perilaku langsung.","Perlu diwaspadai EFEK BARNUM, yaitu kecenderungan menerima deskripsi kepribadian yang sangat umum sebagai gambaran akurat tentang diri sendiri. Inilah yang membuat horoskop dan tes kepribadian populer terasa 'akurat'."]}],"ringkasan":["Freud: id (kesenangan), ego (realitas), superego (moral); mekanisme pertahanan meredakan kecemasan.","Kenali mekanisme yang sering keluar di ujian: represi, proyeksi, rasionalisasi, displacement, sublimasi.","Rogers: konsep diri, inkongruensi diri ideal vs diri nyata, dan unconditional positive regard.","Big Five (OCEAN) adalah model trait dengan dukungan bukti terkuat; conscientiousness paling konsisten memprediksi performa.","Bandura: determinisme resiprokal dan self-efficacy. Perilaku = hasil interaksi kepribadian dan situasi."],"tokoh":[{"nama":"Sigmund Freud","kontribusi":"Struktur kepribadian id-ego-superego dan mekanisme pertahanan ego."},{"nama":"Carl Jung","kontribusi":"Konsep ketidaksadaran kolektif dan arketipe."},{"nama":"Alfred Adler","kontribusi":"Menekankan dorongan mengatasi rasa rendah diri dan minat sosial."},{"nama":"Karen Horney","kontribusi":"Mengkritik bias gender Freud; konsep kecemasan dasar."},{"nama":"Carl Rogers","kontribusi":"Konsep diri, inkongruensi, dan unconditional positive regard."},{"nama":"Gordon Allport & Raymond Cattell","kontribusi":"Perintis pendekatan trait dalam studi kepribadian."},{"nama":"Albert Bandura","kontribusi":"Determinisme resiprokal dan konsep self-efficacy."},{"nama":"Walter Mischel","kontribusi":"Memicu debat person-situation tentang konsistensi perilaku."}],"istilah":[{"term":"Id","definisi":"Bagian kepribadian berisi dorongan primitif yang menuntut pemuasan segera."},{"term":"Ego","definisi":"Bagian kepribadian yang menjadi penengah realistis antara id dan superego."},{"term":"Superego","definisi":"Bagian kepribadian yang mewakili nilai moral dan hati nurani."},{"term":"Mekanisme pertahanan ego","definisi":"Strategi bawah sadar untuk mengurangi kecemasan."},{"term":"Represi","definisi":"Menekan pikiran atau dorongan yang mengancam ke alam bawah sadar."},{"term":"Displacement","definisi":"Mengalihkan emosi dari sumber sebenarnya ke sasaran yang lebih aman."},{"term":"Konsep diri","definisi":"Pandangan dan persepsi seseorang tentang dirinya sendiri."},{"term":"Unconditional positive regard","definisi":"Penerimaan penuh terhadap seseorang tanpa syarat apa pun."},{"term":"Big Five (OCEAN)","definisi":"Model lima dimensi trait: Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism."},{"term":"Self-efficacy","definisi":"Keyakinan atas kemampuan diri untuk berhasil dalam situasi tertentu."},{"term":"Locus of control","definisi":"Keyakinan bahwa hasil hidup ditentukan usaha sendiri (internal) atau kekuatan luar (eksternal)."},{"term":"Tes proyektif","definisi":"Alat ukur kepribadian menggunakan stimulus ambigu untuk mengungkap isi batin."},{"term":"Efek Barnum","definisi":"Kecenderungan menerima deskripsi kepribadian yang sangat umum sebagai akurat tentang diri sendiri."}],"quiz":[{"soal":"Bagian kepribadian menurut Freud yang beroperasi berdasarkan prinsip kesenangan tanpa mempertimbangkan norma adalah...","pilihan":["Ego","Id","Superego","Konsep diri"],"jawaban":2,"penjelasan":"Id beroperasi dengan prinsip kesenangan dan menuntut pemuasan dorongan secara langsung."},{"soal":"Seseorang yang menyalahkan orang lain atas dorongan atau kesalahannya sendiri menggunakan mekanisme pertahanan...","pilihan":["Represi","Proyeksi","Rasionalisasi","Sublimasi"],"jawaban":2,"penjelasan":"Proyeksi adalah melimpahkan dorongan atau kesalahan diri sendiri kepada orang lain."},{"soal":"Menyalurkan dorongan agresif menjadi prestasi di cabang olahraga bela diri adalah contoh mekanisme...","pilihan":["Sublimasi","Represi","Regresi","Displacement"],"jawaban":1,"penjelasan":"Sublimasi menyalurkan dorongan yang tidak diterima secara sosial ke kegiatan yang produktif dan diterima."},{"soal":"Model kepribadian yang paling banyak didukung bukti lintas budaya saat ini adalah...","pilihan":["Id-Ego-Superego","Big Five (OCEAN)","Hierarki Maslow","Arketipe Jung"],"jawaban":2,"penjelasan":"Big Five atau OCEAN adalah model trait dengan dukungan empiris paling kuat dan konsisten lintas budaya."},{"soal":"Dimensi Big Five yang paling konsisten memprediksi keberhasilan akademik dan kerja adalah...","pilihan":["Openness","Conscientiousness","Extraversion","Neuroticism"],"jawaban":2,"penjelasan":"Conscientiousness yang mencerminkan kedisiplinan dan keteraturan paling konsisten memprediksi performa."},{"soal":"Keyakinan seseorang atas kemampuannya berhasil dalam situasi tertentu disebut...","pilihan":["Locus of control","Self-efficacy","Konsep diri","Superego"],"jawaban":2,"penjelasan":"Self-efficacy adalah konsep Bandura tentang keyakinan atas kemampuan diri dalam tugas tertentu."},{"soal":"Menurut Carl Rogers, penerimaan penuh terhadap seseorang tanpa syarat apa pun disebut...","pilihan":["Unconditional positive regard","Determinisme resiprokal","Sublimasi","Inkongruensi"],"jawaban":1,"penjelasan":"Unconditional positive regard adalah kondisi yang menurut Rogers memungkinkan pertumbuhan pribadi yang sehat."},{"soal":"Kecenderungan menerima deskripsi kepribadian yang sangat umum sebagai gambaran akurat tentang diri sendiri disebut...","pilihan":["Efek Barnum","Efek Flynn","Efek framing","Efek Hawthorne"],"jawaban":1,"penjelasan":"Efek Barnum menjelaskan mengapa horoskop dan tes kepribadian populer sering terasa sangat akurat."},{"soal":"Menurut Carl Rogers, kesenjangan besar antara diri ideal dan diri nyata disebut...","pilihan":["Inkongruensi","Sublimasi","Determinisme resiprokal","Arketipe"],"jawaban":1,"penjelasan":"Inkongruensi antara siapa yang ingin kita jadi dan siapa kita sekarang menimbulkan ketidakpuasan dan masalah psikologis."},{"soal":"Debat person-situation yang dipicu Walter Mischel berakhir pada kesimpulan bahwa...","pilihan":["Hanya kepribadian yang menentukan perilaku","Hanya situasi yang menentukan perilaku","Kepribadian dan situasi saling berinteraksi","Perilaku sepenuhnya acak"],"jawaban":3,"penjelasan":"Trait paling baik memprediksi pola perilaku rata-rata dalam jangka panjang, sementara situasi sangat memengaruhi tindakan pada momen tertentu."}],"kasus":{"skenario":"Seorang karyawan dimarahi habis-habisan oleh atasannya di depan rekan kerja. Ia tidak berani membalas dan hanya diam. Sesampainya di rumah, ia membentak adiknya karena hal sepele yang biasanya tidak pernah ia permasalahkan.","pertanyaan":"Perilaku karyawan ini paling sesuai dengan mekanisme pertahanan ego yang disebut...","pilihan":["Proyeksi","Displacement (pengalihan)","Rasionalisasi","Represi"],"jawaban":2,"penjelasan":"Displacement adalah pengalihan emosi dari sumber sebenarnya, yaitu atasan yang berkuasa dan berisiko dilawan, ke sasaran yang dianggap lebih aman, yaitu adiknya."},"isian":[{"kalimat":"Bagian kepribadian yang berperan sebagai penengah realistis antara id dan superego disebut ___.","jawaban":["ego"]},{"kalimat":"Dimensi Big Five yang menggambarkan kecenderungan cemas dan tidak stabil secara emosional adalah ___.","jawaban":["neuroticism","neurotisisme"]},{"kalimat":"Pandangan seseorang mengenai dirinya sendiri disebut ___.","jawaban":["konsep diri"]},{"kalimat":"Keyakinan atas kemampuan diri untuk berhasil dalam situasi tertentu disebut ___.","jawaban":["self-efficacy","self efficacy","efikasi diri"]}]},{"nomor":12,"id":"ch12","judul":"Psikologi Sosial","ikon":"users","pendahuluan":"Psikologi sosial mengkaji bagaimana pikiran, perasaan, dan perilaku individu dipengaruhi oleh kehadiran orang lain, baik yang nyata maupun yang dibayangkan. Bab ini membahas atribusi, sikap, konformitas, kepatuhan, dinamika kelompok, prasangka, agresi, dan perilaku menolong.","materi":[{"judul":"Atribusi dan Kognisi Sosial","poin":["ATRIBUSI adalah proses menjelaskan sebab suatu perilaku, apakah karena faktor DISPOSISIONAL/internal (kepribadian, sifat) atau SITUASIONAL/eksternal (keadaan, tekanan lingkungan).","FUNDAMENTAL ATTRIBUTION ERROR adalah kecenderungan melebih-lebihkan faktor internal dan meremehkan faktor situasional saat menjelaskan perilaku ORANG LAIN.","ACTOR-OBSERVER BIAS: kita menjelaskan perilaku diri sendiri lewat situasi ('saya terlambat karena macet') tetapi perilaku orang lain lewat kepribadian ('dia terlambat karena pemalas').","SELF-SERVING BIAS: kita mengatribusikan keberhasilan pada kemampuan diri dan kegagalan pada faktor luar.","Kesalahan atribusi lebih sering ditemukan pada budaya INDIVIDUALIS. Budaya KOLEKTIVIS cenderung lebih peka terhadap konteks situasional.","JUST-WORLD HYPOTHESIS adalah keyakinan bahwa dunia itu adil sehingga orang mendapat apa yang pantas ia terima. Keyakinan ini dapat berujung pada menyalahkan korban (victim blaming)."]},{"judul":"Sikap dan Perubahan Sikap","poin":["SIKAP adalah evaluasi terhadap orang, objek, atau gagasan, yang mencakup komponen afektif (perasaan), behavioral (kecenderungan bertindak), dan kognitif (keyakinan).","Sikap tidak selalu memprediksi perilaku. Sikap paling kuat memprediksi perilaku ketika sikapnya spesifik, kuat, mudah diingat, dan tekanan luar minimal.","DISONANSI KOGNITIF (Leon Festinger) adalah ketidaknyamanan psikologis akibat ketidaksesuaian antara sikap dan perilaku. Untuk meredakannya, orang cenderung mengubah sikapnya agar selaras dengan perilaku yang sudah terlanjur dilakukan.","Eksperimen klasik Festinger: partisipan yang dibayar SEDIKIT untuk berbohong justru lebih mengubah sikapnya menjadi menyukai tugas membosankan, karena tidak punya pembenaran eksternal yang memadai.","PERSUASI melalui RUTE SENTRAL berfokus pada kualitas argumen dan menghasilkan perubahan sikap yang lebih tahan lama; RUTE PERIFER mengandalkan isyarat dangkal seperti daya tarik pembicara dan menghasilkan perubahan yang lebih rapuh.","Teknik FOOT-IN-THE-DOOR: permintaan kecil yang disetujui membuat orang lebih mungkin menyetujui permintaan besar berikutnya."]},{"judul":"Konformitas dan Kepatuhan","poin":["KONFORMITAS adalah penyesuaian perilaku atau pendapat agar sesuai dengan kelompok.","Eksperimen garis Solomon ASCH menunjukkan sekitar sepertiga respons partisipan mengikuti jawaban kelompok yang jelas-jelas keliru.","PENGARUH NORMATIF: kita menyesuaikan diri agar diterima dan tidak ditolak kelompok. PENGARUH INFORMASIONAL: kita mengikuti kelompok karena percaya mereka memiliki informasi lebih tepat, terutama dalam situasi ambigu.","Konformitas meningkat bila kelompok berjumlah tiga orang atau lebih, bersuara bulat, memiliki status tinggi, dan jawaban disampaikan secara terbuka. Kehadiran SATU orang yang berbeda pendapat saja sudah sangat menurunkan konformitas.","KEPATUHAN (obedience) adalah mengikuti perintah figur otoritas. Eksperimen Stanley MILGRAM menemukan sekitar 65 persen partisipan bersedia memberikan sengatan listrik pada tingkat maksimum karena diperintah peneliti.","Faktor yang meningkatkan kepatuhan: otoritas tampak sah dan hadir secara fisik, ada institusi bergengsi yang mendukung, korban berada jauh atau tidak terlihat, serta tidak ada teladan yang menolak.","Pelajaran utama Milgram: perilaku merugikan sering lebih ditentukan oleh KEKUATAN SITUASI daripada oleh kepribadian jahat individu."]},{"judul":"Perilaku dalam Kelompok","poin":["FASILITASI SOSIAL: kehadiran orang lain MENINGKATKAN performa pada tugas yang mudah atau sudah dikuasai, tetapi MENURUNKAN performa pada tugas yang sulit atau baru.","SOCIAL LOAFING: usaha individu menurun saat bekerja dalam kelompok karena kontribusinya tidak terlihat jelas dan tanggung jawab terasa tersebar.","Social loafing dapat dikurangi dengan membuat kontribusi tiap anggota terlihat, menetapkan peran yang jelas, dan menjaga ukuran kelompok tetap kecil.","DEINDIVIDUASI: hilangnya kesadaran diri dan rasa tanggung jawab personal dalam kelompok besar atau situasi anonim, yang dapat memicu perilaku impulsif dan agresif.","GROUPTHINK: kelompok yang sangat kompak dan menghindari konflik dapat mengambil keputusan buruk karena menekan pendapat berbeda. Pencegahannya: mendorong kritik, menunjuk devil's advocate, dan meminta masukan dari luar.","POLARISASI KELOMPOK: diskusi dengan orang yang berpandangan serupa cenderung MENGUATKAN pandangan awal kelompok menjadi lebih ekstrem."]},{"judul":"Prasangka, Stereotip, dan Diskriminasi","poin":["STEREOTIP adalah keyakinan umum tentang suatu kelompok (komponen kognitif), PRASANGKA adalah sikap dan perasaan negatif terhadap kelompok (komponen afektif), dan DISKRIMINASI adalah perilaku negatif yang nyata (komponen behavioral).","IN-GROUP BIAS: kecenderungan menilai kelompok sendiri lebih positif. OUT-GROUP HOMOGENEITY: memandang anggota kelompok lain sebagai 'semuanya sama saja', padahal kelompok sendiri terasa beragam.","Prasangka dapat bersifat eksplisit (disadari) maupun IMPLISIT (otomatis dan tidak disadari).","Eksperimen Robbers Cave (Sherif) menunjukkan kompetisi antar-kelompok dengan cepat memunculkan permusuhan, dan permusuhan itu mereda ketika kedua kelompok harus bekerja sama mencapai TUJUAN SUPERORDINAT.","HIPOTESIS KONTAK: prasangka dapat berkurang lewat kontak antar-kelompok, dengan syarat status setara, tujuan bersama, kerja sama, dan dukungan otoritas atau norma sosial."]},{"judul":"Agresi dan Perilaku Menolong","poin":["AGRESI dipengaruhi faktor biologis (genetik, hormon, aktivitas amigdala), psikologis (frustrasi, provokasi), dan sosial (norma, model perilaku, paparan kekerasan).","HIPOTESIS FRUSTRASI-AGRESI menyatakan frustrasi meningkatkan kemungkinan agresi, terutama bila ada isyarat pemicu di lingkungan.","PERILAKU PROSOSIAL adalah tindakan yang menguntungkan orang lain; ALTRUISME adalah menolong tanpa mengharapkan imbalan apa pun.","BYSTANDER EFFECT: makin banyak orang yang menyaksikan situasi darurat, makin kecil kemungkinan seseorang bertindak menolong. Penyebab utamanya adalah DIFUSI TANGGUNG JAWAB dan ketidaktahuan pluralistik, yaitu setiap orang menyimpulkan situasi tidak darurat karena melihat orang lain diam.","Latane dan Darley merumuskan lima langkah menolong: menyadari kejadian, menafsirkannya sebagai darurat, merasa bertanggung jawab, tahu cara menolong, dan memutuskan bertindak. Kegagalan pada salah satu langkah membuat pertolongan tidak terjadi.","Cara efektif meminta bantuan dalam keadaan darurat adalah MENUNJUK orang secara spesifik, misalnya 'Bapak berbaju biru, tolong panggil ambulans', karena ini mematahkan difusi tanggung jawab.","Faktor yang meningkatkan pertolongan: suasana hati positif, kemiripan dengan korban, adanya teladan yang menolong, waktu yang tidak terburu-buru, dan situasi yang jelas."]}],"ringkasan":["Fundamental attribution error: melebihkan faktor kepribadian, meremehkan situasi - saat menilai ORANG LAIN.","Disonansi kognitif mendorong perubahan sikap agar selaras dengan perilaku yang sudah dilakukan.","Asch = konformitas (tekanan kelompok); Milgram = kepatuhan (perintah otoritas).","Dalam kelompok: fasilitasi sosial, social loafing, deindividuasi, groupthink, dan polarisasi.","Bystander effect muncul dari difusi tanggung jawab - patahkan dengan MENUNJUK orang secara spesifik."],"tokoh":[{"nama":"Solomon Asch","kontribusi":"Eksperimen garis yang menunjukkan kekuatan konformitas kelompok."},{"nama":"Stanley Milgram","kontribusi":"Eksperimen kepatuhan terhadap otoritas yang mengejutkan dunia psikologi."},{"nama":"Leon Festinger","kontribusi":"Teori disonansi kognitif tentang ketidaksesuaian sikap dan perilaku."},{"nama":"Philip Zimbardo","kontribusi":"Stanford Prison Experiment tentang kekuatan peran sosial (kini banyak dikritik metodologinya)."},{"nama":"Latane & Darley","kontribusi":"Riset bystander effect dan model lima langkah perilaku menolong."},{"nama":"Muzafer Sherif","kontribusi":"Eksperimen Robbers Cave tentang konflik antar-kelompok dan tujuan superordinat."},{"nama":"Irving Janis","kontribusi":"Merumuskan konsep groupthink dalam pengambilan keputusan kelompok."}],"istilah":[{"term":"Fundamental attribution error","definisi":"Melebih-lebihkan faktor kepribadian dan meremehkan situasi saat menilai perilaku orang lain."},{"term":"Self-serving bias","definisi":"Mengatribusikan keberhasilan pada diri sendiri dan kegagalan pada faktor luar."},{"term":"Disonansi kognitif","definisi":"Ketidaknyamanan psikologis akibat sikap dan perilaku yang bertentangan."},{"term":"Konformitas","definisi":"Penyesuaian perilaku atau pendapat agar sesuai dengan norma kelompok."},{"term":"Pengaruh normatif","definisi":"Menyesuaikan diri dengan kelompok agar diterima dan tidak ditolak."},{"term":"Pengaruh informasional","definisi":"Mengikuti kelompok karena menganggap mereka memiliki informasi lebih tepat."},{"term":"Kepatuhan (obedience)","definisi":"Mengikuti perintah dari figur otoritas."},{"term":"Fasilitasi sosial","definisi":"Peningkatan performa pada tugas mudah akibat kehadiran orang lain."},{"term":"Social loafing","definisi":"Menurunnya usaha individu saat bekerja dalam kelompok."},{"term":"Deindividuasi","definisi":"Hilangnya kesadaran diri dan tanggung jawab personal dalam situasi kelompok atau anonim."},{"term":"Groupthink","definisi":"Pengambilan keputusan buruk akibat kelompok menekan pendapat berbeda demi kekompakan."},{"term":"Bystander effect","definisi":"Berkurangnya kemungkinan menolong ketika banyak orang lain turut menyaksikan."},{"term":"Difusi tanggung jawab","definisi":"Perasaan bahwa tanggung jawab bertindak terbagi ke banyak orang lain."},{"term":"Hipotesis kontak","definisi":"Gagasan bahwa kontak antar-kelompok dengan syarat tertentu dapat mengurangi prasangka."}],"quiz":[{"soal":"Menganggap teman terlambat karena 'memang pemalas' padahal ia terjebak macet parah adalah contoh...","pilihan":["Disonansi kognitif","Fundamental attribution error","Bystander effect","Groupthink"],"jawaban":2,"penjelasan":"Ini melebih-lebihkan faktor kepribadian (pemalas) sambil mengabaikan faktor situasi (macet)."},{"soal":"Eksperimen garis Solomon Asch paling erat kaitannya dengan fenomena...","pilihan":["Kepatuhan","Konformitas","Bystander effect","Disonansi kognitif"],"jawaban":2,"penjelasan":"Asch menunjukkan orang cenderung menyesuaikan jawaban dengan kelompok meski jawaban kelompok jelas keliru."},{"soal":"Dalam eksperimen Milgram, faktor yang PALING meningkatkan kepatuhan partisipan adalah...","pilihan":["Korban berada di ruangan yang sama","Otoritas tampak sah dan hadir secara fisik","Ada partisipan lain yang menolak","Peneliti memberi imbalan besar"],"jawaban":2,"penjelasan":"Kehadiran fisik otoritas yang tampak sah dan didukung institusi bergengsi sangat meningkatkan kepatuhan."},{"soal":"Ketidaknyamanan psikologis yang muncul ketika perilaku bertentangan dengan sikap seseorang disebut...","pilihan":["Disonansi kognitif","Stereotip","Deindividuasi","Polarisasi"],"jawaban":1,"penjelasan":"Disonansi kognitif mendorong seseorang mengubah sikap atau perilaku agar keduanya kembali selaras."},{"soal":"Semakin banyak orang menyaksikan seseorang pingsan, semakin kecil kemungkinan ada yang menolong. Ini disebut...","pilihan":["Social loafing","Bystander effect","Fasilitasi sosial","Groupthink"],"jawaban":2,"penjelasan":"Bystander effect terjadi terutama karena difusi tanggung jawab dan ketidaktahuan pluralistik."},{"soal":"Kelompok yang sangat kompak mengambil keputusan buruk karena menekan pendapat berbeda mengalami...","pilihan":["Groupthink","Fasilitasi sosial","Deindividuasi","In-group bias"],"jawaban":1,"penjelasan":"Groupthink terjadi ketika keinginan menjaga kekompakan mengalahkan evaluasi kritis atas pilihan yang ada."},{"soal":"Eksperimen Robbers Cave menunjukkan permusuhan antar-kelompok paling efektif diredakan dengan...","pilihan":["Memisahkan kedua kelompok sepenuhnya","Memberi tujuan superordinat yang menuntut kerja sama","Menambah kompetisi antar-kelompok","Memberi hadiah pada kelompok pemenang"],"jawaban":2,"penjelasan":"Tujuan superordinat hanya dapat dicapai bila kedua kelompok bekerja sama, sehingga permusuhan mereda."},{"soal":"Cara paling efektif meminta pertolongan dalam keadaan darurat di tengah keramaian adalah...","pilihan":["Berteriak minta tolong secara umum","Menunjuk satu orang secara spesifik dan memberi instruksi jelas","Menunggu ada yang berinisiatif","Menelepon sendiri tanpa meminta bantuan"],"jawaban":2,"penjelasan":"Menunjuk orang secara spesifik mematahkan difusi tanggung jawab, sehingga orang tersebut merasa bertanggung jawab langsung."},{"soal":"Kecenderungan menjelaskan keterlambatan diri sendiri lewat situasi tetapi keterlambatan orang lain lewat kepribadian disebut...","pilihan":["Actor-observer bias","Self-serving bias","Groupthink","Deindividuasi"],"jawaban":1,"penjelasan":"Actor-observer bias membuat kita lebih peka pada faktor situasional saat menilai diri sendiri dibanding saat menilai orang lain."},{"soal":"Persuasi melalui rute sentral menghasilkan perubahan sikap yang...","pilihan":["Lebih rapuh karena mengandalkan daya tarik pembicara","Lebih tahan lama karena berfokus pada kualitas argumen","Tidak pernah berhasil","Hanya berlaku pada anak-anak"],"jawaban":2,"penjelasan":"Rute sentral memproses kualitas argumen secara mendalam sehingga perubahan sikapnya lebih bertahan dibanding rute periferal."}],"kasus":{"skenario":"Dalam sebuah tugas kelompok beranggotakan delapan mahasiswa, seorang anggota merasa kontribusinya 'tidak akan terlalu kelihatan' karena hasil akhirnya dinilai secara kolektif. Ia pun bekerja jauh lebih santai dibanding ketika mengerjakan tugas individu.","pertanyaan":"Fenomena ini disebut ___, dan cara paling tepat menguranginya adalah ___.","pilihan":["Fasilitasi sosial; memperbesar ukuran kelompok","Social loafing; membuat kontribusi tiap anggota terlihat jelas dan memberi peran spesifik","Bystander effect; menambah jumlah anggota","Groupthink; menghindari kritik dalam kelompok"],"jawaban":2,"penjelasan":"Social loafing muncul ketika kontribusi individu tidak terlihat dan tanggung jawab terasa tersebar. Solusinya adalah membuat kontribusi tiap anggota dapat diidentifikasi, memberi peran yang jelas, dan menjaga kelompok tetap kecil."},"isian":[{"kalimat":"Generalisasi tentang suatu kelompok tanpa memperhitungkan variasi individu disebut ___.","jawaban":["stereotip"]},{"kalimat":"Kecenderungan mengikuti norma atau tekanan kelompok disebut ___.","jawaban":["konformitas"]},{"kalimat":"Penurunan usaha individu saat bekerja dalam kelompok karena tanggung jawab tersebar disebut ___.","jawaban":["social loafing"]},{"kalimat":"Pengambilan keputusan buruk akibat kelompok menekan pendapat berbeda demi kekompakan disebut ___.","jawaban":["groupthink"]}]},{"nomor":13,"id":"ch13","judul":"Psikologi Industri dan Organisasi","ikon":"briefcase","pendahuluan":"Psikologi Industri dan Organisasi (PIO) menerapkan prinsip psikologi di dunia kerja. Bab ini membahas tiga wilayah utamanya: psikologi industri (rekrutmen, seleksi, penilaian kinerja), psikologi organisasi (motivasi, kepuasan kerja, kepemimpinan), dan faktor manusia (desain kerja yang sesuai kemampuan manusia).","materi":[{"judul":"Ruang Lingkup Psikologi Industri-Organisasi","poin":["PSIKOLOGI INDUSTRI berfokus pada pengelolaan sumber daya manusia: analisis jabatan, rekrutmen, seleksi, pelatihan, dan penilaian kinerja.","PSIKOLOGI ORGANISASI berfokus pada perilaku manusia dalam organisasi: motivasi, kepuasan kerja, kepemimpinan, budaya, dan dinamika tim.","FAKTOR MANUSIA (human factors/ergonomi) berfokus pada perancangan alat, sistem, dan lingkungan kerja agar sesuai dengan kemampuan dan keterbatasan manusia.","Akar historis: studi Hawthorne pada 1920-1930-an awalnya meneliti pengaruh pencahayaan terhadap produktivitas, namun justru menemukan bahwa PERHATIAN terhadap pekerja lebih berpengaruh. Fenomena ini dikenal sebagai EFEK HAWTHORNE.","Manajemen ilmiah Frederick Taylor menekankan efisiensi gerakan kerja, tetapi dikritik karena mengabaikan aspek psikologis dan sosial pekerja."]},{"judul":"Analisis Jabatan, Rekrutmen, dan Seleksi","poin":["ANALISIS JABATAN (job analysis) mengidentifikasi tugas-tugas suatu posisi serta pengetahuan, keterampilan, dan kemampuan (KSA) yang dibutuhkan. Ini menjadi dasar bagi hampir semua proses PIO lainnya.","Hasil analisis jabatan dituangkan menjadi deskripsi jabatan (apa yang dikerjakan) dan spesifikasi jabatan (kualifikasi yang dibutuhkan).","WAWANCARA TERSTRUKTUR, di mana semua kandidat ditanya pertanyaan sama dengan panduan penilaian yang jelas, terbukti JAUH lebih valid memprediksi kinerja daripada wawancara bebas.","Metode seleksi dengan validitas prediktif tinggi antara lain tes kemampuan kognitif umum, sampel kerja (work sample), dan wawancara terstruktur.","Kesalahan umum dalam wawancara: efek halo (satu kesan positif memengaruhi seluruh penilaian), kesan pertama yang berlebihan, dan bias kemiripan dengan pewawancara.","Proses seleksi harus ADIL dan tidak diskriminatif, serta menggunakan alat ukur yang reliabel dan valid untuk pekerjaan yang bersangkutan."]},{"judul":"Pelatihan dan Penilaian Kinerja","poin":["Pelatihan yang efektif dimulai dari ANALISIS KEBUTUHAN pelatihan, dilanjutkan perancangan program, pelaksanaan, dan evaluasi hasil.","TRANSFER PELATIHAN, yaitu sejauh mana keterampilan yang dipelajari benar-benar diterapkan di pekerjaan, adalah ukuran keberhasilan yang sesungguhnya.","PENILAIAN KINERJA (performance appraisal) berfungsi untuk umpan balik pengembangan sekaligus dasar keputusan administratif seperti promosi dan kompensasi.","Sumber kesalahan penilaian: EFEK HALO, LENIENCY (terlalu murah hati), STRICTNESS (terlalu keras), CENTRAL TENDENCY (semua dinilai rata-rata), dan RECENCY (hanya mengingat kejadian terbaru).","UMPAN BALIK 360 DERAJAT mengumpulkan penilaian dari atasan, rekan sejawat, bawahan, dan diri sendiri untuk memberi gambaran yang lebih menyeluruh.","Umpan balik paling efektif bila spesifik, berfokus pada perilaku bukan pribadi, diberikan tepat waktu, dan disertai arah perbaikan yang jelas."]},{"judul":"Motivasi dan Kepuasan Kerja","poin":["TEORI DUA FAKTOR HERZBERG membedakan FAKTOR HIGIENE (gaji, kondisi kerja, kebijakan) yang bila tidak terpenuhi menimbulkan ketidakpuasan, dan MOTIVATOR (pencapaian, pengakuan, tanggung jawab, pertumbuhan) yang benar-benar mendorong kepuasan.","Implikasinya: menaikkan gaji dapat menghilangkan ketidakpuasan, tetapi belum tentu menciptakan motivasi sejati.","TEORI PENETAPAN TUJUAN (Locke & Latham): tujuan yang SPESIFIK dan MENANTANG namun realistis, disertai umpan balik dan penerimaan dari pekerja, menghasilkan performa lebih tinggi daripada tujuan samar seperti 'lakukan yang terbaik'.","TEORI KEADILAN (equity theory): pekerja membandingkan rasio masukan dan hasil dirinya dengan rekan lain. Rasa tidak adil menurunkan motivasi meski kompensasi absolutnya sebenarnya baik.","TEORI HARAPAN (expectancy theory): motivasi bergantung pada keyakinan bahwa usaha menghasilkan kinerja, kinerja menghasilkan imbalan, dan imbalan itu bernilai bagi dirinya.","MODEL KARAKTERISTIK PEKERJAAN (Hackman & Oldham): pekerjaan lebih memotivasi bila memiliki variasi keterampilan, identitas tugas, signifikansi tugas, otonomi, dan umpan balik.","KEPUASAN KERJA dipengaruhi kesesuaian nilai pribadi dengan pekerjaan, hubungan dengan rekan dan atasan, keadilan, otonomi, serta peluang berkembang.","Hubungan kepuasan kerja dengan produktivitas nyata namun MODERAT. Kepuasan kerja lebih kuat memprediksi tingkat absensi, turnover, dan perilaku warga organisasi (OCB)."]},{"judul":"Kepemimpinan dan Budaya Organisasi","poin":["Pendekatan TRAIT mencari ciri pemimpin efektif. Temuannya lemah bila berdiri sendiri, meski beberapa ciri seperti kecerdasan, conscientiousness, dan ekstraversi berkorelasi positif.","Pendekatan PERILAKU membedakan orientasi TUGAS (mengatur, menargetkan, menstrukturkan) dan orientasi HUBUNGAN (mendukung, memperhatikan kesejahteraan anggota).","TEORI KONTINGENSI menegaskan tidak ada satu gaya terbaik; efektivitas bergantung pada kecocokan gaya pemimpin dengan situasi yang dihadapi.","KEPEMIMPINAN TRANSAKSIONAL bekerja lewat pertukaran: imbalan untuk kinerja, koreksi untuk kesalahan. Efektif menjaga kestabilan operasional.","KEPEMIMPINAN TRANSFORMASIONAL menginspirasi lewat visi bersama, stimulasi intelektual, dan perhatian individual. Umumnya lebih berkaitan dengan komitmen, inovasi, dan kepuasan yang lebih tinggi.","KEPEMIMPINAN LAISSEZ-FAIRE yang membiarkan tanpa arahan umumnya paling tidak efektif.","BUDAYA ORGANISASI adalah nilai, asumsi, dan norma bersama yang membentuk cara kerja. Budaya yang selaras dengan strategi organisasi mendukung kinerja, sedangkan budaya yang tidak sehat dapat merusaknya.","PERSON-ORGANIZATION FIT, yaitu kesesuaian nilai individu dengan nilai organisasi, berkaitan dengan kepuasan dan retensi karyawan."]},{"judul":"Tim Kerja, Stres Kerja, dan Faktor Manusia","poin":["Tim efektif memiliki tujuan yang jelas, peran yang terdefinisi, saling percaya, komunikasi terbuka, dan KESELAMATAN PSIKOLOGIS, yaitu keyakinan bahwa anggota aman mengemukakan pendapat atau mengakui kesalahan.","Konflik TUGAS dalam kadar sedang dapat meningkatkan kualitas keputusan, sedangkan konflik RELASIONAL hampir selalu merusak kinerja tim.","STRES KERJA dipicu beban kerja berlebih, ambiguitas peran, konflik peran, rendahnya kendali atas pekerjaan, dan hubungan kerja yang buruk.","MODEL DEMAND-CONTROL: kombinasi tuntutan tinggi dengan kendali rendah adalah kondisi paling merusak bagi kesehatan pekerja.","BURNOUT memiliki tiga komponen: kelelahan emosional, sinisme atau depersonalisasi, dan menurunnya rasa pencapaian diri.","WORK-LIFE BALANCE dan dukungan sosial di tempat kerja adalah faktor pelindung penting terhadap stres kerja.","FAKTOR MANUSIA merancang antarmuka, alat, dan prosedur agar meminimalkan kesalahan manusia - misalnya penempatan tombol darurat, desain kokpit pesawat, dan tata letak alat medis."]}],"ringkasan":["PIO mencakup psikologi industri (SDM), psikologi organisasi (perilaku kerja), dan faktor manusia (desain kerja).","Analisis jabatan adalah fondasi seleksi, pelatihan, dan penilaian kinerja.","Wawancara TERSTRUKTUR jauh lebih valid memprediksi kinerja daripada wawancara bebas.","Herzberg: faktor higiene (gaji) menghilangkan ketidakpuasan; motivator (pengakuan, tanggung jawab) menciptakan kepuasan.","Kepemimpinan transformasional berkaitan dengan komitmen dan inovasi; keselamatan psikologis kunci efektivitas tim."],"tokoh":[{"nama":"Studi Hawthorne","kontribusi":"Menemukan bahwa perhatian terhadap pekerja memengaruhi produktivitas (efek Hawthorne)."},{"nama":"Frederick Taylor","kontribusi":"Manajemen ilmiah yang menekankan efisiensi kerja; dikritik karena mengabaikan aspek psikologis."},{"nama":"Frederick Herzberg","kontribusi":"Teori dua faktor: faktor higiene versus motivator dalam kepuasan kerja."},{"nama":"Locke & Latham","kontribusi":"Teori penetapan tujuan (goal-setting theory)."},{"nama":"Hackman & Oldham","kontribusi":"Model karakteristik pekerjaan yang membuat pekerjaan lebih memotivasi."},{"nama":"Amy Edmondson","kontribusi":"Konsep keselamatan psikologis (psychological safety) dalam tim kerja."}],"istilah":[{"term":"Analisis jabatan","definisi":"Proses mengidentifikasi tugas dan kompetensi yang dibutuhkan suatu posisi kerja."},{"term":"Wawancara terstruktur","definisi":"Wawancara dengan pertanyaan seragam dan panduan penilaian; validitas prediktifnya tinggi."},{"term":"Efek halo","definisi":"Satu kesan positif yang memengaruhi keseluruhan penilaian terhadap seseorang."},{"term":"Umpan balik 360 derajat","definisi":"Penilaian kinerja yang dikumpulkan dari atasan, rekan, bawahan, dan diri sendiri."},{"term":"Faktor higiene","definisi":"Faktor kerja seperti gaji dan kondisi kerja yang bila kurang menimbulkan ketidakpuasan."},{"term":"Motivator","definisi":"Faktor seperti pencapaian dan pengakuan yang benar-benar mendorong kepuasan kerja."},{"term":"Goal-setting theory","definisi":"Teori bahwa tujuan spesifik dan menantang meningkatkan performa kerja."},{"term":"Teori keadilan","definisi":"Teori bahwa pekerja membandingkan rasio masukan dan hasilnya dengan orang lain."},{"term":"Kepemimpinan transformasional","definisi":"Gaya kepemimpinan yang menginspirasi melalui visi bersama dan perhatian individual."},{"term":"Kepemimpinan transaksional","definisi":"Gaya kepemimpinan berbasis pertukaran imbalan dan koreksi atas kinerja."},{"term":"Budaya organisasi","definisi":"Nilai, asumsi, dan norma bersama yang membentuk cara kerja dalam organisasi."},{"term":"Keselamatan psikologis","definisi":"Keyakinan anggota tim bahwa aman mengemukakan pendapat atau mengakui kesalahan."},{"term":"Burnout","definisi":"Kondisi kelelahan emosional, sinisme, dan menurunnya rasa pencapaian akibat stres kerja kronis."}],"quiz":[{"soal":"Proses mengidentifikasi tugas dan kompetensi yang dibutuhkan suatu posisi sebelum merekrut disebut...","pilihan":["Penilaian kinerja","Analisis jabatan","Goal-setting","Seleksi"],"jawaban":2,"penjelasan":"Analisis jabatan menjadi dasar bagi hampir semua proses PIO lain seperti seleksi, pelatihan, dan penilaian kinerja."},{"soal":"Metode wawancara yang terbukti paling valid memprediksi kinerja adalah...","pilihan":["Wawancara bebas dan santai","Wawancara terstruktur dengan pertanyaan dan penilaian seragam","Wawancara tanpa persiapan","Wawancara hanya oleh satu orang"],"jawaban":2,"penjelasan":"Wawancara terstruktur mengurangi bias penilai dan jauh lebih valid memprediksi kinerja dibanding wawancara bebas."},{"soal":"Menurut teori dua faktor Herzberg, menaikkan gaji karyawan paling tepat dipahami sebagai...","pilihan":["Motivator yang pasti meningkatkan kepuasan","Faktor higiene yang menghilangkan ketidakpuasan namun belum tentu memotivasi","Tidak berpengaruh sama sekali","Bentuk hukuman negatif"],"jawaban":2,"penjelasan":"Gaji adalah faktor higiene: ketiadaannya menimbulkan ketidakpuasan, tetapi kehadirannya tidak otomatis menciptakan motivasi sejati."},{"soal":"Menurut goal-setting theory, tujuan kerja yang paling meningkatkan performa adalah tujuan yang...","pilihan":["Samar dan fleksibel","Sangat mudah dicapai","Spesifik, menantang, dan disertai umpan balik","Dirahasiakan dari karyawan"],"jawaban":3,"penjelasan":"Tujuan spesifik dan menantang namun realistis, disertai umpan balik dan penerimaan pekerja, terbukti paling meningkatkan performa."},{"soal":"Pemimpin yang menginspirasi tim melalui visi bersama dan perhatian individual menerapkan gaya kepemimpinan...","pilihan":["Transaksional","Transformasional","Laissez-faire","Otoriter"],"jawaban":2,"penjelasan":"Kepemimpinan transformasional berkaitan dengan komitmen, inovasi, dan kepuasan kerja yang lebih tinggi."},{"soal":"Keyakinan anggota tim bahwa mereka aman mengemukakan pendapat atau mengakui kesalahan disebut...","pilihan":["Keselamatan psikologis","Budaya organisasi","Efek halo","Person-organization fit"],"jawaban":1,"penjelasan":"Keselamatan psikologis adalah salah satu prediktor terkuat efektivitas tim menurut riset Amy Edmondson."},{"soal":"Menurut model demand-control, kondisi kerja yang PALING merusak kesehatan pekerja adalah...","pilihan":["Tuntutan rendah dan kendali tinggi","Tuntutan tinggi dan kendali rendah","Tuntutan rendah dan kendali rendah","Tuntutan tinggi dan kendali tinggi"],"jawaban":2,"penjelasan":"Kombinasi tuntutan tinggi dengan sedikit kendali atas pekerjaan adalah kondisi paling merusak bagi kesehatan."},{"soal":"Tiga komponen burnout adalah...","pilihan":["Kelelahan emosional, sinisme, dan menurunnya rasa pencapaian","Gaji, kondisi kerja, dan kebijakan","Otonomi, kompetensi, keterhubungan","Analitis, kreatif, praktis"],"jawaban":1,"penjelasan":"Burnout terdiri dari kelelahan emosional, depersonalisasi atau sinisme, dan berkurangnya rasa pencapaian pribadi."},{"soal":"Studi Hawthorne menemukan bahwa produktivitas pekerja terutama dipengaruhi oleh...","pilihan":["Tingkat pencahayaan ruangan","Perhatian yang diberikan kepada pekerja","Besarnya gaji semata","Jumlah jam kerja"],"jawaban":2,"penjelasan":"Temuan tak terduga inilah yang melahirkan istilah efek Hawthorne: orang berubah perilakunya ketika merasa diperhatikan atau diamati."},{"soal":"Menurut teori keadilan (equity theory), motivasi kerja dapat menurun ketika...","pilihan":["Gaji absolutnya tinggi","Pekerja merasa rasio masukan dan hasilnya tidak adil dibanding rekan lain","Tujuan kerja terlalu spesifik","Ada umpan balik rutin"],"jawaban":2,"penjelasan":"Yang menentukan bukan hanya besaran kompensasi, melainkan rasa adil ketika membandingkan diri dengan rekan kerja."}],"kasus":{"skenario":"Sebuah perusahaan mengalami penurunan produktivitas. Manajemen menaikkan gaji seluruh karyawan sebesar 15 persen. Keluhan tentang gaji memang berhenti, tetapi setelah tiga bulan produktivitas tidak juga membaik dan karyawan tetap merasa pekerjaannya membosankan serta tidak dihargai.","pertanyaan":"Penjelasan paling tepat atas situasi ini menurut teori dua faktor Herzberg adalah...","pilihan":["Kenaikan gaji terlalu kecil sehingga perlu dinaikkan lagi","Gaji adalah faktor higiene yang hanya menghilangkan ketidakpuasan; motivasi sejati butuh motivator seperti pengakuan, tanggung jawab, dan peluang berkembang","Karyawan tersebut memang tidak dapat dimotivasi","Perusahaan seharusnya menerapkan hukuman bagi yang tidak produktif"],"jawaban":2,"penjelasan":"Herzberg membedakan faktor higiene dan motivator. Memperbaiki gaji menghilangkan sumber ketidakpuasan, tetapi kepuasan dan motivasi sejati tumbuh dari motivator: pencapaian, pengakuan, tanggung jawab, dan pertumbuhan - yang belum disentuh perusahaan ini."},"isian":[{"kalimat":"Gaya kepemimpinan yang berbasis sistem pertukaran imbalan dan koreksi disebut kepemimpinan ___.","jawaban":["transaksional"]},{"kalimat":"Sikap positif atau negatif karyawan terhadap pekerjaannya disebut ___ kerja.","jawaban":["kepuasan"]},{"kalimat":"Nilai dan norma bersama yang membentuk cara kerja suatu perusahaan disebut ___ organisasi.","jawaban":["budaya"]},{"kalimat":"Kondisi kelelahan emosional dan sinisme akibat stres kerja kronis disebut ___.","jawaban":["burnout"]}]},{"nomor":14,"id":"ch14","judul":"Stres, Gaya Hidup, dan Kesehatan","ikon":"heart-pulse","pendahuluan":"Psikologi kesehatan mengkaji bagaimana pikiran, perilaku, dan faktor sosial memengaruhi kesehatan fisik. Bab ini membahas definisi stres, respons tubuh terhadap stres, dampaknya pada kesehatan, strategi coping, serta faktor yang membangun ketahanan dan kesejahteraan.","materi":[{"judul":"Memahami Stres","poin":["STRES adalah proses ketika seseorang menilai tuntutan lingkungan melebihi kemampuannya untuk mengatasinya. STRESSOR adalah pemicunya, sedangkan respons stres adalah reaksi tubuh dan pikiran terhadapnya.","Richard LAZARUS menekankan peran PENILAIAN KOGNITIF. Penilaian PRIMER menilai apakah situasi mengancam, menantang, atau tidak relevan. Penilaian SEKUNDER menilai apakah kita punya sumber daya untuk menghadapinya.","Inilah sebabnya situasi yang sama, misalnya presentasi di depan umum, dapat dinilai sebagai ANCAMAN oleh satu orang dan TANTANGAN oleh orang lain.","EUSTRESS adalah stres yang bersifat memotivasi dan menyegarkan, sedangkan DISTRESS adalah stres yang melemahkan dan merusak.","Jenis stressor: peristiwa hidup besar (kehilangan, pindah, pernikahan), stres harian (hassles) yang justru sering lebih berdampak karena terus berulang, stres kronis, dan trauma.","Holmes dan Rahe menyusun skala peristiwa hidup untuk mengukur beban perubahan hidup, meski kini dikritik karena mengabaikan perbedaan penilaian individu terhadap peristiwa yang sama."]},{"judul":"Respons Fisiologis terhadap Stres","poin":["Respons cepat berjalan lewat jalur SIMPATIS-ADRENAL: sistem saraf simpatis memicu pelepasan adrenalin, sehingga jantung berdebar, napas cepat, dan otot menegang - inilah respons FIGHT OR FLIGHT.","Respons yang lebih lambat berjalan lewat SUMBU HPA (hipotalamus-pituitari-adrenal) yang melepaskan KORTISOL untuk menyediakan energi jangka panjang.","Hans SELYE merumuskan GENERAL ADAPTATION SYNDROME (GAS) dengan tiga tahap.","Tahap ALARM: tubuh mengenali ancaman dan mengaktifkan respons darurat.","Tahap RESISTENSI: tubuh berupaya beradaptasi dan mempertahankan kewaspadaan; secara luar tampak normal, tetapi sumber daya terus terkuras.","Tahap KELELAHAN (exhaustion): sumber daya habis, daya tahan menurun, dan kerentanan terhadap penyakit meningkat.","Shelley Taylor mengajukan pola TEND-AND-BEFRIEND sebagai respons stres yang berorientasi merawat dan mencari dukungan sosial, yang lebih sering teramati pada perempuan."]},{"judul":"Dampak Stres terhadap Kesehatan","poin":["PSIKONEUROIMUNOLOGI mempelajari kaitan antara faktor psikologis, sistem saraf, dan sistem imun.","Stres kronis menekan fungsi imun sehingga memperlambat penyembuhan luka dan meningkatkan kerentanan terhadap infeksi.","Stres berkepanjangan berkaitan dengan hipertensi, penyakit jantung koroner, gangguan pencernaan, gangguan tidur, dan memburuknya kondisi kulit tertentu.","Stres juga bekerja secara TIDAK LANGSUNG melalui perilaku: orang yang tertekan cenderung kurang tidur, makan tidak sehat, jarang berolahraga, dan lebih berisiko merokok atau minum alkohol.","KEPRIBADIAN TIPE A (kompetitif, tergesa-gesa, mudah tersinggung) semula dikaitkan dengan penyakit jantung. Riset lanjutan menunjukkan komponen yang paling berbahaya adalah PERMUSUHAN (hostility) dan kemarahan, bukan sekadar sibuk atau ambisius.","KEPRIBADIAN TIPE B lebih santai dan tidak mudah terprovokasi, dengan risiko kardiovaskular yang relatif lebih rendah."]},{"judul":"Strategi Coping","poin":["PROBLEM-FOCUSED COPING menangani langsung sumber masalah: menyusun rencana, mencari informasi, meminta bantuan konkret, atau mengubah situasi.","EMOTION-FOCUSED COPING mengelola respons emosional terhadap situasi: relaksasi, menulis jurnal, mencari dukungan emosional, atau menafsirkan ulang situasi.","Tidak ada yang selalu lebih baik. Problem-focused coping lebih tepat bila situasinya DAPAT diubah; emotion-focused coping lebih tepat bila situasinya TIDAK dapat diubah, misalnya berduka karena kehilangan.","Strategi yang umumnya MALADAPTIF: penghindaran berkepanjangan, penyangkalan, perenungan berulang (rumination), dan penggunaan zat untuk melarikan diri.","RASA KENDALI (sense of control) sangat protektif. Riset menunjukkan bahwa memiliki kendali atas situasi, sekecil apa pun, menurunkan dampak negatif stres.","OPTIMISME dan gaya penjelasan yang tidak menyalahkan diri secara global berkaitan dengan kesehatan fisik dan mental yang lebih baik."]},{"judul":"Dukungan Sosial dan Ketahanan","poin":["DUKUNGAN SOSIAL adalah salah satu prediktor terkuat kesehatan fisik maupun mental, dan mencakup dukungan emosional, informasional, instrumental (bantuan nyata), serta penghargaan.","HIPOTESIS PENYANGGA (buffering hypothesis): dukungan sosial melindungi terutama pada saat seseorang sedang menghadapi stres tinggi.","KESEPIAN dan isolasi sosial berkaitan dengan risiko kesehatan yang setara dengan faktor risiko fisik utama, sehingga kualitas hubungan bukan sekadar urusan kenyamanan.","RESILIENSI adalah kemampuan bangkit dan beradaptasi setelah kesulitan. Resiliensi bukan sifat langka bawaan, melainkan hasil kombinasi dukungan sosial, keterampilan regulasi emosi, rasa makna, dan keyakinan pada kemampuan diri.","PERTUMBUHAN PASCA-TRAUMA menggambarkan perubahan positif yang dilaporkan sebagian orang setelah melewati kesulitan besar, seperti hubungan yang lebih bermakna dan penghargaan baru terhadap hidup - meski ini tidak boleh dipakai untuk meromantisasi penderitaan."]},{"judul":"Mengelola Stres dan Menjaga Kesehatan","poin":["OLAHRAGA TERATUR adalah salah satu penurun stres paling efektif sekaligus meningkatkan suasana hati, kualitas tidur, dan fungsi kognitif.","TIDUR YANG CUKUP memulihkan kapasitas regulasi emosi; kurang tidur membuat stressor kecil terasa jauh lebih berat.","MINDFULNESS dan MEDITASI melatih perhatian pada saat ini tanpa penghakiman, dan terbukti menurunkan gejala stres serta kecemasan.","RELAKSASI OTOT PROGRESIF dan pernapasan dalam mengaktifkan sistem parasimpatis sehingga menenangkan respons stres.","MANAJEMEN WAKTU dan penetapan prioritas mengurangi stres yang bersumber dari beban yang terasa tidak terkendali.","PSIKOLOGI POSITIF mempelajari faktor yang membuat hidup bermakna: emosi positif, keterlibatan (flow), hubungan, makna, dan pencapaian.","Kebahagiaan dipengaruhi ADAPTASI HEDONIS, yaitu kecenderungan kembali ke tingkat kebahagiaan dasar setelah peristiwa baik maupun buruk. Karena itu praktik seperti rasa syukur dan hubungan bermakna lebih
